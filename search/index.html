# 第9条\n\n公司的经营范围由公司章程规定。公司可以修改公司章程，变更经营范围。\n\n公司的经营范围中属于法律、行政法规规定须经批准的项目，应当依法经过批准。\n\n### 第10条\n\n公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经理担任。\n\n担任法定代表人的董事或者经理辞任的，视为同时辞去法定代表人。\n\n法定代表人辞任的，公司应当在法定代表人辞任之日起三十日内确定新的法定代表人。\n\n### 第11条\n\n法定代表人以公司名义从事的民事活动，其法律后果由公司承受。\n\n公司章程或者股东会对法定代表人职权的限制，不得对抗善意相对人。\n\n法定代表人因执行职务造成他人损害的，由公司承担民事责任。公司承担民事责任后，依照法律或者公司章程的规定，可以向有过错的法定代表人追偿。\n\n### 第12条\n\n有限责任公司变更为股份有限公司，应当符合本法规定的股份有限公司的条件。股份有限公司变更为有限责任公司，应当符合本法规定的有限责任公司的条件。\n\n有限责任公司变更为股份有限公司的，或者股份有限公司变更为有限责任公司的，公司变更前的债权、债务由变更后的公司承继。\n\n### 第13条\n\n公司可以设立子公司。子公司具有法人资格，依法独立承担民事责任。\n\n公司可以设立分公司。分公司不具有法人资格，其民事责任由公司承担。\n\n### 第14条\n\n公司可以向其他企业投资。\n\n法律规定公司不得成为对所投资企业的债务承担连带责任的出资人的，从其规定。\n\n### 第15条\n\n公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\n\n公司为公司股东或者实际控制人提供担保的，应当经股东会决议。\n\n前款规定的股东或者受前款规定的实际控制人支配的股东，不得参加前款规定事项的表决。该项表决由出席会议的其他股东所持表决权的过半数通过。\n\n### 第16条\n\n公司应当保护职工的合法权益，依法与职工签订劳动合同，参加社会保险，加强劳动保护，实现安全生产。\n\n公司应当采用多种形式，加强公司职工的职业教育和岗位培训，提高职工素质。\n\n### 第17条\n\n公司职工依照《中华人民共和国工会法》组织工会，开展工会活动，维护职工合法权益。公司应当为本公司工会提供必要的活动条件。公司工会代表职工就职工的劳动报酬、工作时间、休息休假、劳动安全卫生和保险福"},{"id":"公司法总览","title":"公司法总览","excerpt":"内容定位说明 ： ◆ = 核心规则，实务中最常适用 ▲ = 实务重难点，容易引发争议 ○ = 高频实务问题，值得关注 《公司法》第1条规定： 为了规范公司的组织和行为，保护公司、股东和债权人的合法权益，维护社会经济秩序，促进社会主义市场经济的发展，根据宪法，制定本法。 ◆ 核心目的 ： 规范公司组织和行为 ：确立公司设立、运营、变更、终止的基本规则 保护合法权益 ：平衡公司、股东、债权人三方利益 ","slug":"公司法总览","module":"01-总论","moduleName":"总论","tags":[],"wordCount":7357,"created":"","updated":"","content":"# 公司法总览\r\n\r\n> **内容定位说明**：\r\n> - ◆ = 核心规则，实务中最常适用\r\n> - ▲ = 实务重难点，容易引发争议\r\n> - ○ = 高频实务问题，值得关注\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司法知识体系] --> B[基础理论]\r\n    A --> C[资本制度]\r\n    A --> D[股东权利]\r\n    A --> E[公司治理]\r\n    A --> F[财务会计]\r\n    A --> G[公司变更]\r\n    A --> H[公司终止]\r\n    A --> I[特殊类型]\r\n    A --> J[实务专题]\r\n\r\n    B --> B1[\"§2 基础理论<br>法人格否认·所有权经营权分离·公司章程\"]\r\n    B --> B2[\"§3 公司的分类<br>有限公司·股份公司·母子公司\"]\r\n    B --> B3[\"§4 公司的能力<br>法定代表人·对外担保·越权行为\"]\r\n\r\n    C --> C1[\"§5 公司的设立<br>发起人·出资形式·催缴·失权·加速到期\"]\r\n\r\n    D --> D1[\"§6 股东资格与权利<br>隐名持股·知情权·分红权·回购请求权\"]\r\n\r\n    E --> E1[\"§7 董监高制度<br>忠实勤勉义务·关联交易·审计委员会<br>股东代表诉讼·事实董事·影子董事\"]\r\n\r\n    F --> F1[\"§8 公司财务会计<br>公积金·利润分配·6个月分配期限\"]\r\n\r\n    G --> G1[\"§9 公司重大变更<br>增减资·合并分立·简易合并·对赌协议\"]\r\n\r\n    H --> H1[\"§10 公司解散与清算<br>司法解散·清算义务·简易注销·强制注销\"]\r\n\r\n    I --> I1[\"§11 有限责任公司<br>股权转让·优先购买权·一人公司\"]\r\n    I --> I2[\"§12 股份有限公司<br>类别股·授权资本制·股份回购·上市公司\"]\r\n    I --> I3[\"§13 国家出资公司<br>党组织·外部董事·合规管理\"]\r\n\r\n    J --> J1[\"实务-公司担保的审查与风险\"]\r\n    J --> J2[\"实务-股权转让与出资责任\"]\r\n    J --> J3[\"实务-公司决议效力判断\"]\r\n    J --> J4[\"实务-对赌协议实务\"]\r\n```\r\n\r\n## 二、公司法概述\r\n\r\n### （一）立法目的\r\n\r\n[[📋 公司法知识库/00-公司法全文#第1条\\|《公司法》第1条]]规定：\"为了规范公司的组织和行为，保护公司、股东和债权人的合法权益，维护社会经济秩序，促进社会主义市场经济的发展，根据宪法，制定本法。\"\r\n\r\n◆ **核心目的**：\r\n1. **规范公司组织和行为**：确立公司设立、运营、变更、终止的基本规则\r\n2. **保护合法权益**：平衡公司、股东、债权人三方利益\r\n3. **维护经济秩序**：保障交易安全和市场稳定\r\n4. **促进经济发展**：鼓励投资创业，优化营商环境\r\n\r\n### （二）调整对象\r\n\r\n[[📋 公司法知识库/00-公司法全文#第2条\\|《公司法》第2条]]规定：\"本法所称公司是指依照本法在中国境内设立的有限责任公司和股份有限公司。\"\r\n\r\n**调整范围**：\r\n- **组织关系**：公司的设立、变更、终止\r\n- **行为关系**：公司的经营、管理、对外交易\r\n- **内部关系**：股东之间、股东与公司之间、公司与管理层之间\r\n- **外部关系**：公司与债权人、公司与政府监管部门之间\r\n\r\n### （三）适用范围\r\n\r\n| 适用范围 | 具体内容 |\r\n|---------|---------|\r\n| **空间效力** | 中国境内设立的公司 |\r\n| **主体效力** | 有限责任公司、股份有限公司 |\r\n| **时间效力** | 2024年7月1日起施行 |\r\n| **特别法优先** | 外商投资、国有企业等另有规定的，优先适用特别法 |\r\n\r\n## 三、2024年新公司法修订重大变化\r\n\r\n### （一）注册资本制度变革\r\n\r\n◆ **重大变化**：\r\n1. **5年实缴制**：有限责任公司股东认缴的出资额应当自公司成立之日起五年内缴足（[[📋 公司法知识库/00-公司法全文#第47条\\|《公司法》第47条]]）\r\n2. **股份公司发起人实缴**：发起人应当在公司成立前按照其认购的股份缴纳全部股款（[[📋 公司法知识库/00-公司法全文#第96条\\|《公司法》第96条]]）\r\n3. **出资加速到期**：公司不能清偿到期债务时，公司或者已到期债权的债权人有权要求已认缴出资但"},{"id":"公司法基础理论","title":"公司法基础理论","excerpt":"实务指引 ：独立人格与股东有限责任是公司法的基石，法人人格否认制度是债权人维权的重要工具。理解三者之间的关系，是处理公司纠纷实务的基础。 《公司法》第4条第1款规定： 有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。 ◆ 有限责任的核心要点 ： 有限公司中，股东仅以其 认缴的出资额 对公司债务承担责任 无论是有限公司还是股份公司，在股东有限","slug":"公司法基础理论","module":"01-总论","moduleName":"总论","tags":[],"wordCount":9106,"created":"","updated":"","content":"# 第一章 公司法的基础理论\r\n\r\n## 一、知识框架\r\n\r\n> **实务指引**：独立人格与股东有限责任是公司法的基石，法人人格否认制度是债权人维权的重要工具。理解三者之间的关系，是处理公司纠纷实务的基础。\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"公司法基础理论<br/>（第二至七节）\"] --> B[\"第二节 股东的有限责任<br/>与公司的独立法人地位\"]\r\n    A --> C[\"第三节 法人人格否认制度\"]\r\n    A --> D[\"第四节 所有权与经营权分离\"]\r\n    A --> E[\"第五节 有限责任制度的边界\"]\r\n    A --> F[\"第六节 公司章程\"]\r\n    A --> G[\"第七节 公司法与民法典\"]\r\n\r\n    B --> B1[\"有限责任<br/>认缴出资额为限\"]\r\n    B --> B2[\"独立法人地位<br/>名义独立·财产独立·责任独立\"]\r\n\r\n    C --> C1[\"纵向否认（一般规则）<br/>构成要件·制度特点\"]\r\n    C --> C2[\"横向否认（姊妹公司连带）\"]\r\n    C --> C3[\"适用情形<br/>人格混同·过度支配控制·资本显著不足\"]\r\n    C --> C4[\"程序要点<br/>举证责任·当事人安排\"]\r\n    C --> C5[\"一人公司举证责任倒置\"]\r\n\r\n    E --> E1[\"出资不实·抽逃出资<br/>一人公司·解散未清算\"]\r\n```\r\n\r\n## 二、股东的有限责任和公司的独立法人地位\r\n\r\n### （一）股东的有限责任\r\n\r\n[[📋 公司法知识库/00-公司法全文#第4条\\|《公司法》第4条]]第1款规定：\"有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\"\r\n\r\n◆ **有限责任的核心要点**：\r\n- 有限公司中，股东仅以其**认缴的出资额**对公司债务承担责任\r\n- 无论是有限公司还是股份公司，在股东有限责任层面上，是一致的\r\n- 一般情况下，**股东最大责任范围**是其认缴的出资额。对股东而言，创办公司最大的损失，在一开始便锁定了——其承诺给公司的出资额。除此之外，股东无须承担任何责任\r\n\r\n**有限责任的四个要素**：\r\n\r\n| 要素 | 内容 | 说明 |\r\n|-----|------|------|\r\n| **责任范围** | 以认缴出资额或认购股份为限 | 最大损失已锁定 |\r\n| **责任对象** | 对公司负责 | 不对公司债权人直接负责 |\r\n| **责任性质** | 出资义务 | 非债务清偿义务 |\r\n| **责任时间** | 自认缴或认购时起 | 至出资义务履行完毕 |\r\n\r\n### （二）公司的独立法人地位\r\n\r\n股东出资设立公司，是公司的所有者，但**股东与公司是两个主体，两者相互独立**。\r\n\r\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第3条\\|《公司法》第3条]]：\"公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。\"\r\n\r\n公司的独立性主要体现在如下三个方面：\r\n\r\n```mermaid\r\ngraph TB\r\n    subgraph 公司的独立法人地位\r\n        A[股东] -->|\"出资设立\"| B[公司]\r\n        B --> C[名义独立]\r\n        B --> D[财产独立]\r\n        B --> E[责任独立]\r\n    end\r\n    subgraph 债权人视角\r\n        F[\"公司的潜在交易方应当以公司的经营状况、<br>财务状况判断其资信情况、履约能力，<br>以决定是否将该公司作为交易对手，<br>而不能以公司的股东实力加以判断\"]\r\n    end\r\n    E -->|\"正常情况\"| G[\"债权人不能向公司背后的股东追索\"]\r\n```\r\n\r\n#### 1. 名义独立\r\n\r\n◆ **名义独立的要求**：\r\n- 公司成立后以**独立的名义**为民事法律行为\r\n- 公司与股东是两个独立的主体，两者相互独立\r\n\r\n#### 2. 财产独立\r\n\r\n◆ **财产独立的要求**：\r\n- 公司有**独立的法人财产**，享有法人财产权\r\n- 股东向公司履行出资义务后，对应的财产归公司所有，股东不得取回或擅自使用\r\n- 公司经营取得的利润归属于公司，未经法定的利润分配程序，股东不得擅自占有\r\n- 股东不得随意抽回出资或侵占公司财产\r\n\r\n**《公司法》相关规定**：\r\n- [[📋 公司法知识库/00-公司法全文#第53条\\|第53条]]：股东不得抽逃出资\r\n- [[📋 公司法知识库/"},{"id":"公司的分类","title":"公司的分类","excerpt":"实务指引 ：公司类型的选择直接影响股东权利义务、税负和融资能力，是公司设立时的首要决策。 以股东责任范围为标准，可以将公司分为无限责任公司、两合公司、股份两合公司、有限责任公司和股份有限公司。 公司类型 公司特征 我国法律态度 无限责任公司 股东对公司债务承担无限责任 span style= color:#888 我国目前并无此类公司 /span 两合公司 公司有两类股东，一类承担有限责任，另一类","slug":"公司的分类","module":"01-总论","moduleName":"总论","tags":[],"wordCount":7601,"created":"","updated":"","content":"# 第二章 公司的分类\r\n\r\n> **实务指引**：公司类型的选择直接影响股东权利义务、税负和融资能力，是公司设立时的首要决策。\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司的分类] --> B[\"① 按股东责任范围<br>（最基础的分类）\"]\r\n    A --> C[\"② 按信用基础<br>（人合·资合）\"]\r\n    A --> D[\"③ 按股份能否自由转让<br>（封闭式·开放式）\"]\r\n    A --> E[\"④ 按组织关系★<br>（母子公司·总分公司）\"]\r\n    A --> F[\"⑤ 按注册地<br>（本国公司·外国公司）\"]\r\n    A --> G[\"⑥ 按是否上市<br>（上市公司·非上市公司）\"]\r\n\r\n    A --> H[\"特殊类型公司\"]\r\n    H --> H1[\"国有独资公司<br>（国家单独出资·不设股东会）\"]\r\n    H --> H2[\"一人有限责任公司<br>（举证责任倒置）\"]\r\n\r\n    B --> B1[无限公司]\r\n    B --> B2[两合公司]\r\n    B --> B3[股份两合公司]\r\n    B --> B4[\"有限责任公司 ✅\"]\r\n    B --> B5[\"股份有限公司 ✅\"]\r\n    B4 --- B6[\"有限公司 ≈ 人合兼资合<br>封闭式·不上市\"]\r\n    B5 --- B7[\"股份公司 ≈ 资合为主<br>可封闭·可开放\"]\r\n\r\n    C --> C1[人合公司]\r\n    C --> C2[\"资合公司<br>（上市公司）\"]\r\n    C --> C3[人合兼资合公司]\r\n    C3 --> C4[\"有限公司（人合为主）\"]\r\n    C3 --> C5[\"非上市股份公司（资合为主）\"]\r\n\r\n    D --> D1[\"封闭式公司<br>（有限公司·非上市股份公司）\"]\r\n    D --> D2[\"开放式公司<br>（上市公司）\"]\r\n\r\n    E --> E1[\"总公司 ↔ 分公司<br>（同一法人）\"]\r\n    E --> E2[\"母公司 ↔ 子公司<br>（独立法人）\"]\r\n\r\n    F --> F1[\"本国公司<br>（适用中国公司法）\"]\r\n    F --> F2[\"外国公司<br>（境外设立）\"]\r\n\r\n    G --> G1[\"上市公司<br>（证券交易所交易）\"]\r\n    G --> G2[\"非上市公司<br>（有限公司·非上市股份公司）\"]\r\n```\r\n\r\n## 二、以股东责任范围为标准\r\n\r\n### （一）分类\r\n\r\n以股东责任范围为标准，可以将公司分为无限责任公司、两合公司、股份两合公司、有限责任公司和股份有限公司。\r\n\r\n| 公司类型 | 公司特征 | 我国法律态度 |\r\n|---------|---------|------------|\r\n| **无限责任公司** | 股东对公司债务承担无限责任 | <span style=\"color:#888\">我国目前并无此类公司</span> |\r\n| **两合公司** | 公司有两类股东，一类承担有限责任，另一类承担无限责任 | <span style=\"color:#888\">我国目前并无此类公司</span> |\r\n| **股份两合公司** | 公司有两类股东，一类持有股份、承担有限责任，另一类承担无限责任 | <span style=\"color:#888\">我国目前并无此类公司</span> |\r\n| **有限责任公司和股份有限公司** | 股东承担有限责任 | **我国公司法仅规定了这两类公司** |\r\n\r\n> **实务提示**：我国《公司法》仅承认有限责任公司和股份有限公司两种形式。[[📋 公司法知识库/00-公司法全文#第3条\\|《公司法》第3条]]规定：\"公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。\"[[📋 公司法知识库/00-公司法全文#第4条\\|《公司法》第4条]]规定：\"有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\"\r\n\r\n### （二）有限责任公司与股份有限公司的区别\r\n\r\n有限责任公司（以下简称有限公司）与股份有限公司（以下简称股份公司）的共同点在于**股东均承担有限责任**，两者的不同体现在如下四个方面：\r\n\r\n**1. 股本是否拆分不同**\r\n\r\n股份公司最典型的特征为将股本作等额拆分，每一份额为一张股票，股东按照持有的股份数量行使表决权。有限公司并不对股本进行等额拆分，股东通过章程约定持有一定比例的股权。\r\n\r\n**2. 股权（股份）的流动性不同**"},{"id":"公司的能力","title":"公司的能力","excerpt":"实务指引 ：公司对外担保的决议程序审查是商事交易中最常见的风险防控要点；法定代表人越权担保的善意认定是实务中的核心争议。 公司的权利能力，是指公司作为法律主体，享有权利、承担义务的资格。公司自成立时取得权利能力，至终止时消灭。 始期 ：公司营业执照签发之日（设立登记）。依据《公司法》第33条，公司营业执照签发日期为公司成立日期，公司自成立之日起具有法人资格，享有权利能力。 终期 ：公司注销登记之日","slug":"公司的能力","module":"01-总论","moduleName":"总论","tags":[],"wordCount":10598,"created":"","updated":"","content":"# 第三章 公司的能力\r\n\r\n> **实务指引**：公司对外担保的决议程序审查是商事交易中最常见的风险防控要点；法定代表人越权担保的善意认定是实务中的核心争议。\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司的能力] --> B[权利能力<br>第33条·始终期·限制]\r\n    A --> C[行为能力<br>第10条·法定代表人]\r\n    A --> D[经营范围<br>民法典第65条]\r\n    A --> E[对外投资<br>第14条·范围·决策·金额]\r\n    A --> F[对外担保★★★<br>第15条·越权·上市公司]\r\n    A --> G[侵权行为能力<br>第191条·职务行为]\r\n    A --> H[刑事责任能力<br>单位犯罪]\r\n\r\n    B --> B1[营业执照签发→注销登记]\r\n    B --> B2[性质限制·目的限制·法律限制]\r\n\r\n    C --> C1[选任：执行事务的董事或经理]\r\n    C --> C2[辞任：视为同时辞去法定代表人]\r\n    C --> C3[越权行为效力<br>民法典第504条]\r\n\r\n    D --> D1[经营范围自治 章程规定]\r\n    D --> D2[对外效力 不当然无效]\r\n\r\n    E --> E1[投资范围 向其他企业投资]\r\n    E --> E2[投资决策 董事会/股东会]\r\n    E --> E3[投资金额 章程限额]\r\n\r\n    F --> F1[担保决策<br>非关联方：董事会/股东会<br>关联方：必须股东会]\r\n    F --> F2[越权担保 善意认定<br>担保解释第7条]\r\n    F --> F3[上市公司担保<br>30%+2/3+信息披露]\r\n    F --> F4[无须决议<br>本业·全资·签字]\r\n\r\n    G --> G1[公司替代责任<br>民法典第62、1191条]\r\n    G --> G2[董高直接赔偿<br>第191条 不真正连带]\r\n\r\n    H --> H1[以公司名义+公司意志+为公司利益]\r\n```\r\n\r\n---\r\n\r\n## 二、核心制度详解\r\n\r\n### （一）公司的权利能力\r\n\r\n公司的权利能力，是指公司作为法律主体，享有权利、承担义务的资格。公司自成立时取得权利能力，至终止时消灭。\r\n\r\n#### 1. 权利能力的始期与终期\r\n\r\n**始期**：公司营业执照签发之日（设立登记）。依据[[📋 公司法知识库/00-公司法全文#第33条\\|《公司法》第33条]]，公司营业执照签发日期为公司成立日期，公司自成立之日起具有法人资格，享有权利能力。\r\n\r\n**终期**：公司注销登记之日。公司经清算、注销登记后，法人资格消灭，权利能力终止。需注意，公司在解散后至注销登记前，其法人资格仍然存续，但仅限于清算目的范围内享有权利能力。\r\n\r\n**自然人与公司权利能力的对比**：\r\n\r\n| 对比项 | 自然人 | 公司 |\r\n|--------|--------|------|\r\n| **权利能力** | 平等 | 受营业范围、特许经营、经营状况等因素的影响，具有差异性，并不平等 |\r\n\r\n#### 2. 公司权利能力的限制\r\n\r\n公司的权利能力受到以下三方面限制：\r\n\r\n**（1）性质限制**：公司为法人，不享有自然人基于人身性质的权利，如生命权、健康权、身体权、身份权（如亲权、继承权中的某些人身性权利）等。\r\n\r\n**（2）目的限制（经营范围限制）**：公司的权利能力原则上不受经营范围的限制。《民法典》第65条规定，法人的实际情况与登记的事项不一致的，不得对抗善意相对人。因此，超越经营范围签订的合同原则上有效，但违反国家限制经营、特许经营以及法律、行政法规禁止经营规定的除外。\r\n\r\n**（3）法律限制**：法律、行政法规对公司权利能力的特别限制，如公司不得成为对所投资企业的债务承担连带责任的出资人（[[📋 公司法知识库/00-公司法全文#第14条\\|《公司法》第14条]]）。\r\n\r\n### （二）公司的行为能力\r\n\r\n公司的行为能力，是指公司独立进行意思表示、实施法律行为的能力。公司的行为能力通过其法定代表人、董事会、股东会等机关实现。\r\n\r\n在内部，公司的行为能力通过公司的法人机关来形成和表示。公司的法人机关包括：股东会、董事会和监事会。在外部，公司的行为能力由法定代表人来实现。\r\n\r\n#### 1. 法定代表人制度\r\n\r\n◆ **[[📋 公司法知识库/00-公司法全文#第10条\\|《公司法》第10条]]**：公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经理担任。\r\n\r\n**新公司法重大变"},{"id":"公司的设立","title":"公司的设立","excerpt":"实务指引 ：股东出资制度和发起人责任是公司设立阶段最核心的实务问题，直接影响公司成立后的资本充实和债权人保护。 ◆ 设立与成立的区分 ： 概念 含义 时点 公司设立 发起人依照法定条件和程序，为组建公司并取得法人资格而必须采取和完成的法律行为；设立是一个 过程 从发起人订立设立协议到公司登记成立之前 公司成立 是出资人设立公司行为的 法律后果 营业执照签发之日 为公司成立之日（《公司法》第33条）","slug":"公司的设立","module":"02-设立与股东","moduleName":"设立与股东","tags":[],"wordCount":12696,"created":"","updated":"","content":"# 第四章 公司的设立\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司的设立] --> B[设立概述<br>设立与成立·设立方式]\r\n    A --> C[设立条件<br>有限公司·股份公司]\r\n    A --> D[发起人制度<br>概念·数量·责任]\r\n    A --> E[股东出资]\r\n    A --> F[公司章程<br>概念·制定·效力]\r\n    B --> B1[设立 vs 成立]\r\n    B --> B2[发起设立 vs 募集设立]\r\n    C --> C1[有限公司设立条件]\r\n    C --> C2[股份公司设立条件]\r\n    D --> D1[发起人 vs 股东]\r\n    D --> D2[设立中公司法律地位]\r\n    D --> D3[发起人责任<br>以公司名义·以个人名义·职务侵权]\r\n    E --> E1[出资形式<br>货币·非货币·禁止形式]\r\n    E --> E2[出资方式<br>认缴制·加速到期·验资]\r\n    E --> E3[出资责任<br>对内·对外·发起人连带]\r\n    E --> E4[出资瑕疵影响<br>权利限制·股东失权·诉讼时效·举证责任]\r\n```\r\n\r\n---\r\n\r\n## 二、核心制度详解\r\n\r\n> **实务指引**：股东出资制度和发起人责任是公司设立阶段最核心的实务问题，直接影响公司成立后的资本充实和债权人保护。\r\n\r\n### （一）公司设立概述\r\n\r\n◆ **设立与成立的区分**：\r\n\r\n| 概念 | 含义 | 时点 |\r\n|------|------|------|\r\n| 公司设立 | 发起人依照法定条件和程序，为组建公司并取得法人资格而必须采取和完成的法律行为；设立是一个**过程** | 从发起人订立设立协议到公司登记成立之前 |\r\n| 公司成立 | 是出资人设立公司行为的**法律后果** | **营业执照签发之日**为公司成立之日（[[📋 公司法知识库/00-公司法全文#第33条\\|《公司法》第33条]]）；可发给电子营业执照，与纸质营业执照具有同等法律效力 |\r\n\r\n公司设立主要有两种方式（[[📋 公司法知识库/00-公司法全文#第91条\\|《公司法》第91条]]）：\r\n\r\n| 设立方式 | 适用主体 | 含义 | 特征 |\r\n|----------|----------|------|------|\r\n| 发起设立 | 有限公司/股份公司 | 由发起人认缴全部出资或股份 | 程序简便，不涉及公众投资者 |\r\n| 募集设立 | 仅股份公司 | 发起人认购部分股份，其余向社会公开募集或向特定对象募集 | 程序复杂，涉及公众利益保护 |\r\n\r\n**募集设立的特殊要求**：\r\n- 发起人认购的股份不得少于公司股份总数的35%（[[📋 公司法知识库/00-公司法全文#第97条\\|《公司法》第97条]]）\r\n- 公开募集须经国务院证券监督管理机构核准\r\n- 向特定对象募集（定向募集）的股东人数不得超过200人\r\n\r\n### （二）公司设立的条件\r\n\r\n#### 1. 有限责任公司的设立条件\r\n\r\n设立有限责任公司应当具备下列条件（[[📋 公司法知识库/00-公司法全文#第23条\\|《公司法》第23条]]）：\r\n\r\n1. **股东符合法定人数**（1人以上50人以下）\r\n2. **有符合公司章程规定的全体股东认缴的出资额**\r\n3. **股东共同制定公司章程**\r\n4. **有公司名称**，建立符合有限责任公司要求的组织机构\r\n5. **有公司住所**\r\n\r\n▲ **公司名称的组成**：行政区划 + 字号 + 行业或者经营特点 + 组织形式。例如：重庆觉晓科技有限公司。\r\n\r\n#### 2. 股份有限公司的设立条件\r\n\r\n◆ 设立股份有限公司应当具备下列条件（[[📋 公司法知识库/00-公司法全文#第92条\\|《公司法》第92条]]规定发起人要求，其余条件见第93-95条等）：\r\n\r\n1. **发起人符合法定人数**（1人以上200人以下，其中须有半数以上的发起人在中国境内有住所）\r\n2. **有符合公司章程规定的全体发起人认购的股本总额或者募集的实收股本总额**\r\n3. **股份发行、筹办事项符合法律规定**\r\n4. **发起人制订公司章程**，采用募集设立的须经创立大会通过\r\n5. **有公司名称**，建立符合股份有限公司要求的组织机构\r\n6. **有公司住所**\r\n\r\n### （三）发起人制度\r\n\r\n#### 1. 发起人的概念\r\n\r\n发起人，是指为设立公司而**签署公司章程**、向公司**认购出资或者股份**并**履行公司设立职责**的人。自然人、法人、非法人组织、**国家*"},{"id":"股东资格与股东权利","title":"股东资格与股东权利","excerpt":"实务指引 ：股东资格确认纠纷是公司诉讼中最常见的案由之一。股东资格的取得方式直接影响股东权利的享有和义务的承担。 股东是指向公司出资、持有公司股权/股份、享有股东权利和承担股东义务的主体。股东是公司法上对出资人的特别称谓。 股东的类型 ：股东可以是自然人、法人、非法人组织，还可以是 国家 。 ▲ 行为能力要求 ：公司法对股东 无行为能力 的要求，限制民事行为能力人和无民事行为能力人均可成为公司股东","slug":"股东资格与股东权利","module":"02-设立与股东","moduleName":"设立与股东","tags":[],"wordCount":13502,"created":"","updated":"","content":"# 第五章 股东资格与股东权利\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[股东资格与权利] --> B[股东资格的取得与确认]\r\n    A --> C[隐名持股与冒名股东]\r\n    A --> D[股东权利体系]\r\n    A --> E[知情权]\r\n    A --> F[股东义务]\r\n\r\n    B --> B1[取得：原始取得·继受取得·善意取得]\r\n    B --> B2[确认：出资证明书·股东名册·工商登记]\r\n    B --> B3[股权转让节点与效力]\r\n\r\n    C --> C1[实际出资人与名义股东<br>代持协议·内部关系·外部关系]\r\n    C --> C2[显名化：半数以上同意]\r\n    C --> C3[冒名股东：冒名人担责·被冒名人无责]\r\n\r\n    D --> D1[资产收益权<br>分红权·剩余财产分配权]\r\n    D --> D2[参与管理权<br>表决权·提案权]\r\n    D --> D3[其他权利<br>优先认购权·异议回购权·诉讼权]\r\n\r\n    E --> E1[有限公司<br>任一股东·查阅+复制·会计账簿+凭证]\r\n    E --> E2[股份公司<br>180日+3%·会计账簿+凭证]\r\n    E --> E3[共同规则<br>委托中介·不得剥夺·查旧账]\r\n\r\n    F --> F1[共同义务与特别义务<br>控股股东·实际控制人]\r\n    F --> F2[不得滥用股东权利<br>揭开公司面纱]\r\n    F --> F3[关联交易与竞业禁止]\r\n```\r\n\r\n---\r\n\r\n## 二、股东资格的取得\r\n\r\n> **实务指引**：股东资格确认纠纷是公司诉讼中最常见的案由之一。股东资格的取得方式直接影响股东权利的享有和义务的承担。\r\n\r\n### （一）股东的概念与类型\r\n\r\n股东是指向公司出资、持有公司股权/股份、享有股东权利和承担股东义务的主体。股东是公司法上对出资人的特别称谓。\r\n\r\n**股东的类型**：股东可以是自然人、法人、非法人组织，还可以是**国家**。\r\n\r\n▲ **行为能力要求**：公司法对股东**无行为能力**的要求，限制民事行为能力人和无民事行为能力人均可成为公司股东。\r\n\r\n**股东资格确认之诉**：当事人向人民法院起诉请求确认其股东资格的，应当以**公司为被告**，与案件争议股权有利害关系的人作为**第三人**参加诉讼。\r\n\r\n### （二）原始取得\r\n\r\n原始取得是指通过出资或认缴出资而取得股东资格。\r\n\r\n| 取得方式 | 含义 | 股东资格取得时点 |\r\n|----------|------|------------------|\r\n| 出资取得 | 实际缴纳出资取得股东资格 | 实际出资时（有限公司）；股款缴足时（股份公司） |\r\n| 认缴取得 | 认缴出资即取得股东资格 | 被记载于股东名册时（新公司法下认缴即取得资格，但须在5年内实缴） |\r\n\r\n▲ **实务要点**：新公司法实行5年实缴制后，认缴股东在未实缴出资期间仍具有股东资格，享有股东权利，但其表决权、分红权等权利可依据公司章程被合理限制。\r\n\r\n### （三）继受取得\r\n\r\n继受取得是指通过受让股权、继承、赠与等方式取得股东资格。\r\n\r\n**1. 股权转让**\r\n\r\n◆ **[[📋 公司法知识库/00-公司法全文#第84条\\|《公司法》第84条]]**：有限责任公司的股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下有优先购买权。股东自接到书面通知之日起三十日内未答复的，视为**放弃优先购买权**。\r\n\r\n**◆ 新公司法重大变化**：取消了旧公司法关于对外转让股权须经其他股东过半数同意的规定，简化为**书面通知+优先购买权**制度。\r\n\r\n- **对内转让**：股东之间自由转让（章程可另有规定）\r\n- **对外转让**：书面通知 → 30日未答复视为放弃优先购买权 → 同等条件下其他股东有优先购买权\r\n- 公司章程对股权转让另有规定的，从其规定\r\n\r\n**2. 继承**\r\n\r\n自然人股东死亡后，其合法继承人可以继承股东资格。但是，公司章程另有规定的除外（[[📋 公司法知识库/00-公司法全文#第90条\\|《公司法》第90条]]）。\r\n\r\n▲ **实务注意**：公司章程可以排除或限制股东资格的继承。如果章程约定\"股东死亡后其继承人不得继承股东资格\"，则继承人仅能继承股权对应的财产权益，而不能取得股东资格。\r\n\r\n**3. 赠与**\r\n\r\n股东可以将其股权赠与他人。赠与股权参照股权转让的规则，需遵守公司章"},{"id":"董事-监事-高级管理人员制度","title":"董事、监事、高级管理人员制度","excerpt":"董事 ： 由公司股东会选举产生的，负责公司内部管理和对外经营决策的人员 全体董事组成董事会，董事会是公司的日常经营决策机构 监事 ： 由股东会或职工代表大会选举产生的，负责监督公司财务状况、董事和高级管理人员履职行为的人员 全体监事组成监事会，监事会是公司的监督机构 高级管理人员 （《公司法》第265条）： 公司的经理、副经理、财务负责人、上市公司董事会秘书和公司章程规定的其他人员 高级管理人员由","slug":"董事-监事-高级管理人员制度","module":"03-治理与财务","moduleName":"治理与财务","tags":[],"wordCount":12926,"created":"","updated":"","content":"# 第六章 董事、监事、高级管理人员制度\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[董监高制度] --> B[任职资格与选任]\r\n    A --> C[义务体系]\r\n    A --> D[关联交易规制与竞业禁止]\r\n    A --> G[组织机构选择]\r\n    A --> E[责任体系]\r\n    A --> I[案例分析与对比归纳]\r\n\r\n    B --> B0[概念：董事/监事/高级管理人员/法定代表人]\r\n    B --> B1[消极任职资格：六类不适格情形]\r\n    B --> B2[不适格董监高的处理]\r\n    B --> B3[董事的任期与辞任]\r\n\r\n    C --> C1[忠实义务：避免利益冲突]\r\n    C --> C2[勤勉义务：合理注意]\r\n    C --> C3[实质董事：控股股东/实控人执行事务]\r\n    C --> C4[禁止行为：六项]\r\n\r\n    D --> D1[自我交易：关联交易规制]\r\n    D --> D2[谋取公司商业机会]\r\n    D --> D3[竞业禁止义务]\r\n    D --> D4[关联董事回避表决]\r\n    D --> D5[归入权：违规收入归公司]\r\n\r\n    G --> G1[监事会制度：组成/职权/简化治理]\r\n    G --> G2[审计委员会制度：单层制]\r\n    G --> G3[高级管理人员：范围与职权]\r\n\r\n    E --> E1[对公司的赔偿责任]\r\n    E --> E2[对第三人的赔偿责任]\r\n    E --> E3[影子董事连带责任]\r\n    E --> E4[股东代表诉讼：前置程序与规则]\r\n    E --> E5[股东直接诉讼]\r\n    E --> E6[董事责任保险]\r\n```\r\n\r\n---\r\n\r\n## 二、董监高的任职资格与选任\r\n\r\n### （一）概念\r\n\r\n**董事**：\r\n1. 由公司股东会选举产生的，负责公司内部管理和对外经营决策的人员\r\n2. 全体董事组成董事会，董事会是公司的日常经营决策机构\r\n\r\n**监事**：\r\n1. 由股东会或职工代表大会选举产生的，负责监督公司财务状况、董事和高级管理人员履职行为的人员\r\n2. 全体监事组成监事会，监事会是公司的监督机构\r\n\r\n**高级管理人员**（[[📋 公司法知识库/00-公司法全文#第265条\\|《公司法》第265条]]）：\r\n- 公司的经理、副经理、财务负责人、上市公司董事会秘书和公司章程规定的其他人员\r\n- 高级管理人员由董事会聘任\r\n\r\n**法定代表人**（[[📋 公司法知识库/00-公司法全文#第11条\\|《公司法》第11条]]）：\r\n1. 法定代表人以公司名义从事的民事活动，其法律后果由公司承受\r\n2. 法定代表人依照公司章程的规定，由**代表公司执行公司事务的董事或者经理**担任\r\n3. 担任法定代表人的董事或者经理辞任的，视为**同时辞去法定代表人**\r\n4. 法定代表人辞任的，公司应当在法定代表人辞任之日起**30日内**确定新的法定代表人\r\n5. 公司法定代表人变更，应当办理变更登记，变更登记申请书由**变更后的法定代表人**签署\r\n6. 公司章程或者股东会对法定代表人职权的限制，不得对抗善意相对人\r\n\r\n### （二）不得担任董监高的情形\r\n\r\n◆ [[📋 公司法知识库/00-公司法全文#第178条\\|《公司法》第178条]]规定了六类消极任职资格：\r\n\r\n| 序号 | 情形 | 具体内容 |\r\n|:----:|------|---------|\r\n| ① | 非完全民事行为能力 | 无民事行为能力或者限制民事行为能力 |\r\n| ② | 经济犯罪 | 因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾5年；被宣告缓刑的，自缓刑考验期满之日起未逾2年 |\r\n| ③ | 剥夺政治权利 | 因犯罪被剥夺政治权利，执行期满未逾5年；被宣告缓刑的，自缓刑考验期满之日起未逾2年 |\r\n| ④ | 破产清算 | 担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自破产清算完结之日起未逾3年 |\r\n| ⑤ | 违法被关闭 | 担任因违法被吊销营业执照、责令关闭的公司、企业的**法定代表人**，并负有个人责任的，自被吊销营业执照、责令关闭之日起未逾3年 |\r\n| ⑥ | 较大负债 | 个人因所负数额较大债务到期未清偿被人民法院列为**失信被执行人** |\r\n\r\n### （三）不适格董监高的处理方式\r\n\r\n1. 违反规定选举、委派董事、监事或者聘任高级管理人员的，该选举、委派或者聘任**无效**\r\n2. 董事、监事"},{"id":"公司财务-会计制度","title":"公司财务、会计制度","excerpt":"本章核心法条对应《公司法》第208条至第216条（第十章 公司财务、会计）。 必读法条 ： 法条 要点 重要程度 第208条 年度财务会计报告编制与审计（年审+外审） ★ 第209条 财务会计报告置备：有限公司按章程期限送交；股份公司20日前置备 ★ 第210条 分配顺序与分配比例 ★★★ 第211条 违法分配的责任 ★★★ 第212条 分配时间：6个月 ★★★ 第213条 资本公积金来源 ★★ ","slug":"公司财务-会计制度","module":"03-治理与财务","moduleName":"治理与财务","tags":[],"wordCount":7668,"created":"","updated":"","content":"# 第七章 公司财务、会计制度\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph LR\r\n    A[公司财务会计制度] --> B[财务审计<br>年审·外审·审计独立性]\r\n    A --> C[收益分配制度<br>弥补亏损→法定公积金→任意公积金→分配]\r\n    A --> D[分配比例规则<br>有限公司:实缴比例<br>股份公司:持股比例]\r\n    A --> E[公积金制度<br>盈余公积金·资本公积金]\r\n    A --> F[违法分配与分红权救济<br>退还·赔偿·递进维权]\r\n    A --> G[利润分配时间<br>6个月内]\r\n```\r\n\r\n---\r\n\r\n## 二、核心法条群\r\n\r\n> 本章核心法条对应[[📋 公司法知识库/00-公司法全文#第208条\\|《公司法》第208条]]至[[📋 公司法知识库/00-公司法全文#第216条\\|第216条]]（第十章 公司财务、会计）。\r\n\r\n**必读法条**：\r\n\r\n| 法条 | 要点 | 重要程度 |\r\n|------|------|---------|\r\n| [[📋 公司法知识库/00-公司法全文#第208条\\|第208条]] | 年度财务会计报告编制与审计（年审+外审） | ★ |\r\n| [[📋 公司法知识库/00-公司法全文#第209条\\|第209条]] | 财务会计报告置备：有限公司按章程期限送交；股份公司20日前置备 | ★ |\r\n| [[📋 公司法知识库/00-公司法全文#第210条\\|第210条]] | **分配顺序与分配比例** | ★★★ |\r\n| [[📋 公司法知识库/00-公司法全文#第211条\\|第211条]] | **违法分配的责任** | ★★★ |\r\n| [[📋 公司法知识库/00-公司法全文#第212条\\|第212条]] | **分配时间：6个月** | ★★★ |\r\n| [[📋 公司法知识库/00-公司法全文#第213条\\|第213条]] | 资本公积金来源 | ★★ |\r\n| [[📋 公司法知识库/00-公司法全文#第214条\\|第214条]] | **公积金用途与转增限制** | ★★★ |\r\n| [[📋 公司法知识库/00-公司法全文#第215条\\|第215条]] | 会计师事务所的聘任与解聘 | ★ |\r\n| [[📋 公司法知识库/00-公司法全文#第216条\\|第216条]] | 公司向审计机构提供真实完整会计资料的义务 | ★ |\r\n\r\n---\r\n\r\n## 三、核心制度详解\r\n\r\n### （一）财务审计\r\n\r\n**[[📋 公司法知识库/00-公司法全文#第208条\\|《公司法》第208条]]**：\r\n\r\n公司应当在每一会计年度终了时编制财务会计报告，并依法经会计师事务所审计。核心要求两点：\r\n\r\n1. **年审**：公司应当在每一会计年度终了时编制财务会计报告\r\n2. **外审**：财务会计报告应当依法经会计师事务所审计\r\n\r\n▲ **实务提示**：财务会计报告应当依照法律、行政法规和国务院财政部门的规定制作。上市公司的年度财务会计报告必须经具有证券业务资格的会计师事务所审计。\r\n\r\n**财务会计报告的组成**（《会计法》第20条）：\r\n\r\n| 组成 | 内容 |\r\n|------|------|\r\n| 会计报表 | 资产负债表、利润表、现金流量表、所有者权益变动表 |\r\n| 会计报表附注 | 对报表项目的详细说明 |\r\n| 财务情况说明书 | 生产经营、利润实现和分配、资金增减和周转等情况 |\r\n\r\n▲ **实务重难点**：财务会计报告应当在召开股东会年会的**二十日**前置备于本公司，供股东查阅（[[📋 公司法知识库/00-公司法全文#第209条\\|第209条]]）。\r\n\r\n**审计独立性保障**（[[📋 公司法知识库/00-公司法全文#第215条\\|第215条]]）：\r\n- 公司聘用、解聘承办公司审计业务的会计师事务所，由**股东会、董事会或者监事会**决定（按章程规定）\r\n- 股东会、董事会或监事会就解聘会计师事务所进行表决时，应当允许会计师事务所**陈述意见**\r\n- 不得由经理等高级管理人员单独决定\r\n\r\n---\r\n\r\n### （二）◆ 公司收益分配制度（★★★）\r\n\r\n收益分配制度是公司法中最具实务重要性的制度之一。核心在于平衡股东的投资回报期望与公司资本维持原则。\r\n\r\n#### 1. 利润分配的前提条件\r\n\r\n◆ **核心规则**：股东分红必须**以公司存在利润为前提**；如无利润，不得进行分红，即\"**无盈不分**\"。\r\n\r\n公司的利润形成路径：\r\n\r\n> **营业收入** → 减去营业支出 → **营业利润** → 加上营业外收入、减去营业"},{"id":"公司重大变更","title":"公司重大变更","excerpt":"核心法条群 ： 《公司法》第228条（增资期限）：有限责任公司增加注册资本时，股东认缴新增资本的出资，依照本法设立有限责任公司缴纳出资的有关规定执行。股份有限公司为增加注册资本发行新股时，股东认购新股，依照本法设立股份有限公司缴纳股款的有关规定执行。 《公司法》第227条（优先认购权）：有限责任公司增加注册资本时，股东在同等条件下有权优先按照实缴的出资比例认缴出资。但是，全体股东约定不按照出资比例","slug":"公司重大变更","module":"04-变更与终止","moduleName":"变更与终止","tags":[],"wordCount":14331,"created":"","updated":"","content":"# 第八章 公司重大变更\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A((公司重大变更))\r\n\r\n    A --- B[增资]\r\n    A --- C[减资]\r\n    A --- D[合并]\r\n    A --- E[分立]\r\n    A --- F[组织形式变更]\r\n\r\n    B --- B1[有限公司5年/股份公司实缴]\r\n    B --- B2[优先认购权<br>有限公司法定·股份公司章程]\r\n    B --- B3[对赌协议<br>效力与履行分离]\r\n    B --- B4[投资者增资<br>平价vs溢价]\r\n\r\n    C --- C1[普通减资<br>通知+公告+债权人保护]\r\n    C --- C2[等比例减资<br>全体股东约定可例外]\r\n    C --- C3[简易减资<br>弥补亏损·限制分红]\r\n    C --- C4[违法减资<br>退还+恢复原状+赔偿]\r\n\r\n    D --- D1[吸收合并·新设合并]\r\n    D --- D2[债权人保护<br>概括承受]\r\n    D --- D3[简易合并<br>母子公司·小规模]\r\n\r\n    E --- E1[派生分立·新设分立]\r\n    E --- E2[连带责任<br>书面协议可例外]\r\n\r\n    F --- F1[有限公司⇔股份公司<br>净资产折股]\r\n```\r\n\r\n---\r\n\r\n## 二、增资\r\n\r\n> **核心法条群**：\r\n>\r\n> [[📋 公司法知识库/00-公司法全文#第228条\\|《公司法》第228条]]（增资期限）：有限责任公司增加注册资本时，股东认缴新增资本的出资，依照本法设立有限责任公司缴纳出资的有关规定执行。股份有限公司为增加注册资本发行新股时，股东认购新股，依照本法设立股份有限公司缴纳股款的有关规定执行。\r\n>\r\n> [[📋 公司法知识库/00-公司法全文#第227条\\|《公司法》第227条]]（优先认购权）：有限责任公司增加注册资本时，股东在同等条件下有权优先按照实缴的出资比例认缴出资。但是，全体股东约定不按照出资比例优先认缴出资的除外。股份有限公司为增加注册资本发行新股时，股东不享有优先认购权，公司章程另有规定或者股东会决议决定股东享有优先认购权的除外。\r\n\r\n### （一）增资期限\r\n\r\n| 公司类型 | 出资期限要求 | 法律依据 |\r\n|---------|------------|---------|\r\n| 有限责任公司 | 股东认缴新增资本，须在 **5年内** 缴足 | [[📋 公司法知识库/00-公司法全文#第228条\\|第228条]] |\r\n| 股份有限公司 | 股东认购新股，须 **实缴出资**，全额缴纳后方可办理变更登记 | [[📋 公司法知识库/00-公司法全文#第228条\\|第228条]] |\r\n\r\n▲ **实务要点**：有限公司增资后的出资期限与新设公司一致，均适用5年实缴规定。股份公司增资则更为严格，必须先实缴再登记。\r\n\r\n### （二）决议程序\r\n\r\n增加注册资本属于公司重大事项（[[📋 公司法知识库/00-公司法全文#第66条\\|《公司法》第66条]]）：\r\n\r\n| 公司类型 | 决议机关 | 表决门槛 |\r\n|---------|---------|---------|\r\n| 有限责任公司 | 股东会 | 代表 **2/3以上** 表决权的股东通过 |\r\n| 股份有限公司 | 股东大会 | **出席**会议的股东所持表决权的 **2/3以上** 通过 |\r\n\r\n▲ **实务要点**：注意有限公司与股份公司的区别——有限公司要求\"代表\"2/3以上表决权（全体股东的表决权），股份公司要求\"出席会议\"的2/3以上（出席股东的表决权）。\r\n\r\n### （三）优先认购权\r\n\r\n◆ **核心规则**（[[📋 公司法知识库/00-公司法全文#第227条\\|《公司法》第227条]]）：\r\n\r\n| 公司类型 | 是否享有法定优先认购权 | 行使条件 | 例外 |\r\n|---------|---------|---------|------|\r\n| 有限责任公司 | **享有** | 同等条件下，按 **实缴出资比例** 认缴 | 全体股东约定不按出资比例的除外 |\r\n| 股份有限公司 | **不享有** | — | 章程另有规定或股东会决议赋予的除外 |\r\n\r\n▲ **实务重难点**：\r\n1. 当外部投资者以增资方式入股有限公司时，**应取得原股东放弃优先认缴权的书面声明**，否则增资决议的效力可能受到质疑\r\n2. 有限公司的优先认购权是法定权利，未经全体股东一致同意不得排除\r\n\r\n### （四）投资者增资的处理\r\n\r\n| "},{"id":"公司解散与清算","title":"公司解散与清算","excerpt":"公司终止须经历 解散→清算→注销 三个阶段。解散是起点，清算是过程，注销是终点。三者环环相扣，缺一不可（公司因合并、分立解散的除外）。 ▲ 例外情形 ：简易注销制度下，符合条件的公司可跳过清算过程，直接由解散进入注销。 公司解散，是指已成立的公司基于一定合法事由而消灭的法律行为。公司解散是公司终止的前置程序，解散后必须经过清算程序方可注销。 ◆ 公司出现解散事由，应当在 10日内 将解散事由通过国","slug":"公司解散与清算","module":"04-变更与终止","moduleName":"变更与终止","tags":[],"wordCount":8236,"created":"","updated":"","content":"# 第九章 公司解散与清算\r\n\r\n## 一、解散、清算、注销的总体关系\r\n\r\n公司终止须经历**解散→清算→注销**三个阶段。解散是起点，清算是过程，注销是终点。三者环环相扣，缺一不可（公司因合并、分立解散的除外）。\r\n\r\n```mermaid\r\ngraph LR\r\n    A[出现解散事由] --> B[成立清算组]\r\n    B --> C[注销登记]\r\n```\r\n\r\n> ▲ **例外情形**：简易注销制度下，符合条件的公司可跳过清算过程，直接由解散进入注销。\r\n\r\n---\r\n\r\n## 二、知识框架\r\n\r\n### 总体框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"公司解散与清算\"] --> B[\"公司解散\"]\r\n    A --> C[\"公司清算\"]\r\n    A --> D[\"公司退出\"]\r\n\r\n    B --> B1[\"一般解散（自愿）\"]\r\n    B --> B2[\"强制解散（行政）\"]\r\n    B --> B3[\"司法解散（法院）\"]\r\n\r\n    C --> C1[\"清算类别\"]\r\n    C --> C2[\"清算组职权与责任\"]\r\n    C --> C3[\"清算程序\"]\r\n\r\n    C1 --> C1a[\"自行清算\"]\r\n    C1 --> C1b[\"强制清算\"]\r\n\r\n    C3 --> C3a[\"申报债权\"]\r\n    C3 --> C3b[\"清算方案\"]\r\n    C3 --> C3c[\"清偿债务与分配\"]\r\n    C3 --> C3d[\"清算转破产\"]\r\n    C3 --> C3e[\"清算中诉讼\"]\r\n    C3 --> C3f[\"注销登记\"]\r\n\r\n    D --> D1[\"简易注销\"]\r\n    D --> D2[\"登记机关依职权注销\"]\r\n\r\n    style A fill:#1a73e8,color:#fff,stroke:#1557b0\r\n    style B fill:#34a853,color:#fff,stroke:#2d8e47\r\n    style C fill:#ea8600,color:#fff,stroke:#c77100\r\n    style D fill:#9334e6,color:#fff,stroke:#7a2bc0\r\n```\r\n\r\n### 解散制度详解\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"公司解散\"] --> B[\"一般解散\"]\r\n    A --> C[\"强制解散\"]\r\n    A --> D[\"司法解散\"]\r\n\r\n    B --> B1[\"章程规定的事由出现\"]\r\n    B --> B2[\"股东会决议解散<br>（2/3以上表决权）\"]\r\n    B --> B3[\"因合并或分立解散<br>（无须清算）\"]\r\n\r\n    B1 -.-> B1a[\"公司存续机制<br>修改章程/股东会决议<br>2/3以上表决权\"]\r\n\r\n    C --> C1[\"吊销营业执照\"]\r\n    C --> C2[\"责令关闭\"]\r\n    C --> C3[\"撤销\"]\r\n\r\n    D --> D0[\"法条：第231条\"]\r\n    D --> D1[\"原告：10%以上表决权股东\"]\r\n    D --> D2[\"被告：只能是公司\"]\r\n    D --> D3[\"经营管理严重困难<br>（治理困境≠财务困境）\"]\r\n    D --> D4[\"穷尽其他途径\"]\r\n    D --> D5[\"继续存续致股东<br>利益重大损失\"]\r\n\r\n    D3 --> D3a[\"股东会僵局（2年+）\"]\r\n    D3 --> D3b[\"决议僵局（2年+）\"]\r\n    D3 --> D3c[\"董事会僵局\"]\r\n    D3 --> D3d[\"其他严重困难\"]\r\n\r\n    D --> D6[\"注重调解\"]\r\n    D6 --> D6a[\"公司收购股权<br>（6个月内转让/注销）\"]\r\n    D6 --> D6b[\"股东间转让\"]\r\n    D6 --> D6c[\"减资退出\"]\r\n    D6 --> D6d[\"引入第三方\"]\r\n\r\n    style A fill:#34a853,color:#fff\r\n    style D fill:#ea8600,color:#fff\r\n```\r\n\r\n### 清算制度详解\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"公司清算\"] --> B[\"清算类别\"]\r\n    A --> C[\"清算组职权\"]\r\n    A --> D[\"清算程序\"]\r\n    A --> E[\"清算责任\"]\r\n\r\n    B --> B1[\"自行清算<br>（15日内）\""},{"id":"有限责任公司","title":"有限责任公司","excerpt":"有限责任公司（简称有限公司），与股份公司相比，规模相对较小，具有较大的章程自治空间，运营更加灵活，股权不作等额拆分。 仅能发起设立 ，不能募集设立 发起人为 1~50 人 （《公司法》第42条） 全体股东认缴的出资额须自公司成立之日起 五年内 缴足（《公司法》第47条） 股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等出资（《公司法》第48条） 未按期足额缴纳出资的，应补缴并对","slug":"有限责任公司","module":"05-有限责任公司","moduleName":"有限责任公司","tags":[],"wordCount":13948,"created":"","updated":"","content":"# 第十章 有限责任公司\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph LR\r\n    A((有限责任公司))\r\n\r\n    A --- B[设立与出资<br>仅发起设立·1~50人·5年实缴]\r\n    A --- C[股权转让]\r\n    A --- D[组织机构]\r\n    A --- E[一人公司<br>举证责任倒置]\r\n    A --- F[决议效力]\r\n\r\n    C --- G[常规转让]\r\n    C --- H[特殊情形]\r\n    C --- I[配套制度]\r\n\r\n    G --- G1[对内: 自由]\r\n    G --- G2[对外: 通知+优先购买权]\r\n    G --- G3[强制执行: 20日]\r\n    G --- G4[继承: 当然继承]\r\n\r\n    H --- H1[公司回购<br>异议+受压迫]\r\n    H --- H2[让与担保<br>真担保假让与]\r\n    H --- H3[一股二卖<br>善意取得]\r\n\r\n    I --- I1[出资责任<br>未届期·瑕疵]\r\n    I --- I2[股东名册变更]\r\n    I --- I3[股权归属争议]\r\n\r\n    D --- D1[股东会<br>权力机构]\r\n    D --- D2[董事会<br>经营决策]\r\n    D --- D3[监事会/审计委员会<br>监督]\r\n\r\n    F --- F1[不成立]\r\n    F --- F2[无效]\r\n    F --- F3[可撤销]\r\n```\r\n\r\n---\r\n\r\n## 二、设立与出资概述\r\n\r\n有限责任公司（简称有限公司），与股份公司相比，规模相对较小，具有较大的章程自治空间，运营更加灵活，股权不作等额拆分。\r\n\r\n### （一）设立基本要求\r\n\r\n- **仅能发起设立**，不能募集设立\r\n- 发起人为 **1~50 人**（[[📋 公司法知识库/00-公司法全文#第42条\\|《公司法》第42条]]）\r\n- 全体股东认缴的出资额须自公司成立之日起 **五年内** 缴足（[[📋 公司法知识库/00-公司法全文#第47条\\|《公司法》第47条]]）\r\n\r\n### （二）出资方式与瑕疵责任\r\n\r\n- 股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等出资（[[📋 公司法知识库/00-公司法全文#第48条\\|《公司法》第48条]]）\r\n- 未按期足额缴纳出资的，应补缴并对已按期缴纳的股东承担违约责任；设立时的其他股东在出资不足范围内承担 **连带责任**（[[📋 公司法知识库/00-公司法全文#第50条\\|《公司法》第50条]]）\r\n- 公司不能清偿到期债务的，公司或债权人有权要求未届出资期限的股东 **提前缴纳出资**（[[📋 公司法知识库/00-公司法全文#第54条\\|《公司法》第54条]]，出资加速到期）\r\n- 股东未按章程缴纳出资，公司发出书面催缴书（[[📋 公司法知识库/00-公司法全文#第51条\\|《公司法》第51条]]），经催缴宽限期（不少于60日）届满仍未缴纳的，董事会决议可发出 **失权通知**，该股东丧失未缴纳出资的股权（[[📋 公司法知识库/00-公司法全文#第52条\\|《公司法》第52条]]）\r\n\r\n---\r\n\r\n## 三、股权转让\r\n\r\n> **核心法条群**：\r\n>\r\n> [[📋 公司法知识库/00-公司法全文#第84条\\|《公司法》第84条]]（对内对外转让）：有限责任公司的股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下有优先购买权。股东自接到书面通知之日起三十日内未答复的，视为放弃优先购买权。两个以上股东行使优先购买权的，协商确定各自的购买比例；协商不成的，按照转让时各自的出资比例行使优先购买权。公司章程对股权转让另有规定的，从其规定。\r\n>\r\n> [[📋 公司法知识库/00-公司法全文#第85条\\|《公司法》第85条]]（强制执行）：人民法院依照法律规定的强制执行程序转让股东的股权时，应当通知公司及全体股东，其他股东在同等条件下有优先购买权。其他股东自人民法院通知之日起满二十日不行使优先购买权的，视为放弃优先购买权。\r\n>\r\n> [[📋 公司法知识库/00-公司法全文#第86条\\|《公司法》第86条]]（后续程序）：股东转让股权的，应当书面通知公司，请求变更股东名册；需要办理变更登记的，并请求公司向公司登记机关办理变更登记。公司拒绝或者在合理期限内不予答复的，转让人、受让人可以依法向人民法院提起诉讼。股权转让的，受让人自记载于股东名册时起可以向公司主张行使股东权利。\r\n>\r\n> "},{"id":"股份有限公司","title":"股份有限公司","excerpt":"股份有限公司（以下简称 股份公司 ）是指全部资本划分为等额股份，股东以其所持股份为限对公司承担责任，公司以其全部财产对公司债务承担责任的企业法人。 核心特征： 资合性 ：以资本的结合作为信用基础，股东之间的人身信任关系不是公司存续的前提。这是与有限责任公司人合性特征的根本区别。 开放性 ：股份可以依法自由转让，公司可以通过公开发行股份向社会募集资金。 资本等额性 ：全部资本划分为等额股份，每一股份","slug":"股份有限公司","module":"06-股份有限公司","moduleName":"股份有限公司","tags":[],"wordCount":14657,"created":"","updated":"","content":"# 第十二章 股份有限公司\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[股份有限公司] --> B[设立]\r\n    A --> C[组织机构]\r\n    A --> D[股份发行与转让]\r\n    A --> E[上市公司]\r\n\r\n    B --> B1[概述：发起设立 / 募集设立]\r\n    B --> B2[发起人 1-200人]\r\n    B --> B3[注册资本 实缴制]\r\n    B --> B4[募集设立流程]\r\n\r\n    C --> C1[股东会 年会+临时]\r\n    C --> C2[董事会 3人以上]\r\n    C --> C3[审计委员会 可替代监事会<br>第121条]\r\n    C --> C4[监事会 每6个月至少1次]\r\n\r\n    D --> D1[发行：面额股/无面额股 择一<br>第142条]\r\n    D --> D2[类别股 四种类型<br>第144条]\r\n    D --> D3[授权资本制 董事会3年50%<br>第152条]\r\n    D --> D4[转让：自由转让原则]\r\n    D --> D5[锁定期 原始股东1年/董监高<br>第160条]\r\n    D --> D6[股份回购 6种情形<br>第162条]\r\n    D --> D7[异议股东回购请求权<br>第161条]\r\n    D --> D8[禁止财务资助 10%上限<br>第163条]\r\n\r\n    E --> E1[股东会特别决议 30%+2/3<br>第135条]\r\n    E --> E2[独立董事 ≥1/3<br>第136条]\r\n    E --> E3[关联董事回避<br>第139条]\r\n    E --> E4[股份代持无效<br>第140条]\r\n    E --> E5[禁止交叉持股<br>第141条]\r\n```\r\n\r\n---\r\n\r\n## 二、核心制度详解\r\n\r\n### （一）股份公司的概念与特征\r\n\r\n股份有限公司（以下简称\"股份公司\"）是指全部资本划分为等额股份，股东以其所持股份为限对公司承担责任，公司以其全部财产对公司债务承担责任的企业法人。\r\n\r\n**核心特征：**\r\n\r\n- **资合性**：以资本的结合作为信用基础，股东之间的人身信任关系不是公司存续的前提。这是与[[📋 公司法知识库/11-有限责任公司|有限责任公司]]人合性特征的根本区别。\r\n- **开放性**：股份可以依法自由转让，公司可以通过公开发行股份向社会募集资金。\r\n- **资本等额性**：全部资本划分为等额股份，每一股份金额相等，体现股东平等原则。\r\n- **组织规范性**：法律对股份公司的组织机构、议事规则、信息披露等有更为严格的要求。\r\n\r\n---\r\n\r\n### （二）◆ 股份公司的设立\r\n\r\n#### 1. 概述\r\n\r\n| 设立方式 | 发起设立 | 募集设立 |\r\n|---------|---------|---------|\r\n| 定义 | 由发起人认购设立公司时应发行的**全部股份**而设立公司 | 由发起人认购公司应发行股份的**一部分**，其余股份向社会公开募集或向特定对象募集而设立公司 |\r\n| 发起人认购比例 | 认购全部股份 | 不得少于公司股份总数的 **35%**（[[📋 公司法知识库/00-公司法全文#第97条\\|《公司法》第97条]]） |\r\n| 适用场景 | 规模较小、股东人数较少 | 需要大规模融资的企业 |\r\n| 程序复杂度 | 相对简单 | 需公告招股说明书、签订承销协议等 |\r\n\r\n> ○ **有限公司对比**：有限公司只能采取发起设立的方式，股份公司可以选择发起设立或募集设立。\r\n\r\n#### 2. 发起人\r\n\r\n◆ **发起人条件**：应当有 **1人以上200人以下** 为发起人（新公司法允许一人发起设立股份公司），其中 **半数以上** 的发起人在中国境内有住所（[[📋 公司法知识库/00-公司法全文#第92条\\|《公司法》第92条]]）。\r\n\r\n发起人既可以是自然人，也可以是法人。法律、行政法规禁止从事营利性活动的人（如公务员）不得作为发起人。\r\n\r\n◆ **发起人协议**：发起人承担公司筹办事务，应当签订**发起人协议**，明确各自在公司设立过程中的权利和义务（[[📋 公司法知识库/00-公司法全文#第93条\\|《公司法》第93条]]）。\r\n\r\n#### 3. 注册资本\r\n\r\n◆ **注册资本** 为在公司登记机关登记的 **已发行股份的股本总额**（[[📋 公司法知识库/00-公司法全文#第96条\\|《公司法》第96条]]）。与有限公司不同，股份公司的注册资本不采用\"认缴制\"，而是以实际已发行的股份票面金额"},{"id":"国家出资公司","title":"国家出资公司","excerpt":"◆ 新公司法设专章（第七章）规定 国家出资公司组织机构的特别规定 ，这是新公司法的重大立法创新。《公司法》第168条规定： 国家出资公司 ，是指国家出资的国有独资公司、国有资本控股公司，包括国家出资的有限责任公司、股份有限公司。 ▲ 实务中需注意以下两点： 国家出资公司仅限于国家 直接出资 的公司，而不包括国家出资公司再投资设立的公司。 国有资本参股公司 不属于 国家出资公司。 中石油集团与中石油","slug":"国家出资公司","module":"07-特殊公司","moduleName":"特殊公司","tags":[],"wordCount":7549,"created":"","updated":"","content":"# 第十二章 国家出资公司\r\n\r\n## 一、知识框架\r\n\r\n```mermaid\r\ngraph TD\r\n    A[国家出资公司] --> B[概念与范围<br>直接出资·排除参股]\r\n    A --> C[特殊治理结构]\r\n    A --> C2[特别规定<br>章程·审计委员会]\r\n    A --> D[关联交易与董事责任]\r\n    A --> E[国有资产评估与转让<br>配套法规]\r\n    A --> F[实务要点与案例]\r\n    C --> C1[不设股东会<br>出资人机构决定8项<br>7-1+2+担保]\r\n    C --> C3[董事会<br>外部董事过半数·职工代表]\r\n    C --> C4[经理与兼职限制]\r\n    C --> C5[党组织领导作用]\r\n    F --> F1[混改风险]\r\n    F --> F2[股权转让审批]\r\n    F --> F3[流失责任]\r\n    F --> F4[合规管理]\r\n    F --> F5[案例分析]\r\n```\r\n\r\n---\r\n\r\n## 二、核心制度详解\r\n\r\n### （一）国家出资公司的概念与范围\r\n\r\n◆ 新公司法设专章（第七章）规定\"国家出资公司组织机构的特别规定\"，这是新公司法的重大立法创新。[[📋 公司法知识库/00-公司法全文#第168条\\|《公司法》第168条]]规定：**国家出资公司**，是指国家出资的国有独资公司、国有资本控股公司，包括国家出资的有限责任公司、股份有限公司。\r\n\r\n▲ 实务中需注意以下两点：\r\n1. 国家出资公司仅限于国家**直接出资**的公司，而不包括国家出资公司再投资设立的公司。\r\n2. 国有资本参股公司**不属于**国家出资公司。\r\n\r\n> **中石油集团与中石油股份公司的区别**\r\n>\r\n> 中国石油天然气集团有限公司（简称中石油集团）由国务院国资委100%持股，系国有独资公司，属于国家出资公司。中国石油天然气股份有限公司（简称中石油股份公司，SH.601857）由中石油集团持股82.46%，系国家出资公司再投资设立的公司，**不属于**国家出资公司。\r\n>\r\n> ```\r\n> 国务院国资委\r\n>     100%\r\n>      ↓\r\n>   中石油集团  ← 国家出资公司（国有独资公司）\r\n>     82.46%\r\n>      ↓\r\n>   中石油股份公司  ← 不属于国家出资公司\r\n> ```\r\n\r\n#### 国有独资公司的概念\r\n\r\n◆ 国有独资公司，是指国家单独出资、由国务院或者地方人民政府授权本级人民政府国有资产监督管理机构履行出资人职责的公司。国有独资公司是国家出资公司的特殊形态，适用第七章的特别规定。\r\n\r\n#### 履行出资人职责的机构\r\n\r\n1. 国家出资公司，由国务院或者地方人民政府分别代表国家依法履行出资人职责，享有出资人权益。[[📋 公司法知识库/00-公司法全文#第169条\\|《公司法》第169条]]\r\n2. 国务院或者地方人民政府可以授权国有资产监督管理机构或者其他部门、机构代表本级人民政府对国家出资公司履行出资人职责。代表本级人民政府履行出资人职责的机构、部门，统称为**履行出资人职责的机构**。\r\n\r\n### （二）◆ 国家出资公司的特殊治理结构\r\n\r\n#### 1. 不设股东会，由履行出资人职责的机构行使股东会职权\r\n\r\n◆ [[📋 公司法知识库/00-公司法全文#第172条\\|《公司法》第172条]]规定：国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权。履行出资人职责的机构可以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改，公司的合并、分立、解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的机构 **决定**。\r\n\r\n▲ **须由履行出资人职责的机构决定的事项**：\r\n\r\n根据 [[📋 公司法知识库/00-公司法全文#第66条\\|《公司法》第66条]] 第3款，有限责任公司股东会的特别决议事项（经代表三分之二以上表决权的股东通过）共6项：①修改公司章程；②增加或者减少注册资本；③公司合并；④公司分立；⑤公司解散；⑥变更公司形式。\r\n\r\n此外，[[📋 公司法知识库/00-公司法全文#第15条\\|《公司法》第15条]]规定\"为他人提供担保\"由**公司章程规定**由董事会或股东会决议——此即第66条所附\"7个特别决议事项\"中\"⑦为他人提供担保\"的来源。\r\n\r\n国有独资公司不设股东会，**减去\"变更公司形式\"**（没有股东会即无此决议需求），**加上\"申请破产\"和\"分配利润\"**（[[📋 公司法知识库/00-公司法全文#第172条\\|《公司法》第172条]]国有资产监管的特殊性要求），形成\"7-1+2\"规则"},{"id":"王毓莹教授公司法学术观点","title":"王毓莹教授公司法学术观点","excerpt":"内容定位 ：本专题系统整理王毓莹教授在公司法领域的核心学术观点，重点收录其经典论文的核心论证与原文精华，与知识库各章节作双链衔接，便于对照学习与实务应用。 项目 内容 姓名 王毓莹 现任职务 中国政法大学法律学院教授、博士生导师 研究中心 中国政法大学合规与风险防控研究中心主任 曾任职务 最高人民法院二级高级法官（近20年审判经历） 挂职经历 最高人民检察院第六检察厅副厅长 立法参与 《公司法》修","slug":"王毓莹教授公司法学术观点","module":"10-学者观点","moduleName":"学者观点","tags":[],"wordCount":11634,"created":"","updated":"","content":"# 王毓莹教授公司法学术观点专题\r\n\r\n> **内容定位**：本专题系统整理王毓莹教授在公司法领域的核心学术观点，重点收录其经典论文的核心论证与原文精华，与知识库各章节作双链衔接，便于对照学习与实务应用。\r\n\r\n---\r\n\r\n## 一、学者简介\r\n\r\n### 基本信息\r\n\r\n| 项目 | 内容 |\r\n|------|------|\r\n| **姓名** | 王毓莹 |\r\n| **现任职务** | 中国政法大学法律学院教授、博士生导师 |\r\n| **研究中心** | 中国政法大学合规与风险防控研究中心主任 |\r\n| **曾任职务** | 最高人民法院二级高级法官（近20年审判经历） |\r\n| **挂职经历** | 最高人民检察院第六检察厅副厅长 |\r\n| **立法参与** | 《公司法》修改组工作组成员 |\r\n| **荣誉** | \"2021中国商法年度人物\" |\r\n| **公众号** | \"法盏\"（关注人数超10万） |\r\n\r\n### 学术背景\r\n\r\n- **博士**（2002-2005）：中国政法大学 民商法学（公司法方向）\r\n- **硕士**（1999-2002）：中国政法大学 民商法学（公司法方向）\r\n\r\n### 审判经历\r\n\r\n2002年7月至2020年12月，历任最高人民法院民一庭书记员、助理审判员、审判员，最高人民法院第一巡回法庭、最高人民法院民二庭主审法官、审判长。审理民商事案件数千件，所办案件多次入选指导性案例、人民法院公报案例和《人民法院案例选》。\r\n\r\n### 司法解释起草\r\n\r\n在最高人民法院工作期间，主笔和参与了大量司法解释、规范性文件的起草工作，包括：\r\n- 《关于审理民间借贷案件适用法律若干问题的规定》\r\n- 《关于适用〈中华人民共和国公司法〉若干问题的规定（五）》\r\n- 《新建设工程施工合同司法解释（一）》\r\n- 《第九次全国民商事审判会议纪要》（[[📋 公司法知识库/01-公司法总览|九民纪要]]）\r\n- 《网络消费纠纷司法解释（一）》\r\n- 《关于审理执行异议之诉案件适用法律若干问题的规定》等\r\n\r\n### 学术定位\r\n\r\n王毓莹教授兼具深厚的理论功底与丰富的实务经验，其研究特点是**\"从裁判视角出发、以问题为导向\"**，注重理论与实务的结合，善于在学术争议中提出独到观点并指明裁判趋向。其研究覆盖公司法核心制度，尤其在[[📋 公司法知识库/02-公司法基础理论|公司资本制度]]、[[📋 公司法知识库/07-董监高制度|董事义务]]、[[📋 公司法知识库/02-公司法基础理论|法人人格否认]]等领域具有重要学术影响力。\r\n\r\n---\r\n\r\n## 二、主要著作与论文\r\n\r\n### （一）代表著作\r\n\r\n| 著作名称 | 出版信息 | 内容定位 |\r\n|---------|---------|---------|\r\n| 《新公司法二十四讲：审判原理与疑难问题深度释解》 | 法律出版社2024年版 | 以近30年公司法研学功力，从裁判视角解读新公司法实务难点，涉及近百个典型案例 |\r\n\r\n**著作特色**：\r\n1. **鲜明的问题意识**：聚焦公司治理纠纷高频、疑难复杂命题\r\n2. **独特的编排体例**：每专题沿\"规范梳整→理论基础→审判实务→典型案例\"脉络展开\r\n3. **精到的案例分析**：案例绝大多数为最高法院指导性案例、公报案例\r\n4. **真切的立法回应**：对历次修订草案一一作出回应，分析利弊得失\r\n\r\n> **来源链接**：[法制日报推荐](http://www.legaldaily.com.cn/newzt/content/2024-04/23/content_8988110.html) | [中国政法大学法律学院教师主页](https://flxy.cupl.edu.cn/info/1199/14238.htm)\r\n\r\n### （二）公司法核心论文一览\r\n\r\n| 序号 | 论文标题 | 期刊 | 年份/期次 | 关联知识点 |\r\n|------|---------|------|----------|-----------|\r\n| 1 | 论董事对股东出资的催缴义务 | 《现代法学》CLSCI | 2024年第6期 | [[📋 公司法知识库/05-公司的设立|公司的设立]]、[[📋 公司法知识库/07-董监高制度|董监高制度]] |\r\n| 2 | 论股份回购的资本规制 | 《比较法研究》CLSCI | 2025年第1期 | [[📋 公司法知识库/08-公司财务会计|财务会计]]、[[📋 公司法知识库/12-股份有限公司|股份有限公司]] |\r\n| 3 | 公司减资规则的反思与重构 | 《环球法律评论》CLSCI | 2024年第1期 | [[📋 公司法知识库/09-"},{"id":"实务-公司决议效力判断","title":"实务-公司决议效力判断","excerpt":"公司决议是公司意思形成的核心机制。股东会决议和董事会决议作为公司最高决策的形式，其效力直接关系到公司行为的合法性基础。在实务中，公司决议效力争议是公司诉讼中最常见的类型之一。 典型争议场景 ： 未实际召开会议却形成了 决议 ； 会议通知程序存在瑕疵； 表决权比例未达到法定或章程要求； 决议内容违反法律或公司章程； 利害关系股东参与表决。 这些问题的核心是： 在公司决议存在程序或内容瑕疵时，如何判断","slug":"实务-公司决议效力判断","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":5024,"created":"","updated":"","content":"# 实务：公司决议效力判断\r\n\r\n## 一、问题引入：公司决议效力争议的类型化分析\r\n\r\n公司决议是公司意思形成的核心机制。股东会决议和董事会决议作为公司最高决策的形式，其效力直接关系到公司行为的合法性基础。在实务中，公司决议效力争议是公司诉讼中最常见的类型之一。\r\n\r\n**典型争议场景**：\r\n- 未实际召开会议却形成了\"决议\"；\r\n- 会议通知程序存在瑕疵；\r\n- 表决权比例未达到法定或章程要求；\r\n- 决议内容违反法律或公司章程；\r\n- 利害关系股东参与表决。\r\n\r\n这些问题的核心是：**在公司决议存在程序或内容瑕疵时，如何判断其效力？** 新《公司法》建立了\"不成立—可撤销—无效\"三层次的效力判断体系，为司法实践提供了清晰的裁判框架。\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司决议效力争议] --> B{决议是否成立?}\r\n    B -->|不成立| C[决议不成立<br>第27条]\r\n    B -->|成立| D{内容是否违法?}\r\n    D -->|违反法律/行政法规| E[决议无效<br>第25条]\r\n    D -->|内容合法| F{程序/内容<br>是否违反章程?}\r\n    F -->|是| G[决议可撤销<br>第26条]\r\n    F -->|否| H[决议有效]\r\n    C --> I[自始无效<br>不存在效力问题]\r\n    E --> I\r\n    G --> J[除斥期间60日<br>逾期则有效]\r\n    style C fill:#f96,stroke:#333\r\n    style E fill:#f96,stroke:#333\r\n    style G fill:#ff9,stroke:#333\r\n    style H fill:#6f9,stroke:#333\r\n    style I fill:#f96,stroke:#333\r\n    style J fill:#ff9,stroke:#333\r\n```\r\n\r\n---\r\n\r\n## 二、法律框架\r\n\r\n新[[📋 公司法知识库/00-公司法全文#第25条\\|《公司法》第25-28条]]建立了公司决议效力的三层次体系：\r\n\r\n| 效力状态 | 法律条文 | 瑕疵类型 | 法律后果 |\r\n|----------|----------|----------|----------|\r\n| 不成立 | 第27条 | 严重程序瑕疵 | 自始不存在 |\r\n| 无效 | 第25条 | 内容违法 | 自始无效 |\r\n| 可撤销 | 第26条 | 程序/内容违反章程 | 可撤销 |\r\n\r\n---\r\n\r\n## 三、◆ 决议不成立（第27条）\r\n\r\n### （一）法律依据\r\n\r\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第27条\\|《公司法》第27条]]规定了决议不成立的情形，包括：未召开会议、会议未对决议事项进行表决、出席会议的人数或表决权不符合规定等。\r\n\r\n结合《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定（四）》（以下简称《公司法司法解释四》），决议不成立的情形包括：\r\n\r\n### （二）决议不成立的具体情形\r\n\r\n**1. 未召开会议**\r\n\r\n公司未召开股东会、董事会会议，却形成了所谓的\"决议\"。这种情形下，决议不具备成立的基本要件，属于最严重的程序瑕疵。\r\n\r\n**典型情形**：\r\n- 仅有部分股东签字，未实际召开会议；\r\n- 以书面传签方式替代会议，但不符合章程规定；\r\n- 董事会成员仅通过电话或微信沟通，未形成正式会议记录。\r\n\r\n**2. 未对决议事项进行表决**\r\n\r\n虽然召开了会议，但未对相关事项进行表决。例如：\r\n- 会议议程中未包含该决议事项；\r\n- 会议记录中无表决记载；\r\n- 以\"一致同意\"替代正式表决程序。\r\n\r\n**3. 出席人数或表决权不达标**\r\n\r\n出席会议的人数或股东所持表决权不符合法律或公司章程的规定。例如：\r\n- 有限公司股东会出席人数不足章程要求；\r\n- 股份公司股东大会出席股东所持股份不足法定比例。\r\n\r\n**4. 表决结果未达到法定或章程比例**\r\n\r\n表决结果未达到《公司法》或者公司章程规定的通过比例。例如：\r\n- 普通决议未达到出席会议的股东所持表决权过半数通过；\r\n- 特别决议未达到三分之二以上表决权通过。\r\n\r\n### （三）不成立的法律后果\r\n\r\n◆ **决议不成立的法律后果**：\r\n- 决议自始不存在，不产生任何法律效力；\r\n- 基于该决议实施的行为可能被认定为无效；\r\n- 任何利害关系人均可主张决议不成立；\r\n- 不受诉讼时效限制（确认之诉不适用诉讼时效）。\r\n\r\n---\r\n\r\n## 四、◆ 决议可撤销（第26条）\r\n"},{"id":"实务-公司担保的审查与风险","title":"实务-公司担保的审查与风险","excerpt":"公司对外担保是商事交易中最常见的增信方式之一，也是司法实务中纠纷最为集中的领域之一。其高频争议的核心原因在于： 公司对外担保涉及公司意思表示的形成、法定代表人权限的边界、相对人合理信赖的保护等多重法律关系的交织 。 在实践中，大量担保纠纷源于以下场景： 法定代表人未经公司决议擅自对外提供担保； 公司章程对担保设有限制，但相对人未予审查； 关联担保中未执行回避表决程序； 上市公司对外担保未履行信息披","slug":"实务-公司担保的审查与风险","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":6098,"created":"","updated":"","content":"# 实务：公司担保的审查与风险\r\n\r\n## 一、问题引入：公司对外担保为何是高频纠纷领域\r\n\r\n公司对外担保是商事交易中最常见的增信方式之一，也是司法实务中纠纷最为集中的领域之一。其高频争议的核心原因在于：**公司对外担保涉及公司意思表示的形成、法定代表人权限的边界、相对人合理信赖的保护等多重法律关系的交织**。\r\n\r\n在实践中，大量担保纠纷源于以下场景：\r\n- 法定代表人未经公司决议擅自对外提供担保；\r\n- 公司章程对担保设有限制，但相对人未予审查；\r\n- 关联担保中未执行回避表决程序；\r\n- 上市公司对外担保未履行信息披露义务。\r\n\r\n这些问题的实质是：**当公司内部治理程序存在瑕疵时，对外担保合同的效力如何认定？** 这需要在公司自治、交易安全与善意保护之间寻求平衡。\r\n\r\n```mermaid\r\ngraph TD\r\n    A[公司对外担保] --> B{是否有决议?}\r\n    B -->|有| C{决议是否合法?}\r\n    B -->|无| D[越权代表]\r\n    C -->|合法| E[担保有效]\r\n    C -->|不合法| F{相对人是否善意?}\r\n    D --> F\r\n    F -->|善意| G[担保有效<br>公司承担责任]\r\n    F -->|非善意| H[担保对公司<br>不发生效力]\r\n    style D fill:#f96,stroke:#333\r\n    style H fill:#f96,stroke:#333\r\n    style E fill:#6f9,stroke:#333\r\n    style G fill:#6f9,stroke:#333\r\n```\r\n\r\n---\r\n\r\n## 二、法律框架\r\n\r\n### （一）[[📋 公司法知识库/00-公司法全文#第15条\\|《公司法》第15条]]：公司对外担保的决议程序\r\n\r\n◆ **核心规则**：2024年新[[📋 公司法知识库/00-公司法全文#第15条\\|《公司法》第15条]]（原《公司法》第16条）确立了公司对外担保的基本决议程序框架，是判断担保效力的核心法律依据。\r\n\r\n#### 1. 一般担保\r\n\r\n公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议。这意味着：\r\n\r\n- **决议机关的授权来源是公司章程**，而非法律的直接规定；\r\n- 公司可以选择由董事会或股东会作为决议机关；\r\n- 如果章程未明确规定，则应由股东会决议（重大事项原则）。\r\n\r\n#### 2. 关联担保（为股东或实际控制人提供担保）\r\n\r\n◆ **核心规则**：公司为公司股东或者实际控制人提供担保的，**必须经股东会决议**。这是法律的强制性规定，公司章程不得降低为董事会决议。\r\n\r\n关联担保的特殊要求：\r\n- **决议机关**：必须是股东会，不得由董事会决议替代；\r\n- **回避表决**：受担保的股东或者受实际控制人支配的股东，不得参加该事项的表决；\r\n- **表决通过**：该项表决由出席会议的其他股东所持表决权的过半数通过。\r\n\r\n#### 3. 上市公司对外担保的特别规定\r\n\r\n上市公司对外担保受到更为严格的监管：\r\n- 须遵守证券交易所的上市规则中关于担保的特别规定；\r\n- 必须及时履行信息披露义务；\r\n- 对外担保总额不得超过公司净资产的一定比例（交易所规则）；\r\n- 为控股股东、实际控制人及其关联方提供担保受到严格限制。\r\n\r\n### （二）《民法典》第504条：法定代表人越权代表\r\n\r\n◆ **核心规则**：法人的法定代表人或者非法人组织的负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，该代表行为有效，订立的合同对法人或者非法人组织发生效力。\r\n\r\n这一条文将[[📋 公司法知识库/04-公司的能力#3. 越权行为的效力\\|越权担保]]的效力问题转化为**相对人善意与否的判断**：\r\n- 相对人善意 → 担保合同对公司发生效力；\r\n- 相对人非善意 → 担保合同对公司不发生效力。\r\n\r\n---\r\n\r\n## 三、善意相对人保护\r\n\r\n### （一）善意的认定标准\r\n\r\n◆ **核心规则**：根据《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（以下简称《担保制度解释》），善意相对人的认定标准为：\r\n\r\n> 相对人在订立担保合同时不知道且不应当知道法定代表人超越权限。相对人有证据证明已对公司决议进行了合理审查，人民法院应当认定其构成善意，但公司有证据证明相对人知道或者应当知道决议系伪造、变造的除外。\r\n\r\n**\"合理审查\"的内涵**：\r\n- 形式审查：审查是否有决议文件、决议机关是否正确、签章是否齐全；\r\n- 不要求实质审查：不要求相对人核实决议的真实性、签名的真伪；\r\n"},{"id":"实务-对赌协议实务","title":"实务-对赌协议实务","excerpt":"对赌协议 （Valuation Adjustment Mechanism，VAM），又称估值调整协议，是投资方与融资方在达成股权融资协议时，为解决交易双方对目标公司未来发展的不确定性、信息不对称以及代理成本而设计的条款。其本质是一种 附条件的合同履行安排 ——双方以目标公司未来的经营业绩或特定事件作为条件，约定相应的权利义务调整。 实务背景 ：在PE/VC股权投资中，投资方对目标公司的估值通常基于","slug":"实务-对赌协议实务","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":9476,"created":"","updated":"","content":"# 实务：对赌协议实务\r\n\r\n## 一、问题引入：对赌协议的概念与实务背景\r\n\r\n**对赌协议**（Valuation Adjustment Mechanism，VAM），又称估值调整协议，是投资方与融资方在达成股权融资协议时，为解决交易双方对目标公司未来发展的不确定性、信息不对称以及代理成本而设计的条款。其本质是一种**附条件的合同履行安排**——双方以目标公司未来的经营业绩或特定事件作为条件，约定相应的权利义务调整。\r\n\r\n**实务背景**：在PE/VC股权投资中，投资方对目标公司的估值通常基于对未来盈利能力的预测。然而，未来充满不确定性：目标公司能否达到预期业绩？能否如期上市？管理团队能否兑现承诺？对赌协议正是为解决这些不确定性而生的商业工具。它将投资方的风险部分转移给融资方，同时给予融资方获取更高估值的机会，实现风险与收益的再平衡。\r\n\r\n**争议焦点**：对赌协议虽然是商业实践中的常见安排，但在司法实践中引发了大量争议，核心问题集中在两个层面：其一，对赌协议的**效力**如何认定？其二，即使有效，对赌条款的**实际履行**是否受到公司法资本制度的限制？这些问题涉及合同法的意思自治原则与公司法的资本维持原则之间的深层冲突。\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"对赌协议争议\"] --> B{\"对赌主体是谁？\"}\r\n    B --> C[\"投资方 vs 目标公司\"]\r\n    B --> D[\"投资方 vs 股东/实控人\"]\r\n    D --> E[\"原则上有效<br>（意思自治）\"]\r\n    C --> F{\"协议效力如何？\"}\r\n    F -->|\"无法定无效事由\"| G[\"协议有效\"]\r\n    F -->|\"存在法定无效事由\"| H[\"协议无效\"]\r\n    G --> I{\"条款能否实际履行？\"}\r\n    I --> J{\"是否符合<br>减资程序？\"}\r\n    J -->|\"股东会决议通过<br>债权人保护完成\"| K[\"可以履行\"]\r\n    J -->|\"无法通过减资程序\"| L[\"履行受限\"]\r\n    I --> M{\"是否符合<br>利润分配规则？\"}\r\n    M -->|\"有可分配利润\"| N[\"可以履行\"]\r\n    M -->|\"无可分配利润\"| O[\"履行受限\"]\r\n\r\n    style E fill:#6f9,stroke:#333\r\n    style H fill:#f66,stroke:#333\r\n    style K fill:#6f9,stroke:#333\r\n    style L fill:#f96,stroke:#333\r\n    style O fill:#f96,stroke:#333\r\n```\r\n\r\n---\r\n\r\n## 二、对赌协议的类型\r\n\r\n### （一）业绩补偿型\r\n\r\n**典型条款**：如目标公司在约定期限内未达到约定的业绩指标（如净利润、营业收入等），则融资方（目标公司股东或目标公司）向投资方支付现金补偿。\r\n\r\n**计算公式示例**：\r\n> 补偿金额 = 投资总额 x（1 - 实际净利润 / 承诺净利润）\r\n\r\n**实务特征**：业绩补偿型对赌是最常见的对赌形式，通常以年度净利润为核心指标，辅以营业收入、用户增长等辅助指标。其特点是触发频率高、争议点多集中在业绩数据的审计与确认上。\r\n\r\n### （二）股权回购型\r\n\r\n**典型条款**：如目标公司在约定期限内未完成约定目标（如上市、业绩指标等），则融资方以约定价格回购投资方持有的股权。\r\n\r\n**回购价格通常包括**：\r\n- 投资本金；\r\n- 固定收益（通常按年化8%-15%计算）；\r\n- 已宣告但未支付的利润。\r\n\r\n**实务特征**：股权回购型对赌通常在投资协议签署时即约定明确的回购价格公式，争议主要集中在回购条件是否成就以及回购义务的履行主体上。\r\n\r\n### （三）现金补偿 + 股权回购复合型\r\n\r\n实务中最常见的是将业绩补偿与股权回购结合的**复合型对赌条款**。典型结构如下：\r\n- **第一阶段**：未达业绩指标时，股东支付现金补偿；\r\n- **第二阶段**：连续未达标或未在约定期限内上市时，触发股权回购；\r\n- **第三阶段**：回购义务人无力回购时，触发担保条款或优先清算权。\r\n\r\n```mermaid\r\ngraph LR\r\n    A[\"投资完成\"] --> B{\"年度业绩达标？\"}\r\n    B -->|\"达标\"| C[\"正常持股\"]\r\n    B -->|\"未达标\"| D[\"触发现金补偿\"]\r\n    D --> E{\"连续未达标<br>或未按期上市？\"}\r\n    E -->|\"否\"| C\r\n    E -->|\"是\"| F[\"触发股权回"},{"id":"实务-股权转让与出资责任","title":"实务-股权转让与出资责任","excerpt":"股权转让是公司法实务中最为常见的交易类型之一。在股权转让过程中，一个核心且复杂的问题是： 转让人（原股东）的出资义务如何在转让人与受让人之间分配？ 这一问题在新《公司法》实施后变得尤为重要，原因在于： 新《公司法》全面实行 五年限期认缴制 ，大量存量公司面临调整出资期限的压力； 未届期股权转让 的情形将大幅增加； 新《公司法》第88条明确了转让人的 补充出资责任 ，这对股权转让实务产生了深远影响。","slug":"实务-股权转让与出资责任","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":4342,"created":"","updated":"","content":"# 实务：股权转让与出资责任\r\n\r\n## 一、问题引入：股权转让中出资责任如何分配\r\n\r\n股权转让是公司法实务中最为常见的交易类型之一。在股权转让过程中，一个核心且复杂的问题是：**转让人（原股东）的出资义务如何在转让人与受让人之间分配？**\r\n\r\n这一问题在新《公司法》实施后变得尤为重要，原因在于：\r\n- 新《公司法》全面实行**五年限期认缴制**，大量存量公司面临调整出资期限的压力；\r\n- **未届期股权转让**的情形将大幅增加；\r\n- 新[[📋 公司法知识库/00-公司法全文#第88条\\|《公司法》第88条]]明确了转让人的**补充出资责任**，这对股权转让实务产生了深远影响。\r\n\r\n```mermaid\r\ngraph TD\r\n    A[股权转让] --> B{出资是否已实缴?}\r\n    B -->|已实缴| C[正常转让<br>无出资责任问题]\r\n    B -->|未实缴| D{出资期限是否届满?}\r\n    D -->|已届满| E[瑕疵出资转让]\r\n    D -->|未届满| F[未届期股权转让]\r\n    E --> G[转让人承担出资责任<br>受让人知情则连带]\r\n    F --> H[受让人承担出资义务<br>转让人承担补充责任]\r\n    style E fill:#f96,stroke:#333\r\n    style F fill:#ff9,stroke:#333\r\n    style G fill:#f96,stroke:#333\r\n    style H fill:#ff9,stroke:#333\r\n    style C fill:#6f9,stroke:#333\r\n```\r\n\r\n---\r\n\r\n## 二、法律框架\r\n\r\n### （一）有限公司股权转让规则\r\n\r\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第84条\\|《公司法》第84条]]规定了有限公司股权转让的基本规则。\r\n\r\n**股东之间转让**：股东之间可以相互转让其全部或者部分股权，无需其他股东同意。\r\n\r\n**向股东以外的人转让**：\r\n- 应当将股权转让的有关事项书面通知其他股东；\r\n- 其他股东自接到书面通知之日起三十日内未答复的，视为同意转让；\r\n- 其他股东半数以上不同意转让的，不同意的股东应当购买该转让的股权；不购买的，视为同意转让；\r\n- 经股东同意转让的股权，在同等条件下，其他股东有优先购买权。\r\n\r\n**章程自治**：公司章程对股权转让另有规定的，从其规定。但章程不得禁止股权转让，只能对转让条件作出合理限制。\r\n\r\n### （二）股份公司股份转让规则\r\n\r\n[[📋 公司法知识库/00-公司法全文#第157条\\|《公司法》第157-164条]]规定了股份有限公司的股份转让规则：\r\n\r\n| 转让场所 | 限制类型 | 具体规则 |\r\n|----------|----------|----------|\r\n| 依法设立的证券交易场所 | 发起人 | 公司成立之日起一年内不得转让 |\r\n| 或按照国务院规定的其他方式 | 公司公开发行前已发行的股份 | 自公司股票在证券交易所上市交易之日起一年内不得转让 |\r\n| | 董监高 | 任职期间每年转让不超过所持股份的25%，离职后半年内不得转让 |\r\n\r\n---\r\n\r\n## 三、◆ 未届期股权转让\r\n\r\n### （一）新[[📋 公司法知识库/00-公司法全文#第88条\\|《公司法》第88条]]：转让人的补充出资责任\r\n\r\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第88条\\|《公司法》第88条]]第1款规定：\r\n\r\n> 股东转让已认缴出资但未届出资期限的股权的，由受让人承担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承担补充责任。\r\n\r\n这一条文确立了以下规则：\r\n\r\n**1. 受让人的出资义务**\r\n- 受让人取得股权后，承继该股权上附着的出资义务；\r\n- 受让人应当按照原出资期限缴纳出资；\r\n- 这是受让人作为股东的基本义务。\r\n\r\n**2. 转让人的补充出资责任**\r\n- 转让人不因股权转让而完全免除出资责任；\r\n- 当受让人未按期足额缴纳出资时，转让人承担**补充责任**；\r\n- 补充责任意味着：先由受让人承担责任，受让人不能清偿的部分由转让人承担。\r\n\r\n**3. 责任分配的逻辑**\r\n\r\n| 责任主体 | 责任类型 | 责任范围 | 责任顺序 |\r\n|----------|----------|----------|----------|\r\n| 受让人 | 直接责任 | 全部未缴出资 | 第一顺位 |\r\n| 转让人 | 补充责任 | 受让人不能清偿部分 | 第二顺位 |\r\n\r\n### "},{"id":"公司法核心法条索引","title":"公司法核心法条索引","excerpt":"法律依据 ：《中华人民共和国公司法》（2023年12月29日第十四届全国人民代表大会常务委员会第七次会议修订，2024年7月1日起施行，简称 新公司法 ） 本文件是 法条速查索引 ，按主题分类整理新公司法核心条款，方便实务查阅和研究。使用时请注意： ◆ 标注 ：核心规则，实务中最常适用 ▲ 标注 ：实务重难点，容易引发争议 关联知识点 ：链接到本知识库中的详细解析文件 建议配合各专题笔记文件使用，","slug":"公司法核心法条索引","module":"09-法条索引","moduleName":"法条索引","tags":[],"wordCount":12365,"created":"","updated":"","content":"# 公司法核心法条索引\r\n\r\n> **法律依据**：《中华人民共和国公司法》（2023年12月29日第十四届全国人民代表大会常务委员会第七次会议修订，2024年7月1日起施行，简称\"新公司法\"）\r\n\r\n## 使用说明\r\n\r\n本文件是**法条速查索引**，按主题分类整理新公司法核心条款，方便实务查阅和研究。使用时请注意：\r\n\r\n- **◆ 标注**：核心规则，实务中最常适用\r\n- **▲ 标注**：实务重难点，容易引发争议\r\n- **关联知识点**：链接到本知识库中的详细解析文件\r\n- 建议配合各专题笔记文件使用，本索引侧重\"速查定位\"，专题文件侧重\"深度理解\"\r\n\r\n### 条款引用说明\r\n\r\n- 条款序号均指2024年新公司法条文\r\n- 重大新旧法变化已在文末新旧对照表中标注\r\n- 关联法规（民法典、司法解释、九民纪要）见文末速查\r\n\r\n---\r\n\r\n## 一、公司设立与登记\r\n\r\n| 条款号                       | 核心内容   | 关联知识点                                       |                          |\r\n| ------------------------- | ------ | ------------------------------------------- | ------------------------ |\r\n| [[📋 公司法知识库/00-公司法全文#第10条 \\| 第10条]] | 法定代表人的选任范围：代表公司执行公司事务的董事或者经理；辞任规则           | [[📋 公司法知识库/04-公司的能力]]   |\r\n| [[📋 公司法知识库/00-公司法全文#第11条 \\| 第11条]] | 公司章程对公司、股东、董事、监事、高级管理人员具有约束力                | [[📋 公司法知识库/02-公司法基础理论]] |\r\n| [[📋 公司法知识库/00-公司法全文#第31条 \\| 第31条]] | 营业执照签发之日为公司成立之日                             | [[📋 公司法知识库/05-公司的设立]]   |\r\n| [[📋 公司法知识库/00-公司法全文#第32条 \\| 第32条]] | 公司登记事项包括名称、住所、注册资本、经营范围、法定代表人姓名、股东等；登记事项应公示 | [[📋 公司法知识库/05-公司的设立]]   |\r\n| [[📋 公司法知识库/00-公司法全文#第34条 \\| 第34条]] | 公司登记事项未经登记或变更登记，不得对抗善意相对人                   | [[📋 公司法知识库/05-公司的设立]]   |\r\n| [[📋 公司法知识库/00-公司法全文#第35条 \\| 第35条]] | 公司以其主要办事机构所在地为住所                            | [[📋 公司法知识库/05-公司的设立]]   |\r\n\r\n## 二、注册资本与出资 ◆\r\n\r\n> **新公司法重大变化区域**：2024年新公司法对出资制度作出重大修改，确立5年实缴期限，新增股东失权、出资加速到期等制度。\r\n\r\n| 条款号 | 核心内容 | 关联知识点 |\r\n|--------|----------|------------|\r\n| [[📋 公司法知识库/00-公司法全文#第46条\\|第46条]] | 有限公司章程应当载明事项：公司名称和住所、经营范围、注册资本、股东姓名或名称、出资方式和金额、公司机构及其产生办法、法定代表人等 | [[📋 公司法知识库/05-公司的设立]] |\r\n| [[📋 公司法知识库/00-公司法全文#第47条\\|第47条]]◆ | **5年实缴期限**：全体股东认缴的出资额应自公司成立之日起五年内缴足。法律、行政法规及国务院另有规定的除外 | [[📋 公司法知识库/05-公司的设立]] |\r\n| [[📋 公司法知识库/00-公司法全文#第48条\\|第48条]] | 股东可以用货币出资，也可以用实物、知识产权、土地使用权、**股权、债权**等可以用货币估价并可依法转让的非货币财产作价出资。不得以劳务、信用、商誉等出资 | [[📋 公司法知识库/05-公司的设立]] |\r\n| [[📋 公司法知识库/00-公司法全文#第49条\\|第49条]] | 股东应按期足额缴纳出资，未按期缴纳的应承担违约责任 | [[📋 公司法知识库/05-公司的设立]] |\r\n| [[📋 公司法知识库/00-公司法全文#第50条\\|第50条]]◆ | **出资瑕疵责任与发起人连带责任*"}]</script> <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script> <script>(function(){const base = "/gongsi-kb/";

    (function() {
      var dataEl = document.getElementById('search-data');
      if (!dataEl) return;
      var articlesData = JSON.parse(dataEl.textContent);
      var fuse = new Fuse(articlesData, {
        keys: [
          { name: 'title', weight: 0.4 },
          { name: 'tags', weight: 0.2 },
          { name: 'excerpt', weight: 0.2 },
          { name: 'content', weight: 0.2 },
        ],
        threshold: 0.4,
        includeScore: true,
        ignoreLocation: true,
        minMatchCharLength: 2,
      });

      var searchInput = document.getElementById('search-input');
      var resultsContainer = document.getElementById('search-results');
      var resultsCount = document.getElementById('results-count');
      var countNum = document.getElementById('count-num');
      var initialState = document.getElementById('initial-state');
      var tagButtons = document.querySelectorAll('.tag-btn');
      var activeTag = '';

      function formatWC(count) {
        return count >= 10000 ? (count / 10000).toFixed(1) + '万字' : count + '字';
      }

      function formatDateStr(d) {
        if (!d) return '';
        try { return new Date(d).toLocaleDateString('zh-CN'); } catch(e) { return d; }
      }

      function renderResults(results) {
        if (results.length === 0) {
          resultsContainer.innerHTML = '<div class="text-center py-12"><p class="text-gray-400 dark:text-gray-500">未找到匹配的文章</p></div>';
          return;
        }
        var base = window.__BASE_URL || '/';
        resultsContainer.innerHTML = results.map(function(r) {
          return '<a href="' + base + 'articles/' + r.slug + '/ " class="group flex items-start gap-5 py-4 border-b border-primary-200/60 dark:border-primary-800/30 transition-colors">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 mb-1.5">' +
          '<span class="text-[11px] px-1.5 py-0.5 rounded bg-primary-100 dark:bg-primary-800/40 text-gray-500 dark:text-gray-400">' + r.moduleName + '</span>' +
          r.tags.slice(0, 3).map(function(t) { return '<span class="text-[11px] text-gray-400 dark:text-gray-600">#' + t + '</span>'; }).join('') +
          '</div>' +
          '<h3 class="text-[15px] font-medium text-gray-800 dark:text-gray-200 group-hover:text-accent-700 dark:group-hover:text-accent-400 transition-colors leading-snug">' + r.title + '</h3>' +
          (r.excerpt ? '<p class="text-xs text-gray-400 dark:text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">' + r.excerpt + '</p>' : '') +
          '<div class="flex items-center gap-3 mt-2 text-[11px] text-gray-400 dark:text-gray-600">' +
          '<span>' + formatDateStr(r.updated || r.created) + '</span>' +
          '<span>·</span>' +
          '<span>' + formatWC(r.wordCount) + '</span>' +
          '</div></div>' +
          '<svg class="w-4 h-4 text-gray-300 dark:text-gray-700 group-hover:text-accent-500 transition-colors flex-shrink-0 mt-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>' +
          '</a>';
        }).join('');
      }

      function performSearch(query) {
        var results;
        if (query.length > 0) {
          results = fuse.search(query).map(function(r) { return r.item; });
        } else {
          results = articlesData;
        }
        if (activeTag) {
          results = results.filter(function(r) { return r.tags.indexOf(activeTag) !== -1; });
        }
        initialState.classList.add('hidden');
        resultsCount.classList.remove('hidden');
        countNum.textContent = results.length;
        renderResults(results);
      }

      var urlParams = new URLSearchParams(window.location.search);
      var queryParam = urlParams.get('q');
      var tagParam = urlParams.get('tag');
      if (queryParam) {
        searchInput.value = queryParam;
        performSearch(queryParam);
      }
      if (tagParam) {
        activeTag = tagParam;
        var tagBtn = document.querySelector('[data-tag="' + tagParam + '"]');
        if (tagBtn) tagBtn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
        performSearch(searchInput.value);
      }

      searchInput.addEventListener('input', function(e) {
        var q = e.target.value.trim();
        if (q.length === 0 && !activeTag) {
          resultsContainer.innerHTML = '';
          resultsCount.classList.add('hidden');
          initialState.classList.remove('hidden');
          return;
        }
        performSearch(q);
      });

      tagButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tag = btn.dataset.tag;
          if (activeTag === tag) {
            activeTag = '';
            btn.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          } else {
            tagButtons.forEach(function(b) { b.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300'); });
            activeTag = tag;
            btn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          }
          performSearch(searchInput.value.trim());
        });
      });
