司的经营范围由公司章程规定。公司可以修改公司章程，变更经营范围。\n\n公司的经营范围中属于法律、行政法规规定须经批准的项目，应当依法经过批准。\n\n### 第10条\n\n公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经理担任。\n\n担任法定代表人的董事或者经理辞任的，视为同时辞去法定代表人。\n\n法定代表人辞任的，公司应当在法定代表人辞任之日起三十日内确定新的法定代表人。\n\n### 第11条\n\n法定代表人以公司名义从事的民事活动，其法律后果由公司承受。\n\n公司章程或者股东会对法定代表人职权的限制，不得对抗善意相对人。\n\n法定代表人因执行职务造成他人损害的，由公司承担民事责任。公司承担民事责任后，依照法律或者公司章程的规定，可以向有过错的法定代表人追偿。\n\n### 第12条\n\n有限责任公司变更为股份有限公司，应当符合本法规定的股份有限公司的条件。股份有限公司变更为有限责任公司，应当符合本法规定的有限责任公司的条件。\n\n有限责任公司变更为股份有限公司的，或者股份有限公司变更为有限责任公司的，公司变更前的债权、债务由变更后的公司承继。\n\n### 第13条\n\n公司可以设立子公司，子公司具有法人资格，依法独立承担民事责任。\n\n公司可以设立分公司，分公司不具有法人资格，其民事责任由公司承担。\n\n### 第14条\n\n公司可以向其他企业投资。\n\n法律规定公司不得成为对所投资企业的债务承担连带责任的出资人的，从其规定。\n\n### 第15条\n\n公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\n\n公司为公司股东或者实际控制人提供担保的，应当经股东会决议。\n\n前款规定的股东或者受前款规定的实际控制人支配的股东，不得参加前款规定事项的表决。该项表决由出席会议的其他股东所持表决权的过半数通过。\n\n### 第16条\n\n公司应当保护职工的合法权益，依法与职工签订劳动合同，参加社会保险，加强劳动保护，实现安全生产。\n\n公司应当采用多种形式，加强公司职工的职业教育和岗位培训，提高职工素质。\n\n### 第17条\n\n公司职工依照《中华人民共和国工会法》组织工会，开展工会活动，维护职工合法权益。公司应当为本公司工会提供必要的活动条件。公司工会代表职工就职工的劳动报酬、工作时间、休息休假、劳动安全卫生和保险福利等事项依法与公"},{"id":"公司法总览","title":"公司法总览","excerpt":"内容定位说明： - ◆ = 核心规则，实务中最常适用 - ▲ = 实务重难点，容易引发争议 - ○ = 高频实务问题，值得关注 《公司法》第1条规定：\"为了规范公司的组织和行为，保护公司、股东和债权人的合法权益，维护社会经济秩序，促进社会主义市场经济的发展，根据宪法，制定本法。\" ◆ 核心目的： 1. 规范公司组织和行为：确立公司设立、运营、变更、终止的基本规则 2. 保护合法权益：平衡公司、股东","slug":"公司法总览","module":"01-总论","moduleName":"总论","tags":[],"wordCount":3970,"created":"","updated":"","content":"# 公司法总览\n\n> **内容定位说明**：\n> - ◆ = 核心规则，实务中最常适用\n> - ▲ = 实务重难点，容易引发争议\n> - ○ = 高频实务问题，值得关注\n\n## 一、知识框架\n\n```mermaid\ngraph LR\n    A[公司法] --> B[基础理论<br>设立·分类]\n    A --> C[资本制度<br>出资·增减资]\n    A --> D[股东权利<br>资格·知情·分红]\n    A --> E[公司治理<br>三会一层·义务]\n    A --> F[财务会计<br>公积金·利润分配]\n    A --> G[变更与终止<br>合并分立·解散清算]\n    A --> H[特殊类型<br>国有·一人·上市]\n```\n\n## 二、公司法概述\n\n### （一）立法目的\n\n[[📋 公司法知识库/00-公司法全文#第1条|《公司法》第1条]]规定：\"为了规范公司的组织和行为，保护公司、股东和债权人的合法权益，维护社会经济秩序，促进社会主义市场经济的发展，根据宪法，制定本法。\"\n\n◆ **核心目的**：\n1. **规范公司组织和行为**：确立公司设立、运营、变更、终止的基本规则\n2. **保护合法权益**：平衡公司、股东、债权人三方利益\n3. **维护经济秩序**：保障交易安全和市场稳定\n4. **促进经济发展**：鼓励投资创业，优化营商环境\n\n### （二）调整对象\n\n[[📋 公司法知识库/00-公司法全文#第2条|《公司法》第2条]]规定：\"本法所称公司是指依照本法在中国境内设立的有限责任公司和股份有限公司。\"\n\n**调整范围**：\n- **组织关系**：公司的设立、变更、终止\n- **行为关系**：公司的经营、管理、对外交易\n- **内部关系**：股东之间、股东与公司之间、公司与管理层之间\n- **外部关系**：公司与债权人、公司与政府监管部门之间\n\n### （三）适用范围\n\n| 适用范围 | 具体内容 |\n|---------|---------|\n| **空间效力** | 中国境内设立的公司 |\n| **主体效力** | 有限责任公司、股份有限公司 |\n| **时间效力** | 2024年7月1日起施行 |\n| **特别法优先** | 外商投资、国有企业等另有规定的，优先适用特别法 |\n\n## 三、2024年新公司法修订重大变化\n\n### （一）注册资本制度变革\n\n◆ **重大变化**：\n1. **5年实缴制**：有限责任公司股东认缴的出资额应当自公司成立之日起五年内缴足（[[📋 公司法知识库/00-公司法全文#第47条|《公司法》第47条]]）\n2. **股份公司发起人实缴**：发起人应当在公司成立前按照其认购的股份缴纳全部股款（[[📋 公司法知识库/00-公司法全文#第96条|《公司法》第96条]]）\n3. **出资加速到期**：公司不能清偿到期债务时，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资（[[📋 公司法知识库/00-公司法全文#第54条|《公司法》第54条]]）\n\n### （二）公司治理结构优化\n\n| 变化内容 | 旧法规定 | 新法规定 |\n|---------|---------|---------|\n| **监事会设置** | 必须设立监事会 | 可以选择设立监事会或审计委员会（第69条、第121条） |\n| **审计委员会** | 无明确规定 | 可以在董事会中设立审计委员会行使监事会职权 |\n| **法定代表人** | 由董事长、执行董事或经理担任 | 可以由代表公司执行公司事务的董事或者经理担任（第10条） |\n| **董事会职权** | 列举式规定 | 更加灵活，公司章程可自主规定 |\n\n### （三）强化控股股东和实际控制人责任\n\n◆ **新增规定**：\n1. **事实董事责任**：控股股东、实际控制人不担任公司董事但实际执行公司事务的，适用董事忠实义务和勤勉义务的规定（第180条）\n2. **影子董事责任**：控股股东、实际控制人指示董事、高级管理人员从事损害公司或者股东利益的行为的，与该董事、高级管理人员承担连带责任（第192条）\n3. **横向人格否认**：股东利用其控制的两个以上公司实施逃避债务行为的，各公司应当对任一公司的债务承担连带责任（第23条）\n\n### （四）国家出资公司专章\n\n▲ **实务重点**：\n1. **专章规定**：设立\"国家出资公司组织机构的特别规定\"专章（第七章）\n2. **适用范围**：国有独资公司、国有资本控股公司\n3. **治理特殊性**：党组织领导作用、外部董事制度、审计委员会\n4. **出资人职责**：明确履行出资人职责的机构及其权限\n\n### （五）其他重要变化\n\n| 变化"},{"id":"公司法基础理论","title":"公司法基础理论","excerpt":"实务指引：法人人格否认制度在公司纠纷实务中高频出现，是债权人维权的重要工具 《公司法》第2条规定：\"本法所称公司是指依照本法在中国境内设立的有限责任公司和股份有限公司。\" 公司是依法设立的，以营利为目的的，由股东投资形成的企业法人。 ◆ 社团性的内涵： - 公司是以股东为基础的社团法人 - 有限责任公司由1个以上50个以下股东出资设立（第42条） - 股份有限公司由1人以上200人以下为发起人（第","slug":"公司法基础理论","module":"01-总论","moduleName":"总论","tags":[],"wordCount":8212,"created":"","updated":"","content":"# 第一章 公司法的基础理论\n\n## 一、知识框架\n\n> **实务指引**：法人人格否认制度在公司纠纷实务中高频出现，是债权人维权的重要工具\n\n```mermaid\ngraph TD\n    A[公司法基础理论] --> B[公司的概念与特征]\n    A --> C[法人人格独立]\n    A --> D[法人人格否认<br>纵向·横向·一人公司]\n    A --> E[有限责任制度]\n    A --> F[公司章程<br>性质·效力·条款]\n```\n\n## 二、公司的概念与特征\n\n### （一）公司的定义\n\n[[📋 公司法知识库/00-公司法全文#第2条|《公司法》第2条]]规定：\"本法所称公司是指依照本法在中国境内设立的有限责任公司和股份有限公司。\"\n\n公司是依法设立的，以营利为目的的，由股东投资形成的企业法人。\n\n### （二）公司的特征\n\n#### 1. 社团性\n\n◆ **社团性的内涵**：\n- 公司是以股东为基础的社团法人\n- 有限责任公司由1个以上50个以下股东出资设立（第42条）\n- 股份有限公司由1人以上200人以下为发起人（第92条）\n- 一人公司是社团性的例外，但法律仍将其纳入公司法调整\n\n#### 2. 法人性\n\n◆ **法人性的体现**：\n\n| 法人要素 | 具体内容 | 法律依据 |\n|---------|---------|---------|\n| **依法设立** | 依照公司法规定的条件和程序设立 | 第2条 |\n| **独立财产** | 有独立的法人财产，享有法人财产权 | 第3条 |\n| **独立责任** | 以其全部财产对公司的债务承担责任 | 第3条 |\n| **独立人格** | 有自己的名称、组织机构、住所 | 第11条 |\n\n#### 3. 营利性\n\n▲ **营利性的理解**：\n- **目的营利**：以营利为目的，即追求利润\n- **分配营利**：将利润分配给股东\n- **持续营利**：持续从事经营活动，而非一次性交易\n- **区别于非营利法人**：不以营利为目的的法人（如事业单位、社会团体）不属于公司\n\n## 三、公司法人人格独立原则\n\n### （一）法人人格独立的含义\n\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第3条|《公司法》第3条]]：\"公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。\"\n\n法人人格独立是公司法的基石，体现在以下三个方面：\n\n#### 1. 财产独立\n\n◆ **财产独立的要求**：\n- 公司有独立的法人财产，享有法人财产权\n- 股东向公司履行出资义务后，对应的财产归公司所有，股东不得取回或擅自使用\n- 公司经营取得的利润归属于公司，未经法定的利润分配程序，股东不得擅自占有\n- 股东不得随意抽回出资或侵占公司财产\n\n**《公司法》相关规定**：\n- 第53条：股东不得抽逃出资\n- 第253条：公司的发起人、股东在公司成立后，抽逃其出资的，由公司登记机关责令改正，处以所抽逃出资金额百分之五以上百分之十五以下的罚款\n\n#### 2. 名义独立\n\n◆ **名义独立的要求**：\n- 公司成立后以独立的名义为民事法律行为\n- 公司与股东是两个独立的主体，两者相互独立\n\n#### 3. 责任独立\n\n◆ **责任独立的内涵**：\n- 公司对自身的债务以其全部财产承担责任\n- 通常情况下债权人不能向公司背后的股东追索\n- 一般情况下，公司的潜在交易方应当以公司的经营状况、财务状况判断其资信情况、履约能力，以决定是否将该公司作为交易对手，而不能以公司的股东实力加以判断\n\n### （二）法人人格独立的边界\n\n▲ **人格独立的限制**：\n1. **法人人格否认**：特定情形下否认公司独立人格\n2. **关联交易限制**：控股股东不得利用关联关系损害公司利益\n3. **公司集团规制**：母子公司之间的交易受到特别规制\n4. **一人公司特别规定**：举证责任倒置\n\n## 四、公司法人人格否认制度 \n\n### （一）人格否认的一般规则（纵向否认）\n\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第23条|《公司法》第23条]]：\n> \"公司股东滥用公司法人独立地位和股东有限责任，逃避债务，严重损害公司债权人利益的，应当对公司债务承担连带责任。\n> 股东利用其控制的两个以上公司实施前款规定行为的，各公司应当对任一公司的债务承担连带责任。\n> 只有一个股东的公司，股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任。\"\n\n在例外情形下，公司独立法人地位被打破，债权人可向公司股东或关联方直接求偿，该制度被称为法人人格否认制度。\n\n◆ **人格否认的构成要件**：\n\n```mermaid\ngra"},{"id":"公司的分类","title":"公司的分类","excerpt":"实务指引：公司类型的选择直接影响股东权利义务、税负和融资能力，是公司设立时的首要决策 定义：无限公司是指全体股东对公司债务承担无限连带责任的公司。 特征： 1. 无限责任：股东对公司债务承担无限清偿责任 2. 连带责任：股东之间对公司债务承担连带责任 3. 人合性强：以股东之间的信任关系为基础 4. 设立简便：设立程序简单，无需最低资本 我国法律的态度：我国《公司法》不承认无限公司，仅规定有限责任","slug":"公司的分类","module":"01-总论","moduleName":"总论","tags":[],"wordCount":7560,"created":"","updated":"","content":"# 第二章 公司的分类\n\n> **实务指引**：公司类型的选择直接影响股东权利义务、税负和融资能力，是公司设立时的首要决策\n\n## 一、知识框架\n\n```mermaid\ngraph LR\n    A[公司的分类] --> B[按股东责任<br>有限·股份]\n    A --> C[按信用基础<br>人合·资合]\n    A --> D[按组织关系<br>母子公司·总分公司]\n    A --> E[按特殊类型<br>国有·一人·上市]\n```\n\n## 二、按股东责任分类\n\n### （一）无限公司\n\n**定义**：无限公司是指全体股东对公司债务承担无限连带责任的公司。\n\n**特征**：\n1. **无限责任**：股东对公司债务承担无限清偿责任\n2. **连带责任**：股东之间对公司债务承担连带责任\n3. **人合性强**：以股东之间的信任关系为基础\n4. **设立简便**：设立程序简单，无需最低资本\n\n**我国法律的态度**：我国《公司法》不承认无限公司，仅规定有限责任公司和股份有限公司两种形式。\n\n### （二）两合公司\n\n**定义**：两合公司是指由无限责任股东和有限责任股东共同组成的公司。\n\n**特征**：\n1. **双重责任**：无限责任股东承担无限连带责任，有限责任股东以出资额为限承担责任\n2. **人合兼资合**：兼具无限公司的人合性和有限公司的资合性\n3. **管理权限制**：有限责任股东一般不参与公司经营管理\n4. **利润分配灵活**：可以约定不同于出资比例的分配方式\n\n**我国法律的态度**：我国《公司法》不承认两合公司，但有限合伙企业（《合伙企业法》）具有类似特征。\n\n### （三）有限责任公司\n\n◆ **有限责任公司的特征**：\n\n[[📋 公司法知识库/00-公司法全文#第42条|《公司法》第42条]]规定：\"有限责任公司由一个以上五十个以下股东出资设立。\"\n\n| 特征 | 具体内容 | 法律依据 |\n|-----|---------|---------|\n| **股东人数** | 1人以上50人以下 | 第42条 |\n| **责任形式** | 股东以认缴出资额为限对公司承担责任 | 第3条 |\n| **资本形式** | 股东出资，不分为等额股份 | 第47条 |\n| **股权转让** | 对外转让需其他股东过半数同意，其他股东有优先购买权 | 第84条 |\n| **组织机构** | 可设董事会、监事会，也可不设 | 第69条、第83条 |\n| **信息公开** | 信息公开程度较低 | - |\n\n**有限责任公司的优点**：\n1. 设立门槛相对较低\n2. 股东人数限制，人合性强\n3. 股权转让限制，公司稳定性高\n4. 组织机构灵活，治理成本低\n\n**有限责任公司的缺点**：\n1. 筹资能力有限\n2. 股权转让受限\n3. 不能公开发行股票\n\n### （四）股份有限公司\n\n◆ **股份有限公司的特征**：\n\n[[📋 公司法知识库/00-公司法全文#第92条|《公司法》第92条]]规定：\"设立股份有限公司，应当有二人以上二百人以下为发起人，其中应当有半数以上的发起人在中国境内有住所。\"\n\n| 特征 | 具体内容 | 法律依据 |\n|-----|---------|---------|\n| **发起人人数** | 2人以上200人以下 | 第92条 |\n| **责任形式** | 股东以认购股份为限对公司承担责任 | 第3条 |\n| **资本形式** | 全部资本分为等额股份 | 第142条 |\n| **股权转让** | 股份可以依法自由转让 | 第157条 |\n| **组织机构** | 必须设立股东大会、董事会、监事会 | 第120条 |\n| **信息公开** | 上市公司信息公开程度高 | 第152条 |\n\n**股份有限公司的优点**：\n1. 筹资能力强\n2. 股份转让自由\n3. 公司规模可以较大\n4. 所有权与经营权分离\n\n**股份有限公司的缺点**：\n1. 设立门槛较高\n2. 治理结构复杂\n3. 信息公开成本高\n4. 股东流动性大，稳定性较差\n\n### （五）有限责任公司与股份有限公司的对比\n\n▲ **重点对比**：\n\n| 对比项 | 有限责任公司 | 股份有限公司 |\n|-------|------------|------------|\n| **股东人数** | 1-50人 | 2-200人（发起人） |\n| **资本形式** | 出资额，不等分 | 等额股份 |\n| **设立方式** | 仅发起设立 | 发起设立或募集设立 |\n| **股权转让** | 有限制，需其他股东同意 | 自由转让（发起人除外） |\n| **组织机构** | 灵活，可简化 | 必须三会齐全 |\n| **公开程度** | 较"},{"id":"公司的能力","title":"公司的能力","excerpt":"实务指引：公司对外担保的决议程序审查是商事交易中最常见的风险防控要点 公司的权利能力，是指公司作为法律主体，享有权利、承担义务的资格。公司自成立时取得权利能力，至终止时消灭。 始期：公司营业执照签发之日（设立登记）。依据《公司法》第31条，公司营业执照签发日期为公司成立日期，公司自成立之日起具有法人资格，享有权利能力。 终期：公司注销登记之日。公司经清算、注销登记后，法人资格消灭，权利能力终止。需","slug":"公司的能力","module":"01-总论","moduleName":"总论","tags":[],"wordCount":7029,"created":"","updated":"","content":"# 第三章 公司的能力\n\n> **实务指引**：公司对外担保的决议程序审查是商事交易中最常见的风险防控要点\n\n## 一、知识框架\n\n```mermaid\ngraph LR\n    A[公司的能力] --> B[权利能力<br>始终期·限制·担保]\n    A --> C[行为能力<br>法定代表人·越权效力]\n    A --> D[侵权行为能力<br>职务行为·董高赔偿]\n    A --> E[刑事责任能力<br>单位犯罪]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）公司的权利能力\n\n公司的权利能力，是指公司作为法律主体，享有权利、承担义务的资格。公司自成立时取得权利能力，至终止时消灭。\n\n#### 1. 权利能力的始期与终期\n\n**始期**：公司营业执照签发之日（设立登记）。依据[[📋 公司法知识库/00-公司法全文#第31条|《公司法》第31条]]，公司营业执照签发日期为公司成立日期，公司自成立之日起具有法人资格，享有权利能力。\n\n**终期**：公司注销登记之日。公司经清算、注销登记后，法人资格消灭，权利能力终止。需注意，公司在解散后至注销登记前，其法人资格仍然存续，但仅限于清算目的范围内享有权利能力。\n\n**自然人与公司权利能力的对比**：\n\n| 对比项 | 自然人 | 公司 |\n|--------|--------|------|\n| **权利能力** | 平等 | 受营业范围、特许经营、经营状况等因素的影响，具有差异性，并不平等 |\n\n#### 2. 公司权利能力的限制\n\n公司的权利能力受到以下三方面限制：\n\n**（1）性质限制**：公司为法人，不享有自然人基于人身性质的权利，如生命权、健康权、身体权、身份权（如亲权、继承权中的某些人身性权利）等。\n\n**（2）目的限制（经营范围限制）**：公司的权利能力原则上不受经营范围的限制。《民法典》第65条规定，法人的实际情况与登记的事项不一致的，不得对抗善意相对人。因此，超越经营范围签订的合同原则上有效，但违反国家限制经营、特许经营以及法律、行政法规禁止经营规定的除外。\n\n**（3）法律限制**：法律、行政法规对公司权利能力的特别限制，如公司不得成为对所投资企业的债务承担连带责任的出资人（[[📋 公司法知识库/00-公司法全文#第15条|《公司法》第15条]]）。\n\n#### 3. 转投资限制\n\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第15条|《公司法》第15条]]：\"公司可以向其他企业投资。法律规定公司不得成为对所投资企业的债务承担连带责任的出资人的，从其规定。\"\n\n◆ **投资规则详解**：\n1. **投资范围**：原则上，公司的投资范围不受限制，经公司决策，可以向其他企业进行投资。公司作为投资主体既可以向公司制企业投资，也可以向合伙企业投资。\n2. **特殊限制**：若法律特殊规定公司不得对所投资企业的债务承担连带责任的，从其规定。如《合伙企业法》第3条规定：\"国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人。\"\n3. **投资决策**：公司向其他企业投资，依照公司章程的规定，由董事会或者股东会决议。\n4. **投资金额**：公司章程对投资的总额及单项投资的数额有限额规定的，不得超过规定的限额。\n\n#### 4. 对外担保能力 \n\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第15条|《公司法》第15条]]：\n> \"公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\n> 公司为公司股东或者实际控制人提供担保的，应当经股东会决议。\n> 前款规定的股东或者受前款规定的实际控制人支配的股东，不得参加前款规定事项的表决。该项表决由出席会议的其他股东所持表决权的过半数通过。\"\n\n◆ **担保规则详解**：\n\n**（1）担保金额**：公司法层面对公司的担保金额并无限制。若公司章程对公司担保的总额及单项担保的数额有限额规定的，不得超过规定的限额。\n\n**（2）担保决策**：\n\n| 分类 | 决议要求 |\n|------|---------|\n| **为他人担保（非关联方）** | 依照公司章程的规定，由董事会或股东会决议 |\n| **为股东/实际控制人担保（关联方）** | ①必须由股东会决议；②接受担保的股东或受实际控制人支配的股东不得参加表决（关联方须回避）；③该项表决由出席会议的其他股东所持表决权的过半数通过 |\n\n**（3）越权担保** \n\n◆ **《民法典担保制度解释》第7条**：\n> \"公司的法定代表人违反公司法关于公司对外担保决议程序的规定，超越权限代表公司"},{"id":"公司的设立","title":"公司的设立","excerpt":"实务指引：股东出资制度和发起人责任是公司设立阶段最核心的实务问题，直接影响公司成立后的资本充实和债权人保护 ◆ 设立与成立的区分： 公司设立主要有两种方式： 募集设立的特殊要求： - 发起人认购的股份不得少于公司股份总数的35%（《公司法》第92条） - 公开募集须经国务院证券监督管理机构核准 - 向特定对象募集（定向募集）的股东人数不得超过200人 ◆ 《公司法》第25条规定，设立有限责任公司应","slug":"公司的设立","module":"02-设立与股东","moduleName":"设立与股东","tags":[],"wordCount":10490,"created":"","updated":"","content":"# 第四章 公司的设立\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[公司的设立] --> B[设立方式<br>发起设立·募集设立]\n    A --> C[设立条件]\n    A --> D[发起人责任]\n    A --> E[公司章程]\n    A --> F[注册资本制度]\n    F --> F1[认缴制·5年实缴]\n    F --> F2[出资形式·瑕疵责任]\n    F --> F3[出资加速到期·股东失权]\n```\n\n---\n\n## 二、核心制度详解\n\n> **实务指引**：股东出资制度和发起人责任是公司设立阶段最核心的实务问题，直接影响公司成立后的资本充实和债权人保护\n\n### （一）公司设立的方式\n\n◆ **设立与成立的区分**：\n\n| 概念 | 含义 | 时点 |\n|------|------|------|\n| 公司设立 | 发起人依照法定条件和程序，为组建公司并取得法人资格而必须采取和完成的法律行为；设立是一个**过程** | 从发起人订立设立协议到公司登记成立之前 |\n| 公司成立 | 是出资人设立公司行为的**法律后果** | **营业执照签发之日**为公司成立之日（可发给电子营业执照，与纸质营业执照具有同等法律效力） |\n\n公司设立主要有两种方式：\n\n| 设立方式 | 适用主体 | 含义 | 特征 |\n|----------|----------|------|------|\n| 发起设立 | 有限公司/股份公司 | 由发起人认缴全部出资或股份 | 程序简便，不涉及公众投资者 |\n| 募集设立 | 仅股份公司 | 发起人认购部分股份，其余向社会公开募集或向特定对象募集 | 程序复杂，涉及公众利益保护 |\n\n**募集设立的特殊要求**：\n- 发起人认购的股份不得少于公司股份总数的35%（[[📋 公司法知识库/00-公司法全文#第92条|《公司法》第92条]]）\n- 公开募集须经国务院证券监督管理机构核准\n- 向特定对象募集（定向募集）的股东人数不得超过200人\n\n### （二）公司设立的条件\n\n#### 1. 有限责任公司的设立条件\n\n◆ **[[📋 公司法知识库/00-公司法全文#第25条|《公司法》第25条]]**规定，设立有限责任公司应当具备下列条件：\n\n1. 股东符合法定人数（1人以上50人以下）\n2. 有符合公司章程规定的全体股东认缴的出资额\n3. 股东共同制定公司章程\n4. 有公司名称，建立符合有限责任公司要求的组织机构\n5. 有公司住所\n\n#### 2. 股份有限公司的设立条件\n\n◆ **[[📋 公司法知识库/00-公司法全文#第92条|《公司法》第92条]]**规定，设立股份有限公司应当具备下列条件：\n\n1. 发起人符合法定人数（2人以上200人以下，其中须有半数以上的发起人在中国境内有住所）\n2. 有符合公司章程规定的全体发起人认购的股本总额或者募集的实收股本总额\n3. 股份发行、筹办事项符合法律规定\n4. 发起人制订公司章程，采用募集设立的须经创立大会通过\n5. 有公司名称，建立符合股份有限公司要求的组织机构\n6. 有公司住所\n\n### （三）设立中公司的法律地位\n\n◆ **发起人的概念**：发起人，是指为设立公司而**签署公司章程**、向公司**认购出资或股份**并**履行公司设立职责**的人。自然人、法人、非法人组织、**国家**均可以作为公司的发起人。\n\n▲ **概念辨析：发起人 vs 股东**：\n\n| 概念 | 含义 | 关系 |\n|------|------|------|\n| 发起人 | 为设立公司而签署章程、认购出资/股份、履行设立职责的人，公司成立后**当然成为**公司股东 | 发起人一定是股东 |\n| 股东 | 既包括参与公司设立的发起人，也包括公司成立后通过受让股权或增资取得股权的股东 | 股东不一定是发起人 |\n\n**发起人的数量**：\n- 有限公司：1～50人\n- 股份公司：1～200人，且**半数以上**的发起人在中国境内有住所\n\n设立中的公司，是指从发起人订立设立协议到公司登记成立之前这一阶段的组织体。关于其法律地位，理论上有不同学说：\n\n| 学说 | 主要观点 | 评价 |\n|------|----------|------|\n| 合伙说 | 设立中公司为发起人之间的合伙 | 忽视了设立中公司的独立性 |\n| 无权利能力社团说 | 设立中公司为尚未取得法人资格的社团 | 通说，较为合理 |\n| 前法人说 | 设立中公司为法人的前身 | 强调了与成立后公司的连续性 |\n\n我国司法实践中，一般将设立中的公司视为发起人之间的合伙关系，其行为后果由发起人承担；公司成立后，设立中的公司行为后果原则上由公司承继。\n\n###"},{"id":"股东资格与股东权利","title":"股东资格与股东权利","excerpt":"实务指引：股东资格确认和利润分配纠纷是公司诉讼中最常见的案由，知情权是股东行使其他权利的基础 ◆ 股东的概念：股东是指向公司出资、持有公司股权/股份、享有股东权利和承担股东义务的主体。股东是公司法上对出资人的特别称谓。 股东的类型：股东可以是自然人、法人、非法人组织，还可以是国家。 ▲ 行为能力要求：公司法对股东无行为能力的要求，限制民事行为能力人和无民事行为能力人均可成为公司股东。 股东资格确认","slug":"股东资格与股东权利","module":"02-设立与股东","moduleName":"设立与股东","tags":[],"wordCount":11096,"created":"","updated":"","content":"# 第五章 股东资格与股东权利\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[股东资格与权利] --> B[资格取得<br>原始取得·继受取得]\n    A --> C[资格确认<br>股东名册·工商登记·代持]\n    A --> D[权利体系<br>收益权·管理权·知情权]\n    A --> E[股东义务<br>出资义务·不得滥用权利]\n```\n\n---\n\n## 二、核心制度详解\n\n> **实务指引**：股东资格确认和利润分配纠纷是公司诉讼中最常见的案由，知情权是股东行使其他权利的基础\n\n### （一）股东资格的取得\n\n◆ **股东的概念**：股东是指向公司出资、持有公司股权/股份、享有股东权利和承担股东义务的主体。股东是公司法上对出资人的特别称谓。\n\n**股东的类型**：股东可以是自然人、法人、非法人组织，还可以是**国家**。\n\n▲ **行为能力要求**：公司法对股东**无行为能力**的要求，限制民事行为能力人和无民事行为能力人均可成为公司股东。\n\n**股东资格确认之诉**：当事人向人民法院起诉请求确认其股东资格的，应当以**公司为被告**，与案件争议股权有利害关系的人作为**第三人**参加诉讼。\n\n股东资格的取得方式可分为原始取得、继受取得和善意取得三种。\n\n#### 1. 原始取得\n\n原始取得是指通过出资或认缴出资而取得股东资格。\n\n| 取得方式 | 含义 | 股东资格取得时点 |\n|----------|------|------------------|\n| 出资取得 | 实际缴纳出资取得股东资格 | 实际出资时（有限公司）；股款缴足时（股份公司） |\n| 认缴取得 | 认缴出资即取得股东资格 | 被记载于股东名册时（新公司法下认缴即取得资格，但须在5年内实缴） |\n\n▲ **实务要点**：新公司法实行5年实缴制后，认缴股东在未实缴出资期间仍具有股东资格，享有股东权利，但其表决权、分红权等权利可依据公司章程被合理限制。\n\n#### 2. 继受取得\n\n继受取得是指通过受让股权、继承、赠与等方式取得股东资格。\n\n**（1）股权转让**\n\n◆ **[[📋 公司法知识库/00-公司法全文#第84条|《公司法》第84条]]**：有限责任公司的股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权，应当将股权转让的有关事项书面通知其他股东，其他股东自接到书面通知之日起三十日内未答复的，视为同意转让。其他股东半数以上不同意转让的，不同意的股东应当购买该转让的股权；不购买的，视为同意转让。\n\n**新公司法重大变化**：取消了旧公司法关于对外转让股权须经其他股东过半数同意的规定，简化为书面通知制度。其他股东仅享有**同等条件下的优先购买权**。\n\n- 股东之间自由转让（无需通知）\n- 对外转让：书面通知 → 30日未答复视为同意 → 同等条件下其他股东有优先购买权\n\n**（2）继承**\n\n自然人股东死亡后，其合法继承人可以继承股东资格。但是，公司章程另有规定的除外（[[📋 公司法知识库/00-公司法全文#第90条|《公司法》第90条]]）。\n\n▲ **实务注意**：公司章程可以排除或限制股东资格的继承。如果章程约定\"股东死亡后其继承人不得继承股东资格\"，则继承人仅能继承股权对应的财产权益，而不能取得股东资格。\n\n**（3）赠与**\n\n股东可以将其股权赠与他人。赠与股权参照股权转让的规则，需遵守公司章程的规定。\n\n#### 3. 善意取得\n\n股权的善意取得，是指无权处分人转让股权，受让人善意且以合理价格受让，并已完成变更登记（股东名册变更或工商变更登记）的，受让人取得股权。\n\n善意取得的构成要件：\n1. 无权处分（如冒名转让、伪造签名转让）\n2. 受让人善意（不知道且不应当知道转让人无处分权）\n3. 以合理价格转让\n4. 已完成变更登记\n\n### （二）股东资格的确认\n\n#### 1. 出资证明书\n\n◆ 有限公司成立后，应当向股东签发出资证明书，由公司**盖章**。有限公司股权转让后，公司应当**注销**原股东的出资证明书，向新股东签发出资证明书。\n\n出资证明书的**内容**：（1）公司名称；（2）公司成立日期；（3）公司注册资本；（4）股东的姓名或者名称、认缴和实缴的出资额、出资方式和出资日期；（5）出资证明书的编号和核发日期。\n\n▲ 出资证明书只记载**该股东**出资的相关信息，并不体现其他股东的出资情况。\n\n#### 2. 股东名册的效力\n\n◆ **[[📋 公司法知识库/00-公司法全文#第56条|《公司法》第56条]]**：有限责任公司应当置备股东名册，记载下列事项：\n- 股东的姓名或者名称及住所\n- 股东的出资额、出资方式和出资日期\n- 出资证明书编号\n\n**有限公司股东"},{"id":"董事-监事-高级管理人员制度","title":"董事、监事、高级管理人员制度","excerpt":"◆ 核心规则：根据《公司法》第59条，股东会行使选举和更换董事的职权。有限责任公司的董事由股东会选举产生；股份有限公司的董事由股东大会选举产生。 概念： - 董事是由公司股东会选举产生的，负责公司内部管理和对外经营决策的人员 - 全体董事组成董事会，董事会是公司的日常经营决策机构 任职资格的消极条件（第146条）： - 无民事行为能力或者限制民事行为能力 - 因贪污、贿赂、侵占财产、挪用财产或者破","slug":"董事-监事-高级管理人员制度","module":"03-治理与财务","moduleName":"治理与财务","tags":[],"wordCount":8721,"created":"","updated":"","content":"# 第六章 董事、监事、高级管理人员制度\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[董监高制度] --> B[董事<br>选任·义务·审计委员会]\n    A --> C[监事/监事会<br>vs审计委员会]\n    A --> D[高管<br>经理·财负责人·董秘]\n    A --> E[责任体系<br>赔偿·代表诉讼·归入权]\n    A --> F[关联交易·竞业禁止]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）董事制度\n\n#### 1. 董事的资格与选任\n\n◆ **核心规则**：根据[[📋 公司法知识库/00-公司法全文#第59条|《公司法》第59条]]，股东会行使选举和更换董事的职权。有限责任公司的董事由股东会选举产生；股份有限公司的董事由股东大会选举产生。\n\n**概念**：\n- 董事是由公司股东会选举产生的，负责公司内部管理和对外经营决策的人员\n- 全体董事组成董事会，董事会是公司的日常经营决策机构\n\n**任职资格的消极条件**（第146条）：\n- 无民事行为能力或者限制民事行为能力\n- 因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾五年；**被宣告缓刑的，自缓刑考验期满之日起未逾二年**\n- 因犯罪被剥夺政治权利，执行期满未逾五年；**被宣告缓刑的，自缓刑考验期满之日起未逾二年**\n- 担任破产清算的公司、企业的经理或者董事、厂长，对破产负有个人责任的，破产清算完结之日起未逾三年\n- **担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，被吊销营业执照、责令关闭之日起未逾三年**\n- 个人所负数额较大的债务到期未清偿**被人民法院列为失信被执行人**\n\n**不适格董监高的处理方式**：\n1. 违反规定选举、委派董事、监事或者聘任高级管理人员的，该选举、委派或者聘任**无效**\n2. 董事、监事、高级管理人员在任职期间出现不得担任董监高情形的，公司应当**解除其职务**\n\n> **注意**：新公司法取消了有限责任公司董事会人数上限，仅要求三人以上（第68条）。\n\n#### 2. 董事的任期与辞任\n\n- 董事任期由公司章程规定，每届任期不得超过三年，任期届满可以连选连任（第70条）\n- 董事辞任的，以公司收到辞任通知之日辞任生效；但在改选出的董事就任前，原董事仍应当依照法律、行政法规和公司章程的规定，履行董事职务\n\n#### 2.5  法定代表人\n\n◆ **核心规则**：法定代表人是依照法律或者公司章程的规定，代表公司从事民事活动的负责人。\n\n**法定代表人的要点**：\n1. 法定代表人以公司名义从事的民事活动，其法律后果由公司承受\n2. 法定代表人依照公司章程的规定，由**代表公司执行公司事务的董事或者经理**担任\n3. 担任法定代表人的董事或者经理辞任的，视为**同时辞去法定代表人**\n4. 法定代表人辞任的，公司应当在法定代表人辞任之日起**30日内**确定新的法定代表人\n5. 公司法定代表人变更，应当办理变更登记，变更登记申请书由**变更后的法定代表人**签署\n\n#### 3. 董事会的组成、职权与议事规则\n\n**董事会的组成**（第68条）：\n- 有限责任公司设董事会，成员为三人以上\n- 股东人数较少或者规模较小的有限责任公司，可以不设董事会，设一名董事（第75条）\n- 董事会设董事长一人，可以设副董事长\n\n**董事会的职权**（第67条）：\n| 职权类型 | 具体内容 |\n|---------|---------|\n| 召集权 | 召集股东会会议，并向股东会报告工作 |\n| 执行权 | 执行股东会的决议 |\n| 决策权 | 决定公司的经营计划和投资方案 |\n| 方案权 | 制订公司年度财务预算方案、决算方案、利润分配方案、弥补亏损方案 |\n| 方案权 | 制订公司增加或者减少注册资本、发行公司债券、合并、分立、解散或者变更公司形式的方案 |\n| 人事权 | 决定公司内部管理机构的设置；决定聘任或者解聘公司经理及其报酬事项 |\n| 制度权 | 制定公司的基本管理制度 |\n\n**议事规则**（第68条、第73条）：\n- 董事会决议的表决，实行一人一票\n- 董事会决议的表决，应当有过半数的董事出席方可举行；董事会作出决议，必须经全体董事的过半数通过\n\n#### 4. ◆ 董事的忠实义务与勤勉义务\n\n[[📋 公司法知识库/00-公司法全文#第180条|《公司法》第180条]]是新公司法的核心条款之一，首次以立法形式明确界定了忠实义务与勤勉义务的内涵：\n\n**忠实义务**（第180条第1款）：\n> 董事、监事、高级管理人员对公司负有忠实义务，应当采取措施避免自身利益与公司利益冲突，不得利用职"},{"id":"公司财务会计制度","title":"公司财务会计制度","excerpt":"公司财务会计制度是公司法的重要组成部分，其核心功能在于： 1. 信息透明：通过规范的财务会计制度，确保股东、债权人等利益相关者获取公司真实的财务信息 2. 资本维持：通过利润分配的法定程序，防止公司资产不当流出，保护债权人利益 3. 公司治理：财务会计信息是股东监督公司经营管理的重要工具 法律渊源： - 《公司法》第208条至第216条 - 《中华人民共和国会计法》 - 《企业会计准则》 《公司法","slug":"公司财务会计制度","module":"03-治理与财务","moduleName":"治理与财务","tags":[],"wordCount":5603,"created":"","updated":"","content":"# 第七章 公司财务会计制度\n\n## 一、知识框架\n\n```mermaid\ngraph LR\n    A[公司财务会计制度] --> B[会计账簿<br>与财务报告]\n    A --> C[利润分配制度<br>弥补·提取·分配]\n    A --> D[公积金制度<br>资本·盈余]\n    A --> E[股东分红权<br>有限公司·股份公司]\n    A --> F[审计与聘任]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）公司财务会计制度概述\n\n公司财务会计制度是公司法的重要组成部分，其核心功能在于：\n\n1. **信息透明**：通过规范的财务会计制度，确保股东、债权人等利益相关者获取公司真实的财务信息\n2. **资本维持**：通过利润分配的法定程序，防止公司资产不当流出，保护债权人利益\n3. **公司治理**：财务会计信息是股东监督公司经营管理的重要工具\n\n**法律渊源**：\n- [[📋 公司法知识库/00-公司法全文#第208条|《公司法》第208条]]至第216条\n- 《中华人民共和国会计法》\n- 《企业会计准则》\n\n---\n\n### （二）会计账簿与财务报告\n\n#### 1. 会计账簿\n\n**[[📋 公司法知识库/00-公司法全文#第208条|《公司法》第208条]]**：\n> 公司应当依照法律、行政法规和国务院财政部门的规定建立本公司的财务、会计制度。\n\n公司应当在每一会计年度终了时编制财务会计报告，并依法经会计师事务所审计。\n\n**会计账簿的基本要求**：\n- 真实性：不得伪造、变造会计凭证、会计账簿\n- 完整性：不得隐匿或者故意销毁会计凭证、会计账簿\n- 合法性：按照国家统一的会计制度进行核算\n\n#### 2. 财务会计报告\n\n**组成部分**（《会计法》第20条）：\n| 组成 | 内容 |\n|------|------|\n| 会计报表 | 资产负债表、利润表、现金流量表、所有者权益变动表 |\n| 会计报表附注 | 对报表项目的详细说明 |\n| 财务情况说明书 | 公司生产经营、利润实现和分配、资金增减和周转等情况 |\n\n▲ **实务重难点**：财务会计报告应当在召开股东会年会的二十日前置备于本公司，供股东查阅（第209条）。\n\n#### 3. 审计报告\n\n- 公司的财务会计报告应当依法经会计师事务所审计（第208条）\n- 审计报告是股东知情权行使的重要依据\n- 上市公司的年度财务会计报告必须经具有证券业务资格的会计师事务所审计\n\n---\n\n### （三）◆ 公司利润分配制度\n\n利润分配制度是公司法中最具实务重要性的制度之一，其核心在于平衡股东的投资回报期望与公司资本维持原则之间的张力。\n\n◆ **利润分配的前提条件**：股东分红必须以公司存在利润为前提；如无利润，不得进行分红，即**\"无盈不分\"**。\n\n#### 1. 利润分配的法定程序\n\n```mermaid\ngraph LR\n    A[公司税后利润] --> B{弥补以前年度亏损}\n    B -->|有亏损| C[弥补亏损]\n    B -->|无亏损| D[提取法定公积金]\n    C --> D\n    D -->|已达注册资本50%| E[可不再提取]\n    D -->|未达50%| D\n    E --> F[提取任意公积金]\n    D --> F\n    F --> G[向股东分配利润]\n```\n\n**利润分配计算示例**：\n> A有限公司2024年实现净利润500万元，上年度未弥补亏损为100万元，则利润分配流程如下：\n> 1. 净利润弥补亏损：500-100=400万元\n> 2. 提取法定公积金：400×10%=40万元，余额为：400-40=360万元\n> 3. 提取任意公积金：经股东会决议，提取任意公积金60万元。余额为：360-60=300万元\n> 4. 向股东分配利润：按股东实缴出资比例分配\n\n**法定程序的三个步骤**（第210条、第214条）：\n\n**第一步：弥补亏损**\n- 公司的法定公积金不足以弥补以前年度亏损的，在依照规定提取法定公积金之前，应当先用当年利润弥补亏损\n\n**第二步：提取法定公积金**\n- ◆ **核心规则**：公司分配当年税后利润时，应当提取利润的百分之十列入公司法定公积金\n- 公司法定公积金累计额为公司注册资本的百分之五十以上的，可以不再提取\n\n**第三步：分配利润**\n- 弥补亏损和提取公积金后所余税后利润，有限责任公司按照股东实缴的出资比例分配，全体股东约定不按出资比例分配的除外\n- 股份有限公司按照股东持有的股份比例分配，公司章程另有规定的除外\n\n#### 2. 法定公积金\n\n| 要素 | 内容 |\n|------|------|\n| 提取比例 | 税后利润的10% "},{"id":"公司重大变更","title":"公司重大变更","excerpt":"《公司法》第218条： 注意：公司合并，必然会导致原有主体的消灭。合并中对于需要解散的主体，无须清算。 各环节详解： （1）股东会决议（不适用于简易合并） - 有限责任公司：须经代表三分之二以上表决权的股东通过（第66条） - 股份有限公司：须经出席会议的股东所持表决权的三分之二以上通过 （2）编制资产负债表及财产清单 - 合并各方均应编制，以确定合并基准日各方的资产和负债 （3）通知债权人 - ","slug":"公司重大变更","module":"04-变更与终止","moduleName":"变更与终止","tags":[],"wordCount":9099,"created":"","updated":"","content":"# 第八章 公司重大变更\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[公司重大变更] --> B[合并<br>吸收合并·新设合并]\n    A --> C[分立<br>派生分立·新设分立]\n    A --> D[减资<br>实质减资·简易减资]\n    A --> E[增资<br>认缴新股·债转股·优先认购权]\n    A --> F[组织形式变更]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）公司合并\n\n#### 1. 吸收合并vs新设合并\n\n**[[📋 公司法知识库/00-公司法全文#第218条|《公司法》第218条]]**：\n\n| 合并类型 | 定义 | 效果 | 示例 |\n|---------|------|------|------|\n| 吸收合并 | 一个公司吸收其他公司，被吸收的公司解散 | 存续公司承继解散公司的全部权利义务 | A+B=A |\n| 新设合并 | 两个以上公司合并设立一个新的公司，合并各方解散 | 新设公司承继各方的全部权利义务 | A+B=C |\n\n> **注意**：公司合并，必然会导致原有主体的消灭。合并中对于需要解散的主体，无须清算。\n\n#### 2. 合并程序\n\n```mermaid\ngraph LR\n    A[董事会制订方案] --> B[股东会特别决议]\n    B --> C[编制资产负债表及财产清单]\n    C --> D[通知债权人并公告]\n    D --> E[债权人要求清偿或提供担保]\n    E --> F[办理变更登记/注销登记/设立登记]\n```\n\n**各环节详解**：\n\n**（1）股东会决议**（不适用于简易合并）\n- 有限责任公司：须经代表三分之二以上表决权的股东通过（第66条）\n- 股份有限公司：须经出席会议的股东所持表决权的三分之二以上通过\n\n**（2）编制资产负债表及财产清单**\n- 合并各方均应编制，以确定合并基准日各方的资产和负债\n\n**（3）通知债权人**\n- 公司应当自作出合并决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告（第220条）\n\n**（4）债权人保护**\n- ◆ **核心规则**：债权人自接到通知书之日起三十日内，未接到通知书的自公告之日起四十五日内，可以要求公司清偿债务或者提供相应的担保\n\n**（5）办理登记**\n- 吸收合并：存续公司办理变更登记，被吸收公司办理注销登记\n- 新设合并：合并各方办理注销登记，新设公司办理设立登记\n\n**[[📋 公司法知识库/00-公司法全文#第220条|《公司法》第220条]]**（法条原文）：\n> 公司合并，应当由合并各方签订合并协议，并编制资产负债表及财产清单。公司应当自作出合并决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。债权人自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，可以要求公司清偿债务或者提供相应的担保。\n\n#### 3. 合并的效力\n\n**[[📋 公司法知识库/00-公司法全文#第221条|《公司法》第221条]]**：\n> 公司合并时，合并各方的债权、债务，应当由合并后存续的公司或者新设的公司承继。\n\n**权利义务概括承受**：\n- 合并后存续或新设的公司概括承受合并各方的全部债权和债务\n- 这是法定的概括承受，不以个别通知债务人为要件\n- 合并各方在合并前签订的合同，由合并后的公司继续履行\n\n#### 4. 债权人保护\n\n◆ **[[📋 公司法知识库/00-公司法全文#第220条|《公司法》第220条]]——债权人的权利**：\n\n| 权利内容 | 行使期限 | 法律效果 |\n|---------|---------|---------|\n| 要求清偿债务 | 接到通知30日内/公告之日起45日内 | 公司应当清偿 |\n| 要求提供担保 | 同上 | 公司应当提供相应担保 |\n\n▲ **实务重难点**：公司合并中的债权人保护是公司法资本维持原则的重要体现。公司未依法通知已知债权人的，合并行为对未获通知的债权人不产生对抗效力。\n\n**异议股东回购请求权**：对股东会作出的合并决议投反对票的股东，有权要求公司回购其股权/股份。\n\n#### 5. 简易合并\n\n**（1）母子公司合并**\n- **规则**：公司与其持股90%以上的公司合并，被合并的公司不需经股东会决议，而是由**董事会决议**\n- **回购请求权**：被合并的公司应当通知其他股东，其他股东有权请求公司按照合理的价格收购其股权或者股份\n\n**（2）小规模合并**\n- **规则**：公司合并支付的价款不超过本公司净资产10%的，可以不经股东会决议，而是由**董事会决议**；但是，公司章"},{"id":"公司解散与清算","title":"公司解散与清算","excerpt":"公司解散，是指已成立的公司基于一定合法事由而消灭的法律行为。公司解散是公司终止的前置程序，解散后必须经过清算程序方可注销。 ◆ 公司出现解散事由，应当在10日内将解散事由通过国家企业信用信息公示系统予以公示。 ◆ 自愿解散是基于公司自身意志而解散，包括以下三种情形： (1) 章程规定的解散事由出现 公司章程可以约定公司的经营期限，期限届满即解散。此外，章程还可以规定其他解散事由，如特定经营目标完成","slug":"公司解散与清算","module":"04-变更与终止","moduleName":"变更与终止","tags":[],"wordCount":7165,"created":"","updated":"","content":"# 第九章 公司解散与清算\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[公司解散与清算] --> B[解散事由<br>自愿·法定·司法解散]\n    A --> C[清算制度<br>清算义务人·清算程序]\n    A --> D[清算责任<br>义务人赔偿·组成员赔偿]\n    A --> E[退出机制<br>简易注销·强制注销]\n```\n\n## 二、核心制度详解\n\n### （一）公司解散\n\n公司解散，是指已成立的公司基于一定合法事由而消灭的法律行为。公司解散是公司终止的前置程序，解散后必须经过清算程序方可注销。\n\n> ◆ 公司出现解散事由，应当在**10日内**将解散事由通过国家企业信用信息公示系统予以公示。\n\n#### 1. 自愿解散\n\n◆ **自愿解散**是基于公司自身意志而解散，包括以下三种情形：\n\n**(1) 章程规定的解散事由出现**\n\n公司章程可以约定公司的经营期限，期限届满即解散。此外，章程还可以规定其他解散事由，如特定经营目标完成、特定事件发生等。这是公司自治原则的体现。\n\n**(2) 股东会决议解散**\n\n股东会以**特别决议**方式作出解散决议，即须经代表**三分之二以上**表决权的股东通过（[[📋 公司法知识库/00-公司法全文#第66条|《公司法》第66条]]第3款）。解散决议属于公司重大事项，适用与修改章程、增减注册资本、合并分立等相同的表决门槛。\n\n> ▲ **公司存续机制**：若因章程规定的营业期限届满或章程规定的其他解散事由出现，股东会决议解散，但尚未向股东分配财产的，可通过修改公司章程或者经股东会决议而存续，该事项须经**2/3以上表决权**通过。\n\n**(3) 因合并或分立需要解散**\n\n公司合并中，被吸收的公司因合并而解散（吸收合并）；公司分立中，原公司可能因分立而解散（新设分立）。此种解散无需经过清算程序，因为其权利义务由合并或分立后的公司承继。\n\n#### 2. 法定解散\n\n◆ **法定解散**是基于法律规定的行政事由而解散：\n\n- **被吊销营业执照**：公司违反行政法规，被市场监督管理机关吊销营业执照\n- **被责令关闭**：因违法经营被行政机关责令关闭\n- **被撤销**：公司设立登记被撤销（如以欺诈手段取得登记）\n\n法定解散不以公司意志为转移，属于行政强制解散。公司被吊销营业执照后，其法人资格并不立即消灭，仍须经过清算程序。\n\n#### 3. 司法解散（股东请求法院解散公司） \n\n**法条原文**：[[📋 公司法知识库/00-公司法全文#第231条|《公司法》第231条]]——公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司**10%以上表决权**的股东，可以请求人民法院解散公司。\n\n**（1）适用条件**\n\n持有公司**全部股东表决权百分之十以上**的股东，可以请求人民法院解散公司。提起司法解散诉讼须满足以下条件：\n\n- **经营管理发生严重困难**：指公司治理结构层面的困难，而非经营亏损\n- **继续存续会使股东利益受到重大损失**\n- **通过其他途径不能解决**：穷尽内部救济\n\n**（2）\"经营管理严重困难\"的认定标准** \n\n| 认定情形 | 具体表现 |\n|---------|---------|\n| **股东会僵局** | 公司持续**2年以上**无法召开股东会，公司经营管理发生严重困难的 |\n| **决议僵局** | 股东表决时无法达到法定或者公司章程规定的比例，持续**2年以上**不能做出有效的股东会决议，公司经营管理发生严重困难的 |\n| **董事会僵局** | 公司董事长期冲突，且无法通过股东会解决，公司经营管理发生严重困难的 |\n| **其他严重困难** | 经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失的情形 |\n\n> ▲ **关键理解**：解散之诉中的\"经营管理严重困难\"指的是**治理困境**，而非财务困境。公司盈利不能作为抗辩解散之诉的理由。\n\n**（3）不受理解散之诉的情形**\n\n法院对以下情形**不予受理**解散之诉：\n\n- 知情权、利润分配请求权等权益受到损害\n- 公司亏损、财产不足以偿还全部债务\n- 公司被吊销企业法人营业执照未进行清算\n\n**（4）诉讼程序要点** \n\n| 程序要点 | 具体内容 |\n|---------|---------|\n| **原告** | 单独或合计持有公司**10%以上**表决权的股东 |\n| **被告** | 只能是**公司**；若原告以其他股东为被告一并提起诉讼的，法院应当告知原告将其他股东变更为第三人，原告坚持不予变更的，驳回对其他股东的起诉 |\n| **解散与清算分离** | 股东提起解散公司诉讼，同时又申"},{"id":"有限责任公司","title":"有限责任公司","excerpt":"有限责任公司（简称\"有限公司\"）是指由五十个以下股东出资设立，每个股东以其所认缴的出资额为限对公司承担责任，公司以其全部资产对公司债务承担责任的企业法人。 ◆ 有限公司的核心特征——人合性与资合性的统一： 人合性决定了有限公司在股权转让、组织机构等方面与股份公司存在重大差异，是理解有限公司全部制度的钥匙。 《公司法》第42条规定，有限责任公司由一个以上五十个以下股东出资设立。股东可以是自然人，也可","slug":"有限责任公司","module":"05-有限责任公司","moduleName":"有限责任公司","tags":[],"wordCount":14117,"created":"","updated":"","content":"# 第十章 有限责任公司\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[有限责任公司] --> B[设立·出资<br>认缴制·5年实缴]\n    A --> C[股权转让<br>通知+优先购买权]\n    A --> D[组织机构<br>股东会·董事会·监事会/审计委员会]\n    A --> E[一人公司<br>举证责任倒置]\n    A --> F[实务重点<br>代持·中小股东保护]\n```\n\n## 二、核心制度详解\n\n### （一）有限公司的概念与特征\n\n有限责任公司（简称\"有限公司\"）是指由**五十个以下**股东出资设立，每个股东以其所认缴的出资额为限对公司承担责任，公司以其全部资产对公司债务承担责任的企业法人。\n\n◆ **有限公司的核心特征——人合性与资合性的统一**：\n\n| 特征类型 | 具体表现 |\n|---------|---------|\n| **人合性** | 股东之间存在一定的人身信任关系；股权转让受限制；股东人数有上限 |\n| **资合性** | 股东以出资为限承担有限责任；公司以其全部资产对外承担责任 |\n| **封闭性** | 不公开募集资本；股权不上市流通；财务信息不强制公开 |\n\n人合性决定了有限公司在股权转让、组织机构等方面与股份公司存在重大差异，是理解有限公司全部制度的钥匙。\n\n---\n\n### （二）◆ 有限公司的设立\n\n#### 1. 股东人数\n\n[[📋 公司法知识库/00-公司法全文#第42条|《公司法》第42条]]规定，有限责任公司由**一个以上五十个以下**股东出资设立。股东可以是自然人，也可以是法人或非法人组织。\n\n#### 2. 注册资本——认缴制与5年内实缴\n\n◆ **新公司法的重大变化**：[[📋 公司法知识库/00-公司法全文#第47条|《公司法》第47条]]规定，全体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起**五年内**缴足。\n\n| 要点 | 具体内容 |\n|------|---------|\n| **认缴制** | 股东自主约定出资额、出资方式、出资期限，记载于章程 |\n| **5年实缴期限** | 全体股东认缴的出资额须自公司成立之日起五年内缴足 |\n| **最低限额** | 新公司法未规定最低注册资本（特殊行业除外） |\n| **过渡安排** | 存量公司按国务院规定逐步调整至5年内 |\n\n▲ **实务要点**：认缴制并非\"不缴制\"，股东须在章程约定期限内（不超过5年）实际缴纳出资。认缴高额出资但不实缴的，面临出资加速到期、失权等风险。\n\n#### 3. 公司章程\n\n◆ 有限公司的章程是公司的\"宪法\"，由全体股东共同制定并签名盖章。[[📋 公司法知识库/00-公司法全文#第46条|《公司法》第46条]]规定章程应当载明：\n\n- 公司名称和住所\n- 公司经营范围\n- 公司注册资本\n- 股东的姓名或名称\n- 股东的出资额、出资方式和出资日期\n- 公司的机构及其产生办法、职权、议事规则\n- 公司法定代表人的产生、变更办法\n- 股东会认为需要规定的其他事项\n\n▲ **实务中**，章程是预防公司僵局、保护中小股东的核心工具。律师应当协助客户制定个性化章程，而非使用登记机关的格式范本。\n\n---\n\n### （三）◆ 股东出资制度\n\n#### 1. 出资方式与评估\n\n[[📋 公司法知识库/00-公司法全文#第48条|《公司法》第48条]]规定，股东可以用**货币**出资，也可以用**实物、知识产权、土地使用权、股权、债权**等可以用货币估价并可以依法转让的非货币财产作价出资。\n\n▲ **不得作为出资的财产**：劳务、信用、自然人姓名、商誉、特许经营权或者设定担保的财产等。\n\n非货币财产出资应当**评估作价**，核实财产，不得高估或者低估作价。法律、行政法规对评估作价有规定的，从其规定。\n\n#### 2. 出资瑕疵责任\n\n◆ **[[📋 公司法知识库/00-公司法全文#第50条|《公司法》第50条]]**规定了股东未按期足额缴纳出资的法律责任：\n\n- **补缴责任**：应当按期足额缴纳公司章程规定的各自所认缴的出资额\n- **违约责任**：未按期足额缴纳出资的，除应当向公司足额缴纳外，还应当对已按期足额缴纳出资的股东承担违约责任\n- **设立时股东的连带责任**：有限责任公司设立时，股东未按照公司章程规定实际缴纳出资，或者实际出资的非货币财产的实际价额显著低于所认缴的出资额的，**设立时的其他股东与该股东在出资不足的范围内承担连带责任**\n\n▲ **新公司法重大变化**：新公司法明确了设立时的股东对其他股东的出资承担连带责任，强化了股东之间的相互监督义务。\n\n#### 3. 出资加速到期\n\n◆ **[[📋 公司法知识库/"},{"id":"股份有限公司","title":"股份有限公司","excerpt":"股份有限公司（以下简称\"股份公司\"）是指全部资本分为等额股份，股东以其所持股份为限对公司承担责任，公司以其全部财产对公司债务承担责任的企业法人。 核心特征： - 资合性：以资本的结合作为信用基础，股东之间的人身信任关系不是公司存续的前提。这是与有限责任公司人合性特征的根本区别。 - 开放性：股份可以依法自由转让，公司可以通过公开发行股份向社会募集资金。 - 资本等额性：全部资本划分为等额股份，每一","slug":"股份有限公司","module":"06-股份有限公司","moduleName":"股份有限公司","tags":[],"wordCount":8906,"created":"","updated":"","content":"# 第十一章 股份有限公司\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[股份有限公司] --> B[设立·发起人<br>发起设立·募集设立]\n    A --> C[股份与股票<br>面额股·无面额股·类别股]\n    A --> D[股份转让<br>锁定期·回购限制]\n    A --> E[组织机构<br>股东大会·董事会5-19人]\n    A --> F[上市公司<br>上市条件·独立董事·信息披露]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）股份公司的概念与特征\n\n股份有限公司（以下简称\"股份公司\"）是指全部资本分为等额股份，股东以其所持股份为限对公司承担责任，公司以其全部财产对公司债务承担责任的企业法人。\n\n**核心特征：**\n\n- **资合性**：以资本的结合作为信用基础，股东之间的人身信任关系不是公司存续的前提。这是与[[📋 公司法知识库/11-有限责任公司|有限责任公司]]人合性特征的根本区别。\n- **开放性**：股份可以依法自由转让，公司可以通过公开发行股份向社会募集资金。\n- **资本等额性**：全部资本划分为等额股份，每一股份金额相等，体现股东平等原则。\n- **组织规范性**：法律对股份公司的组织机构、议事规则、信息披露等有更为严格的要求。\n\n### （二）◆ 股份公司的设立\n\n#### 1. 发起人\n\n◆ **发起人条件**：应当有 **1人以上200人以下** 为发起人（新公司法允许一人发起设立股份公司），其中 **半数以上** 的发起人在中国境内有住所（[[📋 公司法知识库/00-公司法全文#第92条|《公司法》第92条]]）。\n\n发起人既可以是自然人，也可以是法人。法律、行政法规禁止从事营利性活动的人（如公务员）不得作为发起人。\n\n> ○ 发起人承担公司筹办事务。发起人应当签订**发起人协议**，明确各自在公司设立过程中的权利和义务。\n\n#### 2. 设立方式\n\n| 设立方式 | 发起设立 | 募集设立 |\n|---------|---------|---------|\n| 定义 | 发起人认购全部股份 | 发起人认购部分股份，其余向社会公开募集或向特定对象募集 |\n| 发起人认购比例 | 认购全部股份 | 不得少于公司股份总数的 **35%**（[[📋 公司法知识库/00-公司法全文#第93条|《公司法》第93条]]） |\n| 适用场景 | 规模较小、股东人数较少 | 需要大规模融资的企业 |\n| 程序复杂度 | 相对简单 | 需公告招股说明书、签订承销协议等 |\n\n#### 3. 注册资本\n\n◆ **注册资本** 为在公司登记机关登记的 **已发行股份的股本总额**（[[📋 公司法知识库/00-公司法全文#第96条|《公司法》第96条]]）。与有限公司不同，股份公司的注册资本不采用\"认缴制\"，而是以实际已发行的股份票面金额为准。\n\n> ▲ **实缴出资**：发起人应当在公司成立前按照其认购的股份**全额缴纳**股款。在发起人认购的股份缴足前，不得向他人募集股份。\n\n#### 3.1 募集设立的特殊规定\n\n**(1) 发起人认购比例**：发起人认购的股份不得少于公司设立时应发行股份总数的**35%**。\n\n**(2) 成立大会**\n\n| 要点 | 内容 |\n|------|------|\n| **时间** | 发起人应当自股款缴足之日起**30日内**主持召开公司成立大会 |\n| **组成** | 成立大会应有代表股份总数**过半数**的认股人出席，方可举行 |\n| **职权** | ①审议发起人关于公司筹办情况的报告；②通过公司章程；③选举董事、监事；④对公司的设立费用进行审核；⑤对发起人非货币财产出资的作价进行审核；⑥发生不可抗力或者经营条件发生重大变化直接影响公司设立的，可以作出不设立公司的决议 |\n| **决议** | 成立大会对上述事项作出决议，必须经出席会议的认股人所持表决权**过半数**通过 |\n\n**(3) 不得抽回股本**：发起人、认股人缴纳股款或者交付抵作股款的出资后，除未按期募足股份、发起人未按期召开成立大会，或者成立大会决议不设立公司的情形外，不得抽回其股本。\n\n**(4) 设立登记**：董事会应当授权代表，于成立大会结束后**30日内**，向公司登记机关申请设立登记。\n\n#### 4. 发起人的连带责任\n\n◆ 公司不能成立时，发起人对设立行为所产生的债务和费用负 **连带责任**；对认股人已缴纳的股款，负返还股款并加算银行同期存款利息的连带责任（[[📋 公司法知识库/00-公司法全文#第94条|《公司法》第94条]]）。\n\n在公司设立过程中，因发起人的过失致使公司利益受到损害的，发起人应当对公司承担赔偿"},{"id":"国家出资公司","title":"国家出资公司","excerpt":"◆ 新公司法设专章（第七章）规定\"国家出资公司组织机构的特别规定\"，这是新公司法的重大立法创新。《公司法》第168条规定：国家出资公司，是指国家出资的国有独资公司、国有资本控股公司，包括国家出资的有限责任公司、股份有限公司。 国家出资公司的范围包括三个层次： ▲ 重要变化：新公司法将适用范围从原来的\"国有独资公司\"扩展至\"国家出资公司\"，涵盖了国有独资、国有控股两种类型，但国有资本参股公司不纳入专","slug":"国家出资公司","module":"07-特殊公司","moduleName":"特殊公司","tags":[],"wordCount":5037,"created":"","updated":"","content":"# 第十二章 国家出资公司\n\n## 一、知识框架\n\n```mermaid\ngraph TD\n    A[国家出资公司] --> B[概念与范围<br>国有独资·国有控股]\n    A --> C[特殊治理<br>出资人机构·外部董事·党组织]\n    A --> D[关联交易规制<br>禁止无偿提供·关联董事回避]\n    A --> E[资产评估与转让]\n    A --> F[实务重点<br>混改·审批·流失责任·合规]\n```\n\n---\n\n## 二、核心制度详解\n\n### （一）国家出资公司的概念与范围\n\n◆ 新公司法设专章（第七章）规定\"国家出资公司组织机构的特别规定\"，这是新公司法的重大立法创新。[[📋 公司法知识库/00-公司法全文#第168条|《公司法》第168条]]规定：**国家出资公司**，是指国家出资的国有独资公司、国有资本控股公司，包括国家出资的有限责任公司、股份有限公司。\n\n国家出资公司的范围包括三个层次：\n\n| 类型 | 定义 | 特征 |\n|-----|------|------|\n| **国有独资公司** | 国家单独出资、由国务院或者地方人民政府授权本级人民政府国有资产监督管理机构履行出资人职责的公司 | 唯一股东为国家（通过国资委等机构） |\n| **国有资本控股公司** | 国有资本占控股地位的公司，包括国有资本持股50%以上或虽不足50%但其表决权足以产生重大影响的公司 | 国有资本具有控制力 |\n| **国有资本参股公司** | 国有资本参股但不控股的公司 | 国有资本参与投资但不具有控制地位 |\n\n▲ **重要变化**：新公司法将适用范围从原来的\"国有独资公司\"扩展至\"国家出资公司\"，涵盖了国有独资、国有控股两种类型，但国有资本参股公司不纳入专章调整范围。\n\n> ○ **注意**：国家出资公司仅限于国家**直接出资**的公司，而不包括国家出资公司再投资设立的公司。\n>\n> □ **案例**：中国石油天然气集团有限公司（简称中石油集团）由国务院国资委100%持股，系国有独资公司，属于国家出资公司。中国石油天然气股份有限公司（简称中石油股份公司）由中石油集团持股82.46%，系国家出资公司再投资设立的公司，**不属于**国家出资公司。\n\n#### 履行出资人职责的机构\n\n- 国家出资公司，由国务院或者地方人民政府分别代表国家依法履行出资人职责，享有出资人权益。\n- 国务院或者地方人民政府可以授权国有资产监督管理机构或者其他部门、机构代表本级人民政府对国家出资公司履行出资人职责。\n\n### （二）◆ 国家出资公司的特殊治理结构\n\n#### 1. 不设股东会，由履行出资人职责的机构行使股东会职权\n\n◆ [[📋 公司法知识库/00-公司法全文#第169条|《公司法》第169条]]规定：国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权。履行出资人职责的机构可以授权公司董事会行使股东会的部分职权，但公司的合并、分立、解散、申请破产、增减注册资本、发行公司债券、分配利润等重大事项，必须由履行出资人职责的机构 **决定或者批准**。\n\n> ○ **须由履行出资人职责的机构决定的事项（7-1+2）**：7个特别决议事项**减去**变更公司形式，**加上**申请破产、分配利润。即：①公司章程的**制定和修改**；②公司的**合并、分立、解散**；③**申请破产**；④增加或者减少**注册资本**；⑤分配**利润**。\n\n这一制度设计的核心逻辑是：国有独资公司的唯一股东是国家，国家通过国资委等机构行使出资人权利，无需设置股东会。\n\n#### 2. 董事会：外部董事应过半数\n\n◆ [[📋 公司法知识库/00-公司法全文#第173条|《公司法》第173条]]规定：国有独资公司的董事会成员中，应当 **过半数** 为外部董事。董事会成员由履行出资人职责的机构 **委派**。\n\n**外部董事制度** 是新公司法强化国有公司治理的重要举措：\n- 外部董事不在公司担任除董事以外的其他职务\n- 目的是增强董事会的独立性和决策科学性\n- 有效防止\"内部人控制\"问题\n\n#### 3. 党组织的领导作用\n\n◆ [[📋 公司法知识库/00-公司法全文#第170条|《公司法》第170条]]规定：国家出资公司中中国共产党的组织，按照中国共产党章程的规定发挥 **领导作用**，研究讨论公司重大经营管理事项，支持公司的组织机构依法行使职权。\n\n▲ 这是新公司法首次在公司法层面明确党组织在国家出资公司中的领导地位，将党的领导融入公司治理的法律框架之中。实践中需要处理好党组织前置研究讨论与董事会决策之间的衔接关系。\n\n### （三）国有独资公司的特别规定\n\n#### 1. 章程制定\n\n国有独资公司的章程由 **履行出资人职"},{"id":"王毓莹教授公司法学术观点","title":"王毓莹教授公司法学术观点","excerpt":"内容定位：本专题系统整理王毓莹教授在公司法领域的核心学术观点，重点收录其经典论文的核心论证与原文精华，与知识库各章节作双链衔接，便于对照学习与实务应用。 - 博士（2002-2005）：中国政法大学 民商法学（公司法方向） - 硕士（1999-2002）：中国政法大学 民商法学（公司法方向） 2002年7月至2020年12月，历任最高人民法院民一庭书记员、助理审判员、审判员，最高人民法院第一巡回法","slug":"王毓莹教授公司法学术观点","module":"10-学者观点","moduleName":"学者观点","tags":[],"wordCount":11487,"created":"","updated":"","content":"# 王毓莹教授公司法学术观点专题\n\n> **内容定位**：本专题系统整理王毓莹教授在公司法领域的核心学术观点，重点收录其经典论文的核心论证与原文精华，与知识库各章节作双链衔接，便于对照学习与实务应用。\n\n---\n\n## 一、学者简介\n\n### 基本信息\n\n| 项目 | 内容 |\n|------|------|\n| **姓名** | 王毓莹 |\n| **现任职务** | 中国政法大学法律学院教授、博士生导师 |\n| **研究中心** | 中国政法大学合规与风险防控研究中心主任 |\n| **曾任职务** | 最高人民法院二级高级法官（近20年审判经历） |\n| **挂职经历** | 最高人民检察院第六检察厅副厅长 |\n| **立法参与** | 《公司法》修改组工作组成员 |\n| **荣誉** | \"2021中国商法年度人物\" |\n| **公众号** | \"法盏\"（关注人数超10万） |\n\n### 学术背景\n\n- **博士**（2002-2005）：中国政法大学 民商法学（公司法方向）\n- **硕士**（1999-2002）：中国政法大学 民商法学（公司法方向）\n\n### 审判经历\n\n2002年7月至2020年12月，历任最高人民法院民一庭书记员、助理审判员、审判员，最高人民法院第一巡回法庭、最高人民法院民二庭主审法官、审判长。审理民商事案件数千件，所办案件多次入选指导性案例、人民法院公报案例和《人民法院案例选》。\n\n### 司法解释起草\n\n在最高人民法院工作期间，主笔和参与了大量司法解释、规范性文件的起草工作，包括：\n- 《关于审理民间借贷案件适用法律若干问题的规定》\n- 《关于适用〈中华人民共和国公司法〉若干问题的规定（五）》\n- 《新建设工程施工合同司法解释（一）》\n- 《第九次全国民商事审判会议纪要》（[[📋 公司法知识库/01-公司法总览|九民纪要]]）\n- 《网络消费纠纷司法解释（一）》\n- 《关于审理执行异议之诉案件适用法律若干问题的规定》等\n\n### 学术定位\n\n王毓莹教授兼具深厚的理论功底与丰富的实务经验，其研究特点是**\"从裁判视角出发、以问题为导向\"**，注重理论与实务的结合，善于在学术争议中提出独到观点并指明裁判趋向。其研究覆盖公司法核心制度，尤其在[[📋 公司法知识库/02-公司法基础理论|公司资本制度]]、[[📋 公司法知识库/07-董监高制度|董事义务]]、[[📋 公司法知识库/02-公司法基础理论|法人人格否认]]等领域具有重要学术影响力。\n\n---\n\n## 二、主要著作与论文\n\n### （一）代表著作\n\n| 著作名称 | 出版信息 | 内容定位 |\n|---------|---------|---------|\n| 《新公司法二十四讲：审判原理与疑难问题深度释解》 | 法律出版社2024年版 | 以近30年公司法研学功力，从裁判视角解读新公司法实务难点，涉及近百个典型案例 |\n\n**著作特色**：\n1. **鲜明的问题意识**：聚焦公司治理纠纷高频、疑难复杂命题\n2. **独特的编排体例**：每专题沿\"规范梳整→理论基础→审判实务→典型案例\"脉络展开\n3. **精到的案例分析**：案例绝大多数为最高法院指导性案例、公报案例\n4. **真切的立法回应**：对历次修订草案一一作出回应，分析利弊得失\n\n> **来源链接**：[法制日报推荐](http://www.legaldaily.com.cn/newzt/content/2024-04/23/content_8988110.html) | [中国政法大学法律学院教师主页](https://flxy.cupl.edu.cn/info/1199/14238.htm)\n\n### （二）公司法核心论文一览\n\n| 序号 | 论文标题 | 期刊 | 年份/期次 | 关联知识点 |\n|------|---------|------|----------|-----------|\n| 1 | 论董事对股东出资的催缴义务 | 《现代法学》CLSCI | 2024年第6期 | [[📋 公司法知识库/05-公司的设立\\|公司的设立]]、[[📋 公司法知识库/07-董监高制度\\|董监高制度]] |\n| 2 | 论股份回购的资本规制 | 《比较法研究》CLSCI | 2025年第1期 | [[📋 公司法知识库/08-公司财务会计\\|财务会计]]、[[📋 公司法知识库/12-股份有限公司\\|股份有限公司]] |\n| 3 | 公司减资规则的反思与重构 | 《环球法律评论》CLSCI | 2024年第1期 | [[📋 公司法知识库/09-公司重大变更\\|公司重大变更]] |\n| 4 | 论禁止抽逃出资规则的规范定位 | 《比较法研究》CLSCI | 2023年第5"},{"id":"实务-公司决议效力判断","title":"实务-公司决议效力判断","excerpt":"公司决议是公司意思形成的核心机制。股东会决议和董事会决议作为公司最高决策的形式，其效力直接关系到公司行为的合法性基础。在实务中，公司决议效力争议是公司诉讼中最常见的类型之一。 典型争议场景： - 未实际召开会议却形成了\"决议\"； - 会议通知程序存在瑕疵； - 表决权比例未达到法定或章程要求； - 决议内容违反法律或公司章程； - 利害关系股东参与表决。 这些问题的核心是：在公司决议存在程序或内容","slug":"实务-公司决议效力判断","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":4489,"created":"","updated":"","content":"# 实务：公司决议效力判断\n\n## 一、问题引入：公司决议效力争议的类型化分析\n\n公司决议是公司意思形成的核心机制。股东会决议和董事会决议作为公司最高决策的形式，其效力直接关系到公司行为的合法性基础。在实务中，公司决议效力争议是公司诉讼中最常见的类型之一。\n\n**典型争议场景**：\n- 未实际召开会议却形成了\"决议\"；\n- 会议通知程序存在瑕疵；\n- 表决权比例未达到法定或章程要求；\n- 决议内容违反法律或公司章程；\n- 利害关系股东参与表决。\n\n这些问题的核心是：**在公司决议存在程序或内容瑕疵时，如何判断其效力？** 新《公司法》建立了\"不成立—可撤销—无效\"三层次的效力判断体系，为司法实践提供了清晰的裁判框架。\n\n```mermaid\ngraph TD\n    A[公司决议效力争议] --> B{决议是否成立?}\n    B -->|不成立| C[决议不成立<br>第25条]\n    B -->|成立| D{内容是否违法?}\n    D -->|违反法律/行政法规| E[决议无效<br>第25条]\n    D -->|内容合法| F{程序/内容<br>是否违反章程?}\n    F -->|是| G[决议可撤销<br>第26条]\n    F -->|否| H[决议有效]\n    C --> I[自始无效<br>不存在效力问题]\n    E --> I\n    G --> J[除斥期间60日<br>逾期则有效]\n    style C fill:#f96,stroke:#333\n    style E fill:#f96,stroke:#333\n    style G fill:#ff9,stroke:#333\n    style H fill:#6f9,stroke:#333\n    style I fill:#f96,stroke:#333\n    style J fill:#ff9,stroke:#333\n```\n\n---\n\n## 二、法律框架\n\n新[[📋 公司法知识库/00-公司法全文#第25条|《公司法》第25-28条]]建立了公司决议效力的三层次体系：\n\n| 效力状态 | 法律条文 | 瑕疵类型 | 法律后果 |\n|----------|----------|----------|----------|\n| 不成立 | 第25条 | 严重程序瑕疵 | 自始不存在 |\n| 无效 | 第25条 | 内容违法 | 自始无效 |\n| 可撤销 | 第26条 | 程序/内容违反章程 | 可撤销 |\n\n---\n\n## 三、◆ 决议不成立（第25条）\n\n### （一）法律依据\n\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第25条|《公司法》第25条]]规定了决议不成立的情形。公司股东会、董事会的决议内容违反法律、行政法规的，股东可以请求人民法院确认决议不成立。\n\n结合《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定（四）》（以下简称《公司法司法解释四》），决议不成立的情形包括：\n\n### （二）决议不成立的具体情形\n\n**1. 未召开会议**\n\n公司未召开股东会、董事会会议，却形成了所谓的\"决议\"。这种情形下，决议不具备成立的基本要件，属于最严重的程序瑕疵。\n\n**典型情形**：\n- 仅有部分股东签字，未实际召开会议；\n- 以书面传签方式替代会议，但不符合章程规定；\n- 董事会成员仅通过电话或微信沟通，未形成正式会议记录。\n\n**2. 未对决议事项进行表决**\n\n虽然召开了会议，但未对相关事项进行表决。例如：\n- 会议议程中未包含该决议事项；\n- 会议记录中无表决记载；\n- 以\"一致同意\"替代正式表决程序。\n\n**3. 出席人数或表决权不达标**\n\n出席会议的人数或股东所持表决权不符合法律或公司章程的规定。例如：\n- 有限公司股东会出席人数不足章程要求；\n- 股份公司股东大会出席股东所持股份不足法定比例。\n\n**4. 表决结果未达到法定或章程比例**\n\n表决结果未达到《公司法》或者公司章程规定的通过比例。例如：\n- 普通决议未达到出席会议的股东所持表决权过半数通过；\n- 特别决议未达到三分之二以上表决权通过。\n\n### （三）不成立的法律后果\n\n◆ **决议不成立的法律后果**：\n- 决议自始不存在，不产生任何法律效力；\n- 基于该决议实施的行为可能被认定为无效；\n- 任何利害关系人均可主张决议不成立；\n- 不受诉讼时效限制（确认之诉不适用诉讼时效）。\n\n---\n\n## 四、◆ 决议可撤销（第26条）\n\n### （一）法律依据\n\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第26条|《公司法》第26条]]规定了决议可撤销的情形。\n\n### （二）可撤销的具体情形\n\n**1."},{"id":"实务-公司担保的审查与风险","title":"实务-公司担保的审查与风险","excerpt":"公司对外担保是商事交易中最常见的增信方式之一，也是司法实务中纠纷最为集中的领域之一。其高频争议的核心原因在于：公司对外担保涉及公司意思表示的形成、法定代表人权限的边界、相对人合理信赖的保护等多重法律关系的交织。 在实践中，大量担保纠纷源于以下场景： - 法定代表人未经公司决议擅自对外提供担保； - 公司章程对担保设有限制，但相对人未予审查； - 关联担保中未执行回避表决程序； - 上市公司对外担保","slug":"实务-公司担保的审查与风险","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":3533,"created":"","updated":"","content":"# 实务：公司担保的审查与风险\n\n## 一、问题引入：公司对外担保为何是高频纠纷领域\n\n公司对外担保是商事交易中最常见的增信方式之一，也是司法实务中纠纷最为集中的领域之一。其高频争议的核心原因在于：**公司对外担保涉及公司意思表示的形成、法定代表人权限的边界、相对人合理信赖的保护等多重法律关系的交织**。\n\n在实践中，大量担保纠纷源于以下场景：\n- 法定代表人未经公司决议擅自对外提供担保；\n- 公司章程对担保设有限制，但相对人未予审查；\n- 关联担保中未执行回避表决程序；\n- 上市公司对外担保未履行信息披露义务。\n\n这些问题的实质是：**当公司内部治理程序存在瑕疵时，对外担保合同的效力如何认定？** 这需要在公司自治、交易安全与善意保护之间寻求平衡。\n\n```mermaid\ngraph TD\n    A[公司对外担保] --> B{是否有决议?}\n    B -->|有| C{决议是否合法?}\n    B -->|无| D[越权代表]\n    C -->|合法| E[担保有效]\n    C -->|不合法| F{相对人是否善意?}\n    D --> F\n    F -->|善意| G[担保有效<br>公司承担责任]\n    F -->|非善意| H[担保对公司<br>不发生效力]\n    style D fill:#f96,stroke:#333\n    style H fill:#f96,stroke:#333\n    style E fill:#6f9,stroke:#333\n    style G fill:#6f9,stroke:#333\n```\n\n---\n\n## 二、法律框架\n\n### （一）[[📋 公司法知识库/00-公司法全文#第15条|《公司法》第15条]]：公司对外担保的决议程序\n\n◆ **核心规则**：2024年新[[📋 公司法知识库/00-公司法全文#第15条|《公司法》第15条]]（原[[📋 公司法知识库/00-公司法全文#第16条|《公司法》第16条]]）确立了公司对外担保的基本决议程序框架，是判断担保效力的核心法律依据。\n\n#### 1. 一般担保\n\n公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议。这意味着：\n\n- **决议机关的授权来源是公司章程**，而非法律的直接规定；\n- 公司可以选择由董事会或股东会作为决议机关；\n- 如果章程未明确规定，则应由股东会决议（重大事项原则）。\n\n#### 2. 关联担保（为股东或实际控制人提供担保）\n\n◆ **核心规则**：公司为公司股东或者实际控制人提供担保的，**必须经股东会决议**。这是法律的强制性规定，公司章程不得降低为董事会决议。\n\n关联担保的特殊要求：\n- **决议机关**：必须是股东会，不得由董事会决议替代；\n- **回避表决**：受担保的股东或者受实际控制人支配的股东，不得参加该事项的表决；\n- **表决通过**：该项表决由出席会议的其他股东所持表决权的过半数通过。\n\n#### 3. 上市公司对外担保的特别规定\n\n上市公司对外担保受到更为严格的监管：\n- 须遵守证券交易所的上市规则中关于担保的特别规定；\n- 必须及时履行信息披露义务；\n- 对外担保总额不得超过公司净资产的一定比例（交易所规则）；\n- 为控股股东、实际控制人及其关联方提供担保受到严格限制。\n\n### （二）《民法典》第504条：法定代表人越权代表\n\n◆ **核心规则**：法人的法定代表人或者非法人组织的负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，该代表行为有效，订立的合同对法人或者非法人组织发生效力。\n\n这一条文将越权担保的效力问题转化为**相对人善意与否的判断**：\n- 相对人善意 → 担保合同对公司发生效力；\n- 相对人非善意 → 担保合同对公司不发生效力。\n\n---\n\n## 三、善意相对人保护\n\n### （一）善意的认定标准\n\n◆ **核心规则**：根据《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（以下简称《担保制度解释》），善意相对人的认定标准为：\n\n> 相对人在订立担保合同时不知道且不应当知道法定代表人超越权限。相对人有证据证明已对公司决议进行了合理审查，人民法院应当认定其构成善意，但公司有证据证明相对人知道或者应当知道决议系伪造、变造的除外。\n\n**\"合理审查\"的内涵**：\n- 形式审查：审查是否有决议文件、决议机关是否正确、签章是否齐全；\n- 不要求实质审查：不要求相对人核实决议的真实性、签名的真伪；\n- 不要求审查公司章程：不要求相对人审查公司章程对担保的具体限制。\n\n### （二）未审查公司决议是否影响合同效力\n\n▲ **实务重难点**：司法实践中，最高人民法院的裁判立场经历了一定"},{"id":"实务-对赌协议实务","title":"实务-对赌协议实务","excerpt":"对赌协议（Valuation Adjustment Mechanism，VAM），又称估值调整协议，是投资方与融资方在达成股权融资协议时，为解决交易双方对目标公司未来发展的不确定性、信息不对称以及代理成本而设计的条款。其本质是一种附条件的合同履行安排——双方以目标公司未来的经营业绩或特定事件作为条件，约定相应的权利义务调整。 实务背景：在PE/VC股权投资中，投资方对目标公司的估值通常基于对未来盈","slug":"实务-对赌协议实务","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":8199,"created":"","updated":"","content":"# 实务：对赌协议实务\n\n## 一、问题引入：对赌协议的概念与实务背景\n\n**对赌协议**（Valuation Adjustment Mechanism，VAM），又称估值调整协议，是投资方与融资方在达成股权融资协议时，为解决交易双方对目标公司未来发展的不确定性、信息不对称以及代理成本而设计的条款。其本质是一种**附条件的合同履行安排**——双方以目标公司未来的经营业绩或特定事件作为条件，约定相应的权利义务调整。\n\n**实务背景**：在PE/VC股权投资中，投资方对目标公司的估值通常基于对未来盈利能力的预测。然而，未来充满不确定性：目标公司能否达到预期业绩？能否如期上市？管理团队能否兑现承诺？对赌协议正是为解决这些不确定性而生的商业工具。它将投资方的风险部分转移给融资方，同时给予融资方获取更高估值的机会，实现风险与收益的再平衡。\n\n**争议焦点**：对赌协议虽然是商业实践中的常见安排，但在司法实践中引发了大量争议，核心问题集中在两个层面：其一，对赌协议的**效力**如何认定？其二，即使有效，对赌条款的**实际履行**是否受到公司法资本制度的限制？这些问题涉及合同法的意思自治原则与公司法的资本维持原则之间的深层冲突。\n\n```mermaid\ngraph TD\n    A[\"对赌协议争议\"] --> B{\"对赌主体是谁？\"}\n    B --> C[\"投资方 vs 目标公司\"]\n    B --> D[\"投资方 vs 股东/实控人\"]\n    D --> E[\"原则上有效<br>（意思自治）\"]\n    C --> F{\"协议效力如何？\"}\n    F -->|\"无法定无效事由\"| G[\"协议有效\"]\n    F -->|\"存在法定无效事由\"| H[\"协议无效\"]\n    G --> I{\"条款能否实际履行？\"}\n    I --> J{\"是否符合<br>减资程序？\"}\n    J -->|\"股东会决议通过<br>债权人保护完成\"| K[\"可以履行\"]\n    J -->|\"无法通过减资程序\"| L[\"履行受限\"]\n    I --> M{\"是否符合<br>利润分配规则？\"}\n    M -->|\"有可分配利润\"| N[\"可以履行\"]\n    M -->|\"无可分配利润\"| O[\"履行受限\"]\n\n    style E fill:#6f9,stroke:#333\n    style H fill:#f66,stroke:#333\n    style K fill:#6f9,stroke:#333\n    style L fill:#f96,stroke:#333\n    style O fill:#f96,stroke:#333\n```\n\n---\n\n## 二、对赌协议的类型\n\n### （一）业绩补偿型\n\n**典型条款**：如目标公司在约定期限内未达到约定的业绩指标（如净利润、营业收入等），则融资方（目标公司股东或目标公司）向投资方支付现金补偿。\n\n**计算公式示例**：\n> 补偿金额 = 投资总额 x（1 - 实际净利润 / 承诺净利润）\n\n**实务特征**：业绩补偿型对赌是最常见的对赌形式，通常以年度净利润为核心指标，辅以营业收入、用户增长等辅助指标。其特点是触发频率高、争议点多集中在业绩数据的审计与确认上。\n\n### （二）股权回购型\n\n**典型条款**：如目标公司在约定期限内未完成约定目标（如上市、业绩指标等），则融资方以约定价格回购投资方持有的股权。\n\n**回购价格通常包括**：\n- 投资本金；\n- 固定收益（通常按年化8%-15%计算）；\n- 已宣告但未支付的利润。\n\n**实务特征**：股权回购型对赌通常在投资协议签署时即约定明确的回购价格公式，争议主要集中在回购条件是否成就以及回购义务的履行主体上。\n\n### （三）现金补偿 + 股权回购复合型\n\n实务中最常见的是将业绩补偿与股权回购结合的**复合型对赌条款**。典型结构如下：\n- **第一阶段**：未达业绩指标时，股东支付现金补偿；\n- **第二阶段**：连续未达标或未在约定期限内上市时，触发股权回购；\n- **第三阶段**：回购义务人无力回购时，触发担保条款或优先清算权。\n\n```mermaid\ngraph LR\n    A[\"投资完成\"] --> B{\"年度业绩达标？\"}\n    B -->|\"达标\"| C[\"正常持股\"]\n    B -->|\"未达标\"| D[\"触发现金补偿\"]\n    D --> E{\"连续未达标<br>或未按期上市？\"}\n    E -->|\"否\"| C\n    E -->|\"是\"| F[\"触发股权回购\"]\n    F --> G{\"回购义务人<br>能否履行？\"}\n    G -->|\"能\"| H[\"完成回购\"]\n    G -->|\"不能"},{"id":"实务-股权转让与出资责任","title":"实务-股权转让与出资责任","excerpt":"股权转让是公司法实务中最为常见的交易类型之一。在股权转让过程中，一个核心且复杂的问题是：转让人（原股东）的出资义务如何在转让人与受让人之间分配？ 这一问题在新《公司法》实施后变得尤为重要，原因在于： - 新《公司法》全面实行五年限期认缴制，大量存量公司面临调整出资期限的压力； - 未届期股权转让的情形将大幅增加； - 新《公司法》第88条明确了转让人的补充出资责任，这对股权转让实务产生了深远影响。","slug":"实务-股权转让与出资责任","module":"08-实务专题","moduleName":"实务专题","tags":[],"wordCount":3899,"created":"","updated":"","content":"# 实务：股权转让与出资责任\n\n## 一、问题引入：股权转让中出资责任如何分配\n\n股权转让是公司法实务中最为常见的交易类型之一。在股权转让过程中，一个核心且复杂的问题是：**转让人（原股东）的出资义务如何在转让人与受让人之间分配？**\n\n这一问题在新《公司法》实施后变得尤为重要，原因在于：\n- 新《公司法》全面实行**五年限期认缴制**，大量存量公司面临调整出资期限的压力；\n- **未届期股权转让**的情形将大幅增加；\n- 新[[📋 公司法知识库/00-公司法全文#第88条|《公司法》第88条]]明确了转让人的**补充出资责任**，这对股权转让实务产生了深远影响。\n\n```mermaid\ngraph TD\n    A[股权转让] --> B{出资是否已实缴?}\n    B -->|已实缴| C[正常转让<br>无出资责任问题]\n    B -->|未实缴| D{出资期限是否届满?}\n    D -->|已届满| E[瑕疵出资转让]\n    D -->|未届满| F[未届期股权转让]\n    E --> G[转让人承担出资责任<br>受让人知情则连带]\n    F --> H[受让人承担出资义务<br>转让人承担补充责任]\n    style E fill:#f96,stroke:#333\n    style F fill:#ff9,stroke:#333\n    style G fill:#f96,stroke:#333\n    style H fill:#ff9,stroke:#333\n    style C fill:#6f9,stroke:#333\n```\n\n---\n\n## 二、法律框架\n\n### （一）有限公司股权转让规则\n\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第84条|《公司法》第84条]]规定了有限公司股权转让的基本规则。\n\n**股东之间转让**：股东之间可以相互转让其全部或者部分股权，无需其他股东同意。\n\n**向股东以外的人转让**：\n- 应当将股权转让的有关事项书面通知其他股东；\n- 其他股东自接到书面通知之日起三十日内未答复的，视为同意转让；\n- 其他股东半数以上不同意转让的，不同意的股东应当购买该转让的股权；不购买的，视为同意转让；\n- 经股东同意转让的股权，在同等条件下，其他股东有优先购买权。\n\n**章程自治**：公司章程对股权转让另有规定的，从其规定。但章程不得禁止股权转让，只能对转让条件作出合理限制。\n\n### （二）股份公司股份转让规则\n\n[[📋 公司法知识库/00-公司法全文#第157条|《公司法》第157-164条]]规定了股份有限公司的股份转让规则：\n\n| 转让场所 | 限制类型 | 具体规则 |\n|----------|----------|----------|\n| 依法设立的证券交易场所 | 发起人 | 公司成立之日起一年内不得转让 |\n| 或按照国务院规定的其他方式 | 公司公开发行前已发行的股份 | 自公司股票在证券交易所上市交易之日起一年内不得转让 |\n| | 董监高 | 任职期间每年转让不超过所持股份的25%，离职后半年内不得转让 |\n\n---\n\n## 三、◆ 未届期股权转让\n\n### （一）新[[📋 公司法知识库/00-公司法全文#第88条|《公司法》第88条]]：转让人的补充出资责任\n\n◆ **核心规则**：[[📋 公司法知识库/00-公司法全文#第88条|《公司法》第88条]]第1款规定：\n\n> 股东转让已认缴出资但未届出资期限的股权的，由受让人承担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承担补充责任。\n\n这一条文确立了以下规则：\n\n**1. 受让人的出资义务**\n- 受让人取得股权后，承继该股权上附着的出资义务；\n- 受让人应当按照原出资期限缴纳出资；\n- 这是受让人作为股东的基本义务。\n\n**2. 转让人的补充出资责任**\n- 转让人不因股权转让而完全免除出资责任；\n- 当受让人未按期足额缴纳出资时，转让人承担**补充责任**；\n- 补充责任意味着：先由受让人承担责任，受让人不能清偿的部分由转让人承担。\n\n**3. 责任分配的逻辑**\n\n| 责任主体 | 责任类型 | 责任范围 | 责任顺序 |\n|----------|----------|----------|----------|\n| 受让人 | 直接责任 | 全部未缴出资 | 第一顺位 |\n| 转让人 | 补充责任 | 受让人不能清偿部分 | 第二顺位 |\n\n### （二）实务影响\n\n▲ **新[[📋 公司法知识库/00-公司法全文#第88条|《公司法》第88条]]对股权转让实务的重大影响**：\n- \"甩锅式转让\"不再可行——转让人不能通过"},{"id":"公司法核心法条索引","title":"公司法核心法条索引","excerpt":"法律依据：《中华人民共和国公司法》（2023年12月29日第十四届全国人民代表大会常务委员会第七次会议修订，2024年7月1日起施行，简称\"新公司法\"） 本文件是法条速查索引，按主题分类整理新公司法核心条款，方便实务查阅和研究。使用时请注意： - ◆ 标注：核心规则，实务中最常适用 - ▲ 标注：实务重难点，容易引发争议 - 关联知识点：链接到本知识库中的详细解析文件 - 建议配合各专题笔记文件使","slug":"公司法核心法条索引","module":"09-法条索引","moduleName":"法条索引","tags":[],"wordCount":11744,"created":"","updated":"","content":"# 公司法核心法条索引\n\n> **法律依据**：《中华人民共和国公司法》（2023年12月29日第十四届全国人民代表大会常务委员会第七次会议修订，2024年7月1日起施行，简称\"新公司法\"）\n\n## 使用说明\n\n本文件是**法条速查索引**，按主题分类整理新公司法核心条款，方便实务查阅和研究。使用时请注意：\n\n- **◆ 标注**：核心规则，实务中最常适用\n- **▲ 标注**：实务重难点，容易引发争议\n- **关联知识点**：链接到本知识库中的详细解析文件\n- 建议配合各专题笔记文件使用，本索引侧重\"速查定位\"，专题文件侧重\"深度理解\"\n\n### 条款引用说明\n\n- 条款序号均指2024年新公司法条文\n- 重大新旧法变化已在文末新旧对照表中标注\n- 关联法规（民法典、司法解释、九民纪要）见文末速查\n\n---\n\n## 一、公司设立与登记\n\n| 条款号 | 核心内容 | 关联知识点 |\n|--------|----------|------------|\n| [[📋 公司法知识库/00-公司法全文#第10条|第10条]] | 法定代表人的选任范围：代表公司执行公司事务的董事或者经理；辞任规则 | [[📋 公司法知识库/04-公司的能力]] |\n| [[📋 公司法知识库/00-公司法全文#第11条|第11条]] | 公司章程对公司、股东、董事、监事、高级管理人员具有约束力 | [[📋 公司法知识库/02-公司法基础理论]] |\n| [[📋 公司法知识库/00-公司法全文#第31条|第31条]] | 营业执照签发之日为公司成立之日 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第32条|第32条]] | 公司登记事项包括名称、住所、注册资本、经营范围、法定代表人姓名、股东等；登记事项应公示 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第34条|第34条]] | 公司登记事项未经登记或变更登记，不得对抗善意相对人 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第35条|第35条]] | 公司以其主要办事机构所在地为住所 | [[📋 公司法知识库/05-公司的设立]] |\n\n## 二、注册资本与出资 ◆\n\n> **新公司法重大变化区域**：2024年新公司法对出资制度作出重大修改，确立5年实缴期限，新增股东失权、出资加速到期等制度。\n\n| 条款号 | 核心内容 | 关联知识点 |\n|--------|----------|------------|\n| [[📋 公司法知识库/00-公司法全文#第46条|第46条]] | 有限公司章程应当载明事项：公司名称和住所、经营范围、注册资本、股东姓名或名称、出资方式和金额、公司机构及其产生办法、法定代表人等 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第47条|第47条]]◆ | **5年实缴期限**：全体股东认缴的出资额应自公司成立之日起五年内缴足。法律、行政法规及国务院另有规定的除外 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第48条|第48条]] | 股东可以用货币出资，也可以用实物、知识产权、土地使用权、**股权、债权**等可以用货币估价并可依法转让的非货币财产作价出资。不得以劳务、信用、商誉等出资 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第49条|第49条]] | 股东应按期足额缴纳出资，未按期缴纳的应承担违约责任 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第50条|第50条]]◆ | **出资瑕疵责任与发起人连带责任**：设立时股东未按期足额缴纳出资或非货币出资显著低于认缴额的，设立时的其他股东在出资不足范围内承担连带责任 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第52条|第52条]]◆ | **股东失权制度**：股东未按期出资，经催缴（宽限期≥60日）仍未缴纳的，董事会决议发出失权通知，自通知发出之日起丧失未缴纳出资的股权 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文#第53条|第53条]] | 公司成立后，股东不得抽逃出资。抽逃出资的，负有责任的董监高应承担连带赔偿责任 | [[📋 公司法知识库/05-公司的设立]] |\n| [[📋 公司法知识库/00-公司法全文"}]</script> <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script> <script>(function(){const base = "/gongsi-kb/";

    (function() {
      var dataEl = document.getElementById('search-data');
      if (!dataEl) return;
      var articlesData = JSON.parse(dataEl.textContent);
      var fuse = new Fuse(articlesData, {
        keys: [
          { name: 'title', weight: 0.4 },
          { name: 'tags', weight: 0.2 },
          { name: 'excerpt', weight: 0.2 },
          { name: 'content', weight: 0.2 },
        ],
        threshold: 0.4,
        includeScore: true,
        ignoreLocation: true,
        minMatchCharLength: 2,
      });

      var searchInput = document.getElementById('search-input');
      var resultsContainer = document.getElementById('search-results');
      var resultsCount = document.getElementById('results-count');
      var countNum = document.getElementById('count-num');
      var initialState = document.getElementById('initial-state');
      var tagButtons = document.querySelectorAll('.tag-btn');
      var activeTag = '';

      function formatWC(count) {
        return count >= 10000 ? (count / 10000).toFixed(1) + '万字' : count + '字';
      }

      function formatDateStr(d) {
        if (!d) return '';
        try { return new Date(d).toLocaleDateString('zh-CN'); } catch(e) { return d; }
      }

      function renderResults(results) {
        if (results.length === 0) {
          resultsContainer.innerHTML = '<div class="text-center py-12"><p class="text-gray-400 dark:text-gray-500">未找到匹配的文章</p></div>';
          return;
        }
        var base = window.__BASE_URL || '/';
        resultsContainer.innerHTML = results.map(function(r) {
          return '<a href="' + base + 'articles/' + r.slug + '/ " class="group flex items-start gap-5 py-4 border-b border-primary-200/60 dark:border-primary-800/30 transition-colors">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 mb-1.5">' +
          '<span class="text-[11px] px-1.5 py-0.5 rounded bg-primary-100 dark:bg-primary-800/40 text-gray-500 dark:text-gray-400">' + r.moduleName + '</span>' +
          r.tags.slice(0, 3).map(function(t) { return '<span class="text-[11px] text-gray-400 dark:text-gray-600">#' + t + '</span>'; }).join('') +
          '</div>' +
          '<h3 class="text-[15px] font-medium text-gray-800 dark:text-gray-200 group-hover:text-accent-700 dark:group-hover:text-accent-400 transition-colors leading-snug">' + r.title + '</h3>' +
          (r.excerpt ? '<p class="text-xs text-gray-400 dark:text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">' + r.excerpt + '</p>' : '') +
          '<div class="flex items-center gap-3 mt-2 text-[11px] text-gray-400 dark:text-gray-600">' +
          '<span>' + formatDateStr(r.updated || r.created) + '</span>' +
          '<span>·</span>' +
          '<span>' + formatWC(r.wordCount) + '</span>' +
          '</div></div>' +
          '<svg class="w-4 h-4 text-gray-300 dark:text-gray-700 group-hover:text-accent-500 transition-colors flex-shrink-0 mt-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>' +
          '</a>';
        }).join('');
      }

      function performSearch(query) {
        var results;
        if (query.length > 0) {
          results = fuse.search(query).map(function(r) { return r.item; });
        } else {
          results = articlesData;
        }
        if (activeTag) {
          results = results.filter(function(r) { return r.tags.indexOf(activeTag) !== -1; });
        }
        initialState.classList.add('hidden');
        resultsCount.classList.remove('hidden');
        countNum.textContent = results.length;
        renderResults(results);
      }

      var urlParams = new URLSearchParams(window.location.search);
      var queryParam = urlParams.get('q');
      var tagParam = urlParams.get('tag');
      if (queryParam) {
        searchInput.value = queryParam;
        performSearch(queryParam);
      }
      if (tagParam) {
        activeTag = tagParam;
        var tagBtn = document.querySelector('[data-tag="' + tagParam + '"]');
        if (tagBtn) tagBtn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
        performSearch(searchInput.value);
      }

      searchInput.addEventListener('input', function(e) {
        var q = e.target.value.trim();
        if (q.length === 0 && !activeTag) {
          resultsContainer.innerHTML = '';
          resultsCount.classList.add('hidden');
          initialState.classList.remove('hidden');
          return;
        }
        performSearch(q);
      });

      tagButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tag = btn.dataset.tag;
          if (activeTag === tag) {
            activeTag = '';
            btn.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          } else {
            tagButtons.forEach(function(b) { b.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300'); });
            activeTag = tag;
